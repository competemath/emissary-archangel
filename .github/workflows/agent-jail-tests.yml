# The agent jail's own tests (scripts/agent-tests): no Lean, no network, no secrets, no sudo. They fail if a spawn site of the Claude CLI in the
# bridge goes back to a deny-list or loses its tool set, if a vendored tengoku-warden file differs from its pin, if a workflow pipes an installer
# into a shell or uses an unpinned action, and they exercise the wrapper, the supervisor, the trace gate, the bank guard and the push helper.
# The jail itself (users, iptables, the escape battery) is proved on a runner by agent-selftest.yml.
name: agent-jail-tests
on:
  push:
    branches: [main]
    paths: ["scripts/**", "public/local-claude-bridge.mjs", ".github/workflows/**"]
  pull_request:
    paths: ["scripts/**", "public/local-claude-bridge.mjs", ".github/workflows/**"]
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            scripts
            public
            .github/workflows
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: Syntax of the bridge and of the scripts that changed with it
        run: |
          node --check public/local-claude-bridge.mjs
          node --check scripts/bank-flush.mjs
          node --check scripts/translate-finish.mjs
          shellcheck scripts/agent-selftest-smoke.sh
      - name: The bridge's tool exposure, as warden's own scanner sees it
        run: PYTHONPATH=scripts python3 -m warden toolpolicy scan-source --allow-skip-permissions public/local-claude-bridge.mjs
      - name: Unit tests (python)
        env: { PYTHONDONTWRITEBYTECODE: "1" }
        run: |
          set -o pipefail  # `| tail` would otherwise hide a failing test
          python3 -m unittest discover -s scripts/agent-tests 2>&1 | tail -25
      - name: Unit tests (node)
        run: node --test scripts/agent-tests/bridge-jail.test.mjs
