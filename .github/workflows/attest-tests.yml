# The statement attestation (scripts/attest/): its records, its invariants, that it cannot write where a record is banked, and what attest-statements.yml may do. No Lean, no network beyond the checkout.
name: attest-tests
on:
  push:
    paths: ["scripts/attest/**", "scripts/test-attest-statements.mjs", ".github/workflows/attest-statements.yml", ".github/workflows/attest-tests.yml", "public/local-claude-bridge.mjs"]
  pull_request:
    paths: ["scripts/attest/**", "scripts/test-attest-statements.mjs", ".github/workflows/attest-statements.yml", ".github/workflows/attest-tests.yml", "public/local-claude-bridge.mjs"]
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            scripts
            public
            .github/workflows
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: node scripts/test-attest-statements.mjs
      - run: node scripts/test-workflow-pins.mjs
