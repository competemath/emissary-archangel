name: bump-pickup
# Every hour: a library whose setup has finished gets its bump, one per run (scripts/bump/bump_pickup.py says which, and why not the others). It reads and dispatches; it runs no library's code and pushes
# nothing. LANE_ENABLED (the intake lane's kill switch) stops it too. A person can rehearse it with workflow_dispatch (dry_run prints what it would start).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run: { description: "Print what would start, start nothing", required: true, default: "true" }

permissions: {}

concurrency:
  group: bump-pickup
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  pickup:
    if: ${{ (github.event_name == 'workflow_dispatch' || vars.LANE_ENABLED == 'true') && github.ref == 'refs/heads/main' && github.repository == 'competemath/emissary-archangel' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45   # up to 30 of them waiting for runners (--wait-minutes): LANE_ENABLED is read when the job starts, so the wait is short enough for the kill switch to take effect soon
    permissions: { actions: write, contents: read }  # read the runs of the workflows, dispatch bump-sharded
    env: { GH_TOKEN: "${{ github.token }}", DRY: "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false' }}" }
    steps:
      - name: The script, the registry, and every library's setup record with its history
        run: |
          git clone -q --filter=blob:none --no-checkout "https://github.com/$GITHUB_REPOSITORY" emissary
          git -C emissary sparse-checkout set --no-cone "/scripts/bump/" "/sources.json" "/data/exports/*/setup.ci.json"
          git -C emissary checkout -q "$GITHUB_SHA"
      - name: Start the bump a finished setup is waiting for
        working-directory: emissary
        run: python3 scripts/bump/bump_pickup.py $([ "$DRY" = true ] && echo --dry-run || echo --wait-minutes 30)
