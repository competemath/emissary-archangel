# scripts/bump/BundleKeep.lean, ModuleAxioms.lean and ModuleClashes.lean, run by a real Lean on a small case: the program that decides which library constants a bundle keeps imports only Lean and loads the
# library at run time (the script it replaced was parsed with the library's tokens, and lost whole shards' theorems silently: bundle.py's header says how).
name: bundle-keep-tests
on:
  push:
    paths: ["scripts/bump/BundleKeep.lean", "scripts/bump/bundle.py", "scripts/bump/keep_closure.py", "scripts/bump/ModuleAxioms.lean", "scripts/bump/ModuleClashes.lean", "scripts/bump/tree_verify.py", "scripts/bump/tree_repair.py", "scripts/bump/TengokuLeak.lean", ".github/workflows/bundle-keep-tests.yml"]
  pull_request:
    paths: ["scripts/bump/BundleKeep.lean", "scripts/bump/bundle.py", "scripts/bump/keep_closure.py", "scripts/bump/ModuleAxioms.lean", "scripts/bump/ModuleClashes.lean", "scripts/bump/tree_verify.py", "scripts/bump/tree_repair.py", "scripts/bump/TengokuLeak.lean", ".github/workflows/bundle-keep-tests.yml"]
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            gate2
            scripts/bump
          persist-credentials: false
      - name: elan (the installer at a fixed commit, checked against its digest before it runs)
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The program keeps the passed theorem and what it stands on, in a module of Lean's own library
        working-directory: gate2
        run: |
          printf '%s' '{"imports": ["Init.Data.Nat.Basic"], "names": ["Nat.add_comm"], "libs": ["Init.Data.Nat.Basic"]}' > "$RUNNER_TEMP/keep.json"
          lake env lean --run ../scripts/bump/BundleKeep.lean "$RUNNER_TEMP/keep.json" | tee "$RUNNER_TEMP/keep.out"
          python3 - <<'PY'
          import json, os, re
          out = open(os.path.join(os.environ["RUNNER_TEMP"], "keep.out")).read()
          m = re.search(r"BUNDLE_KEEP (\[.*?\]) BUNDLE_END", out, re.S)
          assert m, out[-500:]
          kept = {tuple(x) for x in json.loads(m.group(1))}
          assert ("Init.Data.Nat.Basic", "Nat.add_comm") in kept, sorted(kept)[:20]
          assert all(mod == "Init.Data.Nat.Basic" for mod, _ in kept), "only the library's own modules are kept"
          print(len(kept), "constants kept, the passed theorem among them")
          PY
      # the graph of what is NOT kept (compose follows it from every declaration that is kept only because a text names it): the nodes are outside the keep set, every edge
      # joins two nodes, the tainted ones are nodes. keep_closure.parse_graph is the code that reads it in the factory.
      - name: The program prints the dependency graph of the constants it does not keep, and keep_closure reads it
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          sys.path.insert(0, "scripts/bump")
          import keep_closure
          out = open(os.path.join(os.environ["RUNNER_TEMP"], "keep.out")).read()
          kept = {tuple(x) for x in json.loads(re.search(r"BUNDLE_KEEP (\[.*?\]) BUNDLE_END", out, re.S).group(1))}
          assert "BUNDLE_GRAPH" in out, out[-500:]
          graph, tainted = keep_closure.parse_graph(out)
          nodes = set(graph) | {d for deps in graph.values() for d in deps} | set(tainted)
          assert nodes, "nothing is outside the keep set of a module of Lean's own library?"
          assert not (nodes & kept), sorted(nodes & kept)[:5]  # a kept constant is already in the bundle: it is never a node
          assert all(mod == "Init.Data.Nat.Basic" for mod, _ in nodes), "only the library's own modules"
          assert sum(len(v) for v in graph.values()) > 0, "no theorem of Init.Data.Nat.Basic uses another one?"
          print(len(graph), "constants with edges,", sum(len(v) for v in graph.values()), "edges,", len(tainted), "tainted,", len(kept), "kept")
          PY
      - name: A name that does not exist keeps nothing and does not fail the program
        working-directory: gate2
        run: |
          printf '%s' '{"imports": ["Init.Data.Nat.Basic"], "names": ["No.Such.theorem"], "libs": ["Init.Data.Nat.Basic"]}' > "$RUNNER_TEMP/keep2.json"
          lake env lean --run ../scripts/bump/BundleKeep.lean "$RUNNER_TEMP/keep2.json" | grep -q "BUNDLE_KEEP"
      # The axiom check of the tree-environment build: Init.Prelude declares `lcProof`, an axiom that is not one of the three allowed; its own declarations are the offenders.
      # What the program prints is read by tree_verify.axiom_offenders, the code that decides which modules the factory drops.
      - name: ModuleAxioms.lean names the module and the declaration that rest on an axiom, and tree_verify reads its output
        working-directory: gate2
        run: |
          printf 'Init.Prelude\nInit.Data.Nat.Basic\n' > "$RUNNER_TEMP/modules.txt"
          lake env lean --run ../scripts/bump/ModuleAxioms.lean "$RUNNER_TEMP/modules.txt" | tee "$RUNNER_TEMP/axioms.out"
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "../scripts/bump")
          import tree_verify as tv
          out = open(os.path.join(os.environ["RUNNER_TEMP"], "axioms.out")).read()
          got = tv.axiom_offenders(out, {"Init.Prelude", "Init.Data.Nat.Basic"})
          assert "Init.Prelude" in got, (got, out[-500:])
          assert any(d.startswith("lcProof [") and "lcProof" in d for d in got["Init.Prelude"]), got["Init.Prelude"]
          assert "Init.Data.Nat.Basic" not in got, "Nat.Basic rests on the three allowed axioms only: " + str(got.get("Init.Data.Nat.Basic"))
          assert tv.AXIOM_DONE.search(out).group("checked") != "0", "nothing was checked"
          print("offenders:", {m: len(v) for m, v in got.items()})
          PY
      - name: A module that does not exist is no clean run
        working-directory: gate2
        run: |
          printf 'No.Such.Module\n' > "$RUNNER_TEMP/none.txt"
          # (`! pipeline` never trips `set -e`: an explicit exit)
          if lake env lean --run ../scripts/bump/ModuleAxioms.lean "$RUNNER_TEMP/none.txt" 2>&1 | grep -q "^axioms: "; then echo "a module that does not exist produced a verdict"; exit 1; fi
      # The union check of the tree-environment build: two modules of the tree that declare the same name (a vendored copy of another library) stop `import Tengoku.All`. Three tiny modules are compiled
      # to oleans (core Lean only): A and B both declare Toy.clashing, C is clean. The program names the pair when one of them is new, names nothing when neither is, and tree_verify reads its output.
      - name: ModuleClashes.lean names the pair of modules that declare one name when one is new, and tree_verify reads its output
        working-directory: gate2
        run: |
          root="$RUNNER_TEMP/oleans"; src="$RUNNER_TEMP/clashsrc"
          mkdir -p "$root/Tengoku/LibA" "$root/Tengoku/LibB" "$root/Tengoku/LibC" "$src"
          # `Toy.clashing`: two definitions (a clash). `Toy.thmDup`: two theorems of the same type (Lean's import allows it: equation lemmas are generated where they are first used). `Toy.thmDiff`:
          # two theorems of different types (a clash). `Toy.ax`: the same axiom declared twice (a clash)
          printf 'def Toy.clashing := 1\ndef Toy.onlyA := 2\ntheorem Toy.thmDup : 1 = 1 := rfl\ntheorem Toy.thmDiff : 1 = 1 := rfl\naxiom Toy.ax : Nat\n' > "$src/A.lean"
          printf 'def Toy.clashing := 3\ndef Toy.onlyB := 4\ntheorem Toy.thmDup : 1 = 1 := by decide\ntheorem Toy.thmDiff : 2 = 2 := rfl\naxiom Toy.ax : Nat\n' > "$src/B.lean"
          printf 'def Toy.fine := 5\ntheorem Toy.thmDup : 1 = 1 := rfl\n' > "$src/C.lean"
          # D and E share only a definition whose name ends in a prime (the refusal prints it inside single quotes)
          printf "def Toy.prime' := 1\n" > "$src/D.lean"; printf "def Toy.prime' := 2\n" > "$src/E.lean"
          # `lean` wants the source inside its root directory: the root is the scratch directory (the module name is not used here: the program names a module by its path under the olean root)
          mkdir -p "$root/Tengoku/LibD" "$root/Tengoku/LibE"
          for m in A B C D E; do lake env lean --root="$src" -o "$root/Tengoku/Lib$m/$m.olean" "$src/$m.lean"; done
          printf 'Tengoku.LibB.B\nTengoku.LibC.C\n' > "$RUNNER_TEMP/new.txt"
          lake env lean --run ../scripts/bump/ModuleClashes.lean "$root" "$RUNNER_TEMP/new.txt" Tengoku | tee "$RUNNER_TEMP/clashes.out"
          : > "$RUNNER_TEMP/none.txt"
          lake env lean --run ../scripts/bump/ModuleClashes.lean "$root" "$RUNNER_TEMP/none.txt" Tengoku | tee "$RUNNER_TEMP/clashes-none.out"
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "../scripts/bump")
          import tree_verify as tv
          t = os.environ["RUNNER_TEMP"]
          out = open(os.path.join(t, "clashes.out")).read()
          got = tv.clash_offenders(out, {"Tengoku.LibB.B", "Tengoku.LibC.C"})
          assert list(got) == ["Tengoku.LibB.B"], (got, out)
          [one] = got["Tengoku.LibB.B"]
          # exactly the three names that Lean's import would refuse (the definition, the theorem with another type, the axiom), not `Toy.thmDup` (two theorems of one type)
          assert one.split(" ")[0] in ("Toy.clashing", "Toy.thmDiff", "Toy.ax") and "(+2 more)" in one and one.endswith("also declared by Tengoku.LibA.A"), got
          pair = [ln for ln in out.splitlines() if ln.startswith("CLASH") and "LibB.B" in ln and "LibA.A" in ln]
          assert len(pair) == 1 and pair[0].split("\t")[3] == "3", pair  # three names, not four
          assert tv.clash_offenders(out, {"Tengoku.LibC.C"}) == {}, "C declares nothing another module declares"
          none = open(os.path.join(t, "clashes-none.out")).read()
          assert tv.CLASH_DONE.search(none).group("pairs") == "0", none  # A and B clash, but neither is new: not this bundle's business
          print("clash pair named:", got)
          PY
      # The authority on the import of the whole tree is Lean: the toy oleans of the step above (A and B declare Toy.clashing, Toy.thmDiff and Toy.ax; A, B and C declare Toy.thmDup, a theorem of one type)
      # are imported by a real `lean`. It must refuse A with B and say which module and which name (tree_verify.union_failure reads that), and accept A with C (the duplicate theorem is allowed).
      - name: Lean refuses the import of two modules that declare one name, accepts duplicate theorems of one type, and tree_verify reads the refusal
        working-directory: gate2
        run: |
          root="$RUNNER_TEMP/oleans"
          lp="$root:$(lake env printenv LEAN_PATH)"
          printf 'import Tengoku.LibA.A\nimport Tengoku.LibB.B\n' > "$RUNNER_TEMP/U1.lean"
          printf 'import Tengoku.LibA.A\nimport Tengoku.LibC.C\n' > "$RUNNER_TEMP/U2.lean"
          printf 'import Tengoku.LibD.D\nimport Tengoku.LibE.E\n' > "$RUNNER_TEMP/U3.lean"
          if lake env env LEAN_PATH="$lp" lean "$RUNNER_TEMP/U1.lean" > "$RUNNER_TEMP/u1.out" 2>&1; then echo "A and B were imported together"; cat "$RUNNER_TEMP/u1.out"; exit 1; fi
          cat "$RUNNER_TEMP/u1.out"
          lake env env LEAN_PATH="$lp" lean "$RUNNER_TEMP/U2.lean"
          if lake env env LEAN_PATH="$lp" lean "$RUNNER_TEMP/U3.lean" > "$RUNNER_TEMP/u3.out" 2>&1; then echo "D and E were imported together"; exit 1; fi
          cat "$RUNNER_TEMP/u3.out"
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "../scripts/bump")
          import tree_verify as tv
          out = open(os.path.join(os.environ["RUNNER_TEMP"], "u1.out")).read()
          x, name, y = tv.union_failure(out)
          assert {x, y} == {"Tengoku.LibA.A", "Tengoku.LibB.B"}, (x, y, out)
          assert name in ("Toy.clashing", "Toy.thmDiff", "Toy.ax"), name  # a definition, a theorem of another type or an axiom: never Toy.thmDup
          print("refused:", x, "failed, both declare", name, "(with", y + ")")
          x3, name3, y3 = tv.union_failure(open(os.path.join(os.environ["RUNNER_TEMP"], "u3.out")).read())
          assert name3 == "Toy.prime'" and {x3, y3} == {"Tengoku.LibD.D", "Tengoku.LibE.E"}, (x3, name3, y3)  # a name with a prime is read whole
          print("primed name read whole:", name3)
          PY

      # The leak scan (scripts/bump/TengokuLeak.lean) on a small library compiled by a real Lean. An instance of ANOTHER library's class with outParams whose inputs and hypotheses mention
      # nothing of the library is a leak although its type does mention the library (lean-pool's GroupRing, 2026-10-16: `HMul R G (FreeModule R G)` for all R and G made every product of reals
      # in the tree a group-ring element). The shapes that are harmless must not be reported: an instance whose input is the library's type, one of the library's own class, one with a
      # hypothesis about the library. The old rule (the statement mentions nothing of the library) must still report its case. And the shape through the library's own class (the next comment).
      - name: The leak scan reports an unpinned instance of a foreign outParam class, an instance of an own class at foreign types, the old shape, and nothing harmless
        working-directory: gate2
        run: |
          d="$RUNNER_TEMP/leaktoy"
          mkdir -p "$d"
          cat > "$d/LeakToy.lean" <<'LEAN'
          structure Own where
            x : Nat

          class OwnCls (α : Type) (β : outParam Type) where
            f : α → β

          /-- pinned: the input is the library's own type -/
          instance pinnedHMul : HMul Own Own Own := ⟨fun a b => ⟨a.x * b.x⟩⟩

          /-- UNPINNED: an instance of a foreign outParam class, generic in its inputs (the shape of lean-pool's GroupRing) -/
          instance unpinnedHMul {R G : Type} : HMul R G (Own × R × G) := ⟨fun r g => (⟨0⟩, r, g)⟩

          /-- an instance of the library's own class: nothing else asks for it -/
          instance ownClassGeneric {α : Type} : OwnCls α α := ⟨id⟩

          /-- a hypothesis about the library: it cannot be met elsewhere -/
          instance guardedHMul {R G : Type} [OwnCls R Nat] : HMul R G (Own × R × G) := ⟨fun r g => (⟨0⟩, r, g)⟩

          /-- mentions nothing of the library (the rule before 2026-10-16) -/
          instance foreignOnly : HAdd Nat String String := ⟨fun n s => toString n ++ s⟩

          namespace Sc
          /-- not global: never a leak -/
          scoped instance scopedHMul {R G : Type} : HMul R G (Own × R × G) := ⟨fun r g => (⟨0⟩, r, g)⟩
          end Sc

          -- A class of the library with a projection into a foreign outParam class (`Tor.toHDiv : [Tor P I] → HDiv P P I`, the shape of prismriver's Torsor) is harmless until the library
          -- declares an instance of it at foreign types, also behind abbreviations: `Tor Alias Alias` is `Tor Nat Nat`, and `HDiv Nat Nat ?γ` finds `Tor.toHDiv` before `Nat.instHDiv`
          abbrev Alias := Nat
          abbrev OwnAlias := Own
          class Tor (P I : Type) extends HDiv P P I
          class Tor2 (P I : Type) extends Tor P I
          class Plain (α : Type) extends Add α

          /-- LEAK: the arguments are `Nat` and `Nat` once the abbreviation is unfolded -/
          instance torNat : Tor Alias Alias where hDiv a b := a / b

          /-- LEAK: through a projection of the library's class into a class that has one (`Tor2.toTor`) -/
          instance tor2Nat : Tor2 Alias Alias where hDiv a b := a / b

          /-- not a leak: the arguments are the library's own type -/
          instance torOwn : Tor Own Own where hDiv a _ := a

          /-- not a leak: an abbreviation of the library's own type is still the library's type -/
          instance torOwnAlias : Tor OwnAlias OwnAlias where hDiv a _ := a

          /-- not a leak: the projection of `Plain` is into `Add`, which has no outParams, so nothing about `Nat` changes -/
          instance plainNat : Plain Alias where add a b := a + b
          LEAN
          lake env lean --root="$d" -o "$d/LeakToy.olean" "$d/LeakToy.lean"
          lp="$d:$(lake env printenv LEAN_PATH)"
          lake env env LEAN_PATH="$lp" lean --run ../scripts/bump/TengokuLeak.lean --module LeakToy | tee "$RUNNER_TEMP/leaktoy.out"
          python3 - <<'PY'
          import os, re
          out = open(os.path.join(os.environ["RUNNER_TEMP"], "leaktoy.out")).read()
          leaks = {m.group(2) for m in re.finditer(r"^leak: (instance|simp) (\S+) registered in LeakToy", out, re.M)}
          assert leaks == {"unpinnedHMul", "foreignOnly", "torNat", "tor2Nat"}, (leaks, out)
          assert re.search(r"^leakscan: \d+ global instances \(4 can fire outside the library\), 1 scoped", out), out.splitlines()[0]
          print("reported:", sorted(leaks))
          PY
