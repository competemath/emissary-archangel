# scripts/bump/BundleKeep.lean, ModuleAxioms.lean, ModuleClashes.lean and ModuleFingerprint.lean, run by a real Lean on a small case: the program that decides which library constants a bundle keeps imports only Lean and loads the
# library at run time (the script it replaced was parsed with the library's tokens, and lost whole shards' theorems silently: bundle.py's header says how).
name: bundle-keep-tests
on:
  push:
    paths: ["scripts/bump/BundleKeep.lean", "scripts/bump/bundle.py", "scripts/bump/keep_closure.py", "scripts/bump/ModuleAxioms.lean", "scripts/bump/ModuleClashes.lean", "scripts/bump/ModuleFingerprint.lean", "scripts/bump/tree_dups.py", "scripts/bump/tree_verify.py", "scripts/bump/tree_repair.py", "scripts/bump/TengokuLeak.lean", ".github/workflows/bundle-keep-tests.yml"]
  pull_request:
    paths: ["scripts/bump/BundleKeep.lean", "scripts/bump/bundle.py", "scripts/bump/keep_closure.py", "scripts/bump/ModuleAxioms.lean", "scripts/bump/ModuleClashes.lean", "scripts/bump/ModuleFingerprint.lean", "scripts/bump/tree_dups.py", "scripts/bump/tree_verify.py", "scripts/bump/tree_repair.py", "scripts/bump/TengokuLeak.lean", ".github/workflows/bundle-keep-tests.yml"]
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            gate2
            scripts/bump
          persist-credentials: false
      - name: elan (the installer at a fixed commit, checked against its digest before it runs)
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The program keeps the passed theorem and what it stands on, in a module of Lean's own library
        working-directory: gate2
        run: |
          printf '%s' '{"imports": ["Init.Data.Nat.Basic"], "names": ["Nat.add_comm"], "libs": ["Init.Data.Nat.Basic"]}' > "$RUNNER_TEMP/keep.json"
          lake env lean --run ../scripts/bump/BundleKeep.lean "$RUNNER_TEMP/keep.json" | tee "$RUNNER_TEMP/keep.out"
          python3 - <<'PY'
          import json, os, re
          out = open(os.path.join(os.environ["RUNNER_TEMP"], "keep.out")).read()
          m = re.search(r"BUNDLE_KEEP (\[.*?\]) BUNDLE_END", out, re.S)
          assert m, out[-500:]
          kept = {tuple(x) for x in json.loads(m.group(1))}
          assert ("Init.Data.Nat.Basic", "Nat.add_comm") in kept, sorted(kept)[:20]
          assert all(mod == "Init.Data.Nat.Basic" for mod, _ in kept), "only the library's own modules are kept"
          print(len(kept), "constants kept, the passed theorem among them")
          PY
      # the graph of what is NOT kept (compose follows it from every declaration that is kept only because a text names it): the nodes are outside the keep set, every edge
      # joins two nodes, the tainted ones are nodes. keep_closure.parse_graph is the code that reads it in the factory.
      - name: The program prints the dependency graph of the constants it does not keep, and keep_closure reads it
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          sys.path.insert(0, "scripts/bump")
          import keep_closure
          out = open(os.path.join(os.environ["RUNNER_TEMP"], "keep.out")).read()
          kept = {tuple(x) for x in json.loads(re.search(r"BUNDLE_KEEP (\[.*?\]) BUNDLE_END", out, re.S).group(1))}
          assert "BUNDLE_GRAPH" in out, out[-500:]
          graph, tainted = keep_closure.parse_graph(out)
          nodes = set(graph) | {d for deps in graph.values() for d in deps} | set(tainted)
          assert nodes, "nothing is outside the keep set of a module of Lean's own library?"
          assert not (nodes & kept), sorted(nodes & kept)[:5]  # a kept constant is already in the bundle: it is never a node
          assert all(mod == "Init.Data.Nat.Basic" for mod, _ in nodes), "only the library's own modules"
          assert sum(len(v) for v in graph.values()) > 0, "no theorem of Init.Data.Nat.Basic uses another one?"
          print(len(graph), "constants with edges,", sum(len(v) for v in graph.values()), "edges,", len(tainted), "tainted,", len(kept), "kept")
          PY
      - name: A name that does not exist keeps nothing and does not fail the program
        working-directory: gate2
        run: |
          printf '%s' '{"imports": ["Init.Data.Nat.Basic"], "names": ["No.Such.theorem"], "libs": ["Init.Data.Nat.Basic"]}' > "$RUNNER_TEMP/keep2.json"
          lake env lean --run ../scripts/bump/BundleKeep.lean "$RUNNER_TEMP/keep2.json" | grep -q "BUNDLE_KEEP"
      # The axiom check of the tree-environment build: Init.Prelude declares `lcProof`, an axiom that is not one of the three allowed; its own declarations are the offenders.
      # What the program prints is read by tree_verify.axiom_offenders, the code that decides which modules the factory drops.
      - name: ModuleAxioms.lean names the module and the declaration that rest on an axiom, and tree_verify reads its output
        working-directory: gate2
        run: |
          printf 'Init.Prelude\nInit.Data.Nat.Basic\n' > "$RUNNER_TEMP/modules.txt"
          lake env lean --run ../scripts/bump/ModuleAxioms.lean "$RUNNER_TEMP/modules.txt" | tee "$RUNNER_TEMP/axioms.out"
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "../scripts/bump")
          import tree_verify as tv
          out = open(os.path.join(os.environ["RUNNER_TEMP"], "axioms.out")).read()
          got = tv.axiom_offenders(out, {"Init.Prelude", "Init.Data.Nat.Basic"})
          assert "Init.Prelude" in got, (got, out[-500:])
          assert any(d.startswith("lcProof [") and "lcProof" in d for d in got["Init.Prelude"]), got["Init.Prelude"]
          assert "Init.Data.Nat.Basic" not in got, "Nat.Basic rests on the three allowed axioms only: " + str(got.get("Init.Data.Nat.Basic"))
          assert tv.AXIOM_DONE.search(out).group("checked") != "0", "nothing was checked"
          print("offenders:", {m: len(v) for m, v in got.items()})
          PY
      - name: A module that does not exist is no clean run
        working-directory: gate2
        run: |
          printf 'No.Such.Module\n' > "$RUNNER_TEMP/none.txt"
          # (`! pipeline` never trips `set -e`: an explicit exit)
          if lake env lean --run ../scripts/bump/ModuleAxioms.lean "$RUNNER_TEMP/none.txt" 2>&1 | grep -q "^axioms: "; then echo "a module that does not exist produced a verdict"; exit 1; fi
      # The union check of the tree-environment build: two modules of the tree that declare the same name (a vendored copy of another library) stop `import Tengoku.All`. Three tiny modules are compiled
      # to oleans (core Lean only): A and B both declare Toy.clashing, C is clean. The program names the pair when one of them is new, names nothing when neither is, and tree_verify reads its output.
      - name: ModuleClashes.lean names the pair of modules that declare one name when one is new, and tree_verify reads its output
        working-directory: gate2
        run: |
          root="$RUNNER_TEMP/oleans"; src="$RUNNER_TEMP/clashsrc"
          mkdir -p "$root/Tengoku/LibA" "$root/Tengoku/LibB" "$root/Tengoku/LibC" "$src"
          # `Toy.clashing`: two definitions (a clash). `Toy.thmDup`: two theorems of the same type (Lean's import allows it: equation lemmas are generated where they are first used). `Toy.thmDiff`:
          # two theorems of different types (a clash). `Toy.ax`: the same axiom declared twice (a clash)
          printf 'def Toy.clashing := 1\ndef Toy.onlyA := 2\ntheorem Toy.thmDup : 1 = 1 := rfl\ntheorem Toy.thmDiff : 1 = 1 := rfl\naxiom Toy.ax : Nat\n' > "$src/A.lean"
          printf 'def Toy.clashing := 3\ndef Toy.onlyB := 4\ntheorem Toy.thmDup : 1 = 1 := by decide\ntheorem Toy.thmDiff : 2 = 2 := rfl\naxiom Toy.ax : Nat\n' > "$src/B.lean"
          printf 'def Toy.fine := 5\ntheorem Toy.thmDup : 1 = 1 := rfl\n' > "$src/C.lean"
          # D and E share only a definition whose name ends in a prime (the refusal prints it inside single quotes)
          printf "def Toy.prime' := 1\n" > "$src/D.lean"; printf "def Toy.prime' := 2\n" > "$src/E.lean"
          # `lean` wants the source inside its root directory: the root is the scratch directory (the module name is not used here: the program names a module by its path under the olean root)
          mkdir -p "$root/Tengoku/LibD" "$root/Tengoku/LibE"
          for m in A B C D E; do lake env lean --root="$src" -o "$root/Tengoku/Lib$m/$m.olean" "$src/$m.lean"; done
          printf 'Tengoku.LibB.B\nTengoku.LibC.C\n' > "$RUNNER_TEMP/new.txt"
          lake env lean --run ../scripts/bump/ModuleClashes.lean "$root" "$RUNNER_TEMP/new.txt" Tengoku | tee "$RUNNER_TEMP/clashes.out"
          : > "$RUNNER_TEMP/none.txt"
          lake env lean --run ../scripts/bump/ModuleClashes.lean "$root" "$RUNNER_TEMP/none.txt" Tengoku | tee "$RUNNER_TEMP/clashes-none.out"
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "../scripts/bump")
          import tree_verify as tv
          t = os.environ["RUNNER_TEMP"]
          out = open(os.path.join(t, "clashes.out")).read()
          got = tv.clash_offenders(out, {"Tengoku.LibB.B", "Tengoku.LibC.C"})
          assert list(got) == ["Tengoku.LibB.B"], (got, out)
          [one] = got["Tengoku.LibB.B"]
          # exactly the three names that Lean's import would refuse (the definition, the theorem with another type, the axiom), not `Toy.thmDup` (two theorems of one type)
          assert one.split(" ")[0] in ("Toy.clashing", "Toy.thmDiff", "Toy.ax") and "(+2 more)" in one and one.endswith("also declared by Tengoku.LibA.A"), got
          pair = [ln for ln in out.splitlines() if ln.startswith("CLASH") and "LibB.B" in ln and "LibA.A" in ln]
          assert len(pair) == 1 and pair[0].split("\t")[3] == "3", pair  # three names, not four
          assert tv.clash_offenders(out, {"Tengoku.LibC.C"}) == {}, "C declares nothing another module declares"
          none = open(os.path.join(t, "clashes-none.out")).read()
          assert tv.CLASH_DONE.search(none).group("pairs") == "0", none  # A and B clash, but neither is new: not this bundle's business
          print("clash pair named:", got)
          PY
      # The fingerprint of the copies of tree modules (tree_dups.py). Toy modules compiled to oleans (core Lean only): I is the tree's module and M a copy of it (the same text); D declares the same names
      # with another body (`Toy.f`) and other binders (`Toy.imp`); X imports M, Y is X's text on I, Z is X's text on D. What the program must show, read by tree_dups.py (the code that decides):
      #   M's declarations have I's fingerprints, and D's do not: `Toy.f` differs, and `Toy.g` and `Toy.t` differ although their TEXT is the same, because they stand on `Toy.f` (the fingerprint is deep);
      #   a proof is not read (`Toy.p1`: two proofs of one statement, one fingerprint); a binder annotation is (`Toy.imp`: `{n}` against `(n)`);
      #   X on the copy = Y on the tree's module, declaration for declaration, and X on D is not (what the swap check compares);
      #   a seed module is a leaf unless it is named in the second file;
      #   every module is fingerprinted in an environment of its own: I and M declare the same names, and a run that names both (lean-pool, 2026-10-19: one import clash lost a whole batch) gives each its
      #   fingerprints; a module that is not there (`No.Such.Module`) is an `FPERR` of its own and costs the others nothing.
      - name: ModuleFingerprint.lean fingerprints a copy like the tree's module, and tree_dups reads its output
        working-directory: gate2
        run: |
          root="$RUNNER_TEMP/fpoleans"; src="$RUNNER_TEMP/fpsrc"
          for m in LibI/I LibM/M LibD/D LibX/X LibY/Y LibZ/Z LibW/W Seed/S; do mkdir -p "$root/Tengoku/$(dirname $m)" "$src/Tengoku/$(dirname $m)"; done
          printf 'def Toy.f (n : Nat) : Nat := n + 1\ndef Toy.g (n : Nat) : Nat := Toy.f n * 2\ntheorem Toy.t (n : Nat) : Toy.g n = Toy.f n * 2 := rfl\ntheorem Toy.p1 : 1 = 1 := rfl\ntheorem Toy.imp {n : Nat} : n = n := rfl\n' > "$src/Tengoku/LibI/I.lean"
          cp "$src/Tengoku/LibI/I.lean" "$src/Tengoku/LibM/M.lean"
          printf 'def Toy.f (n : Nat) : Nat := n + 2\ndef Toy.g (n : Nat) : Nat := Toy.f n * 2\ntheorem Toy.t (n : Nat) : Toy.g n = Toy.f n * 2 := rfl\ntheorem Toy.p1 : 1 = 1 := by decide\ntheorem Toy.imp (n : Nat) : n = n := rfl\n' > "$src/Tengoku/LibD/D.lean"
          for pair in "X:M" "Y:I" "Z:D"; do
            u="${pair%%:*}"; lib="${pair##*:}"
            printf 'import Tengoku.Lib%s.%s\n\ndef X.h (n : Nat) : Nat := Toy.g n + 1\ntheorem X.u : X.h 0 = Toy.f 0 * 2 + 1 := rfl\n' "$lib" "$lib" > "$src/Tengoku/Lib$u/$u.lean"
          done
          printf 'def S.v : Nat := 1\n' > "$src/Tengoku/Seed/S.lean"
          printf 'import Tengoku.Seed.S\n\ndef Toy.w : Nat := S.v + 1\n' > "$src/Tengoku/LibW/W.lean"
          lp="$root:$(lake env printenv LEAN_PATH)"
          for m in Seed/S LibI/I LibM/M LibD/D LibW/W LibX/X LibY/Y LibZ/Z; do
            lake env env LEAN_PATH="$lp" lean --root="$src" -o "$root/Tengoku/$m.olean" "$src/Tengoku/$m.lean"
          done
          fp() { lake env env LEAN_PATH="$lp" lean --run ../scripts/bump/ModuleFingerprint.lean "$@"; }
          printf 'Tengoku.LibM.M\nTengoku.LibX.X\n' > "$RUNNER_TEMP/fp-xm.txt"; fp "$RUNNER_TEMP/fp-xm.txt" | tee "$RUNNER_TEMP/fp-xm.out"
          printf 'Tengoku.LibI.I\n' > "$RUNNER_TEMP/fp-i.txt"; fp "$RUNNER_TEMP/fp-i.txt" > "$RUNNER_TEMP/fp-i.out"
          printf 'Tengoku.LibD.D\nTengoku.LibZ.Z\n' > "$RUNNER_TEMP/fp-dz.txt"; fp "$RUNNER_TEMP/fp-dz.txt" > "$RUNNER_TEMP/fp-dz.out"
          printf 'Tengoku.LibY.Y\n' > "$RUNNER_TEMP/fp-y.txt"; fp "$RUNNER_TEMP/fp-y.txt" > "$RUNNER_TEMP/fp-y.out"
          printf 'Tengoku.LibW.W\n' > "$RUNNER_TEMP/fp-w.txt"; fp "$RUNNER_TEMP/fp-w.txt" > "$RUNNER_TEMP/fp-w1.out"
          printf 'Tengoku.Seed.S\n' > "$RUNNER_TEMP/fp-s.txt"; fp "$RUNNER_TEMP/fp-w.txt" "$RUNNER_TEMP/fp-s.txt" > "$RUNNER_TEMP/fp-w2.out"
          printf 'Tengoku.LibI.I\nNo.Such.Module\nTengoku.LibM.M\n' > "$RUNNER_TEMP/fp-mix.txt"; fp "$RUNNER_TEMP/fp-mix.txt" > "$RUNNER_TEMP/fp-mix.out"
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "../scripts/bump")
          import tree_dups as td
          t = os.environ["RUNNER_TEMP"]
          read = lambda n: td.parse_fp(open(os.path.join(t, n)).read())
          xm, i, dz, y, w1, w2, mix = read("fp-xm.out"), read("fp-i.out"), read("fp-dz.out"), read("fp-y.out"), read("fp-w1.out"), read("fp-w2.out"), read("fp-mix.out")
          M, I, D, X, Y, Z = "Tengoku.LibM.M", "Tengoku.LibI.I", "Tengoku.LibD.D", "Tengoku.LibX.X", "Tengoku.LibY.Y", "Tengoku.LibZ.Z"
          assert {"Toy.f", "Toy.g", "Toy.t", "Toy.p1", "Toy.imp"} <= set(xm[M]), sorted(xm[M])
          assert xm[M] == i[I], "the copy is the tree's module declaration for declaration"
          assert td.decide(M, [I], xm, i)[0] == [I]
          assert td.decide(D, [I], dz, i)[0] is None
          for n in ("Toy.f", "Toy.g", "Toy.t"):
              assert dz[D][n] != i[I][n], n + " must differ: it stands on another Toy.f"
          assert dz[D]["Toy.p1"] == i[I]["Toy.p1"], "a proof is not read"
          assert dz[D]["Toy.imp"] != i[I]["Toy.imp"], "a binder annotation is read"
          assert xm[X] == y[Y], "the importer is exactly what it was on the tree's module"
          assert xm[X] != dz[Z], "the importer on a different module is not"
          assert all(len(h) == 32 for _, h in xm[M].values())
          assert w1["Tengoku.LibW.W"]["Toy.w"] != w2["Tengoku.LibW.W"]["Toy.w"], "a seed module named in the second file is compared whole"
          assert mix["Tengoku.LibI.I"] == i[I] and mix[M] == i[I], "two modules that declare the same names are each fingerprinted, in one run"
          assert "No.Such.Module" in mix.errors and "No.Such.Module" not in mix, "a module that is not there is an error of its own and no verdict"
          print("fingerprints agree where they must and differ where they must")
          PY
      - name: ModuleFingerprint.lean is no clean run on a module that is not there
        working-directory: gate2
        run: |
          printf 'No.Such.Module\n' > "$RUNNER_TEMP/nofp.txt"
          out=$(lake env lean --run ../scripts/bump/ModuleFingerprint.lean "$RUNNER_TEMP/nofp.txt" 2>&1) || true
          echo "$out"
          if ! echo "$out" | grep -q "^FPERR"$'\t'"No.Such.Module"; then echo "a module that does not exist was not reported"; exit 1; fi
          if echo "$out" | grep -q "^FPEND"; then echo "a module that does not exist produced a verdict"; exit 1; fi
      # A forked copy (tree_dups.py): the library module wrapped in a namespace (`ToyFork`) by `apply_fork_text`, built, and fingerprinted with the namespace left off (FP_STRIP). Toy modules, core Lean only:
      #   D declares `Nat.dbl` (2 * n) and a constant that stands on it; V stands on D by an explicit name (`Nat.dbl 3`); W stands on D by dot notation (`(3 : Nat).dbl`); T declares another `Nat.dbl` (n + n).
      #   Df, Vf are D and V wrapped (Vf imports Df); Wb is W wrapped, which also imports T. What the program must show, read by tree_dups.py:
      #   the wrapped copy and its importer are, declaration for declaration, what they were (Nat.dbl, Toy2.k; Toy2.w, Toy2.u); the namespace is left off only when FP_STRIP says so;
      #   and W is NOT Wb: wrapped, dot notation finds T's `Nat.dbl` (a name that resolves to another declaration compiles, and the fingerprint of what stands on it is not the original's).
      - name: ModuleFingerprint.lean reads a wrapped copy as the original, and sees a name that now resolves to another declaration
        working-directory: gate2
        run: |
          root="$RUNNER_TEMP/fp2oleans"; src="$RUNNER_TEMP/fp2src"
          for m in LibT/T LibD/D LibV/V LibW/W LibDf/Df LibVf/Vf LibWb/Wb; do mkdir -p "$root/Tengoku/$(dirname $m)" "$src/Tengoku/$(dirname $m)"; done
          printf 'def Nat.dbl (n : Nat) : Nat := n + n\n' > "$src/Tengoku/LibT/T.lean"
          printf 'def Nat.dbl (n : Nat) : Nat := 2 * n\ndef Toy2.k : Nat := Nat.dbl 4\n' > "$src/Tengoku/LibD/D.lean"
          printf 'import Tengoku.LibD.D\n\ntheorem Toy2.w : Nat.dbl 3 = 6 := rfl\ntheorem Toy2.u : Toy2.k = 8 := rfl\n' > "$src/Tengoku/LibV/V.lean"
          printf 'import Tengoku.LibD.D\n\ntheorem Toy2.d : (3 : Nat).dbl = 6 := rfl\n' > "$src/Tengoku/LibW/W.lean"
          RUNNER_SRC="$src" python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "../scripts/bump")
          import tree_dups as td
          src = os.environ["RUNNER_SRC"] + "/Tengoku/"
          read = lambda p: open(src + p).read()
          def put(p, text):
              assert text is not None, p
              open(src + p, "w").write(text)
          put("LibDf/Df.lean", td.apply_fork_text(read("LibD/D.lean"), "ToyFork"))
          put("LibVf/Vf.lean", td.apply_fork_text(read("LibV/V.lean").replace("Tengoku.LibD.D", "Tengoku.LibDf.Df"), "ToyFork"))
          put("LibWb/Wb.lean", td.apply_fork_text(read("LibW/W.lean").replace("Tengoku.LibD.D", "Tengoku.LibDf.Df").replace("import Tengoku.LibDf.Df", "import Tengoku.LibDf.Df\nimport Tengoku.LibT.T"), "ToyFork"))
          PY
          lp="$root:$(lake env printenv LEAN_PATH)"
          for m in LibT/T LibD/D LibV/V LibW/W LibDf/Df LibVf/Vf LibWb/Wb; do
            lake env env LEAN_PATH="$lp" lean --root="$src" -o "$root/Tengoku/$m.olean" "$src/Tengoku/$m.lean"
          done
          fp() { lake env env LEAN_PATH="$lp" FP_STRIP=ToyFork lean --run ../scripts/bump/ModuleFingerprint.lean "$@"; }
          printf 'Tengoku.LibD.D\nTengoku.LibV.V\nTengoku.LibW.W\n' > "$RUNNER_TEMP/fp2-orig.txt"; fp "$RUNNER_TEMP/fp2-orig.txt" > "$RUNNER_TEMP/fp2-orig.out"
          printf 'Tengoku.LibDf.Df\nTengoku.LibVf.Vf\nTengoku.LibWb.Wb\n' > "$RUNNER_TEMP/fp2-wrap.txt"; fp "$RUNNER_TEMP/fp2-wrap.txt" > "$RUNNER_TEMP/fp2-wrap.out"
          lake env env LEAN_PATH="$lp" lean --run ../scripts/bump/ModuleFingerprint.lean "$RUNNER_TEMP/fp2-wrap.txt" > "$RUNNER_TEMP/fp2-nostrip.out"
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "../scripts/bump")
          import tree_dups as td
          t = os.environ["RUNNER_TEMP"]
          read = lambda n: td.parse_fp(open(os.path.join(t, n)).read())
          o, w, ns = read("fp2-orig.out"), read("fp2-wrap.out"), read("fp2-nostrip.out")
          assert not o.errors and not w.errors, (o.errors, w.errors)
          D, V, W, Df, Vf, Wb = "Tengoku.LibD.D", "Tengoku.LibV.V", "Tengoku.LibW.W", "Tengoku.LibDf.Df", "Tengoku.LibVf.Vf", "Tengoku.LibWb.Wb"
          assert set(o[D]) == {"Nat.dbl", "Toy2.k"} and set(o[V]) == {"Toy2.w", "Toy2.u"}, (sorted(o[D]), sorted(o[V]))
          assert o[D] == w[Df], "the wrapped copy is the original, declaration for declaration"
          assert o[V] == w[Vf], "what imports it, wrapped, is what it was"
          assert o[W] != w[Wb], "wrapped, `(3 : Nat).dbl` finds T's Nat.dbl: it compiles and is another declaration"
          assert set(ns[Df]) == {"ToyFork.Nat.dbl", "ToyFork.Toy2.k"}, "without FP_STRIP the namespace is part of the name"
          print("a wrapped copy reads as the original; a name that resolves elsewhere does not")
          PY
      # The form every file of lean-pool has (4,130 of 4,131): Lean's module system, `module`, `public import`, `@[expose] public section` left open at the end. `apply_fork_text` puts the namespace under
      # the imports and closes nothing (an `end` would be an error here); the wrapped importer, built on the wrapped copy, is what it was: the same declarations after the namespace is left off.
      - name: ModuleFingerprint.lean reads a wrapped file of Lean's module system as the original
        working-directory: gate2
        run: |
          root="$RUNNER_TEMP/fp3oleans"; src="$RUNNER_TEMP/fp3src"
          for m in LibM3/M3 LibV3/V3 LibM3f/M3f LibV3f/V3f; do mkdir -p "$root/Tengoku/$(dirname $m)" "$src/Tengoku/$(dirname $m)"; done
          printf 'module\n\n@[expose] public section\n\ndef Toy3.m : Nat := 5\n\ntheorem Toy3.t : Toy3.m = 5 := rfl\n' > "$src/Tengoku/LibM3/M3.lean"
          printf 'module\n\npublic import Tengoku.LibM3.M3\n\n@[expose] public section\n\ntheorem Toy3.u : Toy3.m = 5 := rfl\n' > "$src/Tengoku/LibV3/V3.lean"
          RUNNER_SRC="$src" python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "../scripts/bump")
          import tree_dups as td
          src = os.environ["RUNNER_SRC"] + "/Tengoku/"
          read = lambda p: open(src + p).read()
          def put(p, text):
              assert text is not None, p
              open(src + p, "w").write(text)
          put("LibM3f/M3f.lean", td.apply_fork_text(read("LibM3/M3.lean"), "ToyFork"))
          put("LibV3f/V3f.lean", td.apply_fork_text(read("LibV3/V3.lean").replace("Tengoku.LibM3.M3", "Tengoku.LibM3f.M3f"), "ToyFork"))
          PY
          cat "$src/Tengoku/LibV3f/V3f.lean"
          lp="$root:$(lake env printenv LEAN_PATH)"
          for m in LibM3/M3 LibV3/V3 LibM3f/M3f LibV3f/V3f; do
            lake env env LEAN_PATH="$lp" lean --root="$src" -o "$root/Tengoku/$m.olean" "$src/Tengoku/$m.lean"
          done
          fp() { lake env env LEAN_PATH="$lp" FP_STRIP=ToyFork lean --run ../scripts/bump/ModuleFingerprint.lean "$@"; }
          printf 'Tengoku.LibM3.M3\nTengoku.LibV3.V3\n' > "$RUNNER_TEMP/fp3-orig.txt"; fp "$RUNNER_TEMP/fp3-orig.txt" > "$RUNNER_TEMP/fp3-orig.out"
          printf 'Tengoku.LibM3f.M3f\nTengoku.LibV3f.V3f\n' > "$RUNNER_TEMP/fp3-wrap.txt"; fp "$RUNNER_TEMP/fp3-wrap.txt" > "$RUNNER_TEMP/fp3-wrap.out"
          cat "$RUNNER_TEMP/fp3-orig.out" "$RUNNER_TEMP/fp3-wrap.out"
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "../scripts/bump")
          import tree_dups as td
          t = os.environ["RUNNER_TEMP"]
          read = lambda n: td.parse_fp(open(os.path.join(t, n)).read())
          o, w = read("fp3-orig.out"), read("fp3-wrap.out")
          assert not o.errors and not w.errors, (o.errors, w.errors)
          assert set(o["Tengoku.LibM3.M3"]) == {"Toy3.m", "Toy3.t"} and set(o["Tengoku.LibV3.V3"]) == {"Toy3.u"}, (sorted(o["Tengoku.LibM3.M3"]), sorted(o["Tengoku.LibV3.V3"]))
          assert o["Tengoku.LibM3.M3"] == w["Tengoku.LibM3f.M3f"], "the wrapped file of the module system is the original, declaration for declaration"
          assert o["Tengoku.LibV3.V3"] == w["Tengoku.LibV3f.V3f"], "what imports it, wrapped, is what it was"
          print("a wrapped file of the module system reads as the original")
          PY
      # The authority on the import of the whole tree is Lean: the toy oleans of the step above (A and B declare Toy.clashing, Toy.thmDiff and Toy.ax; A, B and C declare Toy.thmDup, a theorem of one type)
      # are imported by a real `lean`. It must refuse A with B and say which module and which name (tree_verify.union_failure reads that), and accept A with C (the duplicate theorem is allowed).
      - name: Lean refuses the import of two modules that declare one name, accepts duplicate theorems of one type, and tree_verify reads the refusal
        working-directory: gate2
        run: |
          root="$RUNNER_TEMP/oleans"
          lp="$root:$(lake env printenv LEAN_PATH)"
          printf 'import Tengoku.LibA.A\nimport Tengoku.LibB.B\n' > "$RUNNER_TEMP/U1.lean"
          printf 'import Tengoku.LibA.A\nimport Tengoku.LibC.C\n' > "$RUNNER_TEMP/U2.lean"
          printf 'import Tengoku.LibD.D\nimport Tengoku.LibE.E\n' > "$RUNNER_TEMP/U3.lean"
          if lake env env LEAN_PATH="$lp" lean "$RUNNER_TEMP/U1.lean" > "$RUNNER_TEMP/u1.out" 2>&1; then echo "A and B were imported together"; cat "$RUNNER_TEMP/u1.out"; exit 1; fi
          cat "$RUNNER_TEMP/u1.out"
          lake env env LEAN_PATH="$lp" lean "$RUNNER_TEMP/U2.lean"
          if lake env env LEAN_PATH="$lp" lean "$RUNNER_TEMP/U3.lean" > "$RUNNER_TEMP/u3.out" 2>&1; then echo "D and E were imported together"; exit 1; fi
          cat "$RUNNER_TEMP/u3.out"
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "../scripts/bump")
          import tree_verify as tv
          out = open(os.path.join(os.environ["RUNNER_TEMP"], "u1.out")).read()
          x, name, y = tv.union_failure(out)
          assert {x, y} == {"Tengoku.LibA.A", "Tengoku.LibB.B"}, (x, y, out)
          assert name in ("Toy.clashing", "Toy.thmDiff", "Toy.ax"), name  # a definition, a theorem of another type or an axiom: never Toy.thmDup
          print("refused:", x, "failed, both declare", name, "(with", y + ")")
          x3, name3, y3 = tv.union_failure(open(os.path.join(os.environ["RUNNER_TEMP"], "u3.out")).read())
          assert name3 == "Toy.prime'" and {x3, y3} == {"Tengoku.LibD.D", "Tengoku.LibE.E"}, (x3, name3, y3)  # a name with a prime is read whole
          print("primed name read whole:", name3)
          PY

      # The leak scan (scripts/bump/TengokuLeak.lean) on a small library compiled by a real Lean. An instance of ANOTHER library's class with outParams whose inputs and hypotheses mention
      # nothing of the library is a leak although its type does mention the library (lean-pool's GroupRing, 2026-10-16: `HMul R G (FreeModule R G)` for all R and G made every product of reals
      # in the tree a group-ring element). The shapes that are harmless must not be reported: an instance whose input is the library's type, one of the library's own class, one with a
      # hypothesis about the library. The old rule (the statement mentions nothing of the library) must still report its case. And the shape through the library's own class (the next comment).
      - name: The leak scan reports an unpinned instance of a foreign outParam class, an instance of an own class at foreign types, the old shape, notation and tokens, and nothing harmless
        working-directory: gate2
        run: |
          d="$RUNNER_TEMP/leaktoy"
          mkdir -p "$d"
          cat > "$d/LeakToy.lean" <<'LEAN'
          structure Own where
            x : Nat

          class OwnCls (α : Type) (β : outParam Type) where
            f : α → β

          /-- pinned: the input is the library's own type -/
          instance pinnedHMul : HMul Own Own Own := ⟨fun a b => ⟨a.x * b.x⟩⟩

          /-- UNPINNED: an instance of a foreign outParam class, generic in its inputs (the shape of lean-pool's GroupRing) -/
          instance unpinnedHMul {R G : Type} : HMul R G (Own × R × G) := ⟨fun r g => (⟨0⟩, r, g)⟩

          /-- an instance of the library's own class, generic in its input: nothing outside the library asks for the class, so it never fires there -/
          class Coll (α : Type) (β : outParam Type) where
            g : α → β
          instance collGeneric {α : Type} : Coll α α := ⟨id⟩

          /-- the library's own class at the library's own type: `guardedHMul` below asks for `OwnCls R Nat`, which this cannot answer -/
          instance ownClassOwn : OwnCls Own Own := ⟨id⟩

          /-- a hypothesis about the library: it cannot be met elsewhere -/
          instance guardedHMul {R G : Type} [OwnCls R Nat] : HMul R G (Own × R × G) := ⟨fun r g => (⟨0⟩, r, g)⟩

          /-- mentions nothing of the library (the rule before 2026-10-16) -/
          instance foreignOnly : HAdd Nat String String := ⟨fun n s => toString n ++ s⟩

          namespace Sc
          /-- not global: never a leak -/
          scoped instance scopedHMul {R G : Type} : HMul R G (Own × R × G) := ⟨fun r g => (⟨0⟩, r, g)⟩
          end Sc

          -- A class of the library with a projection into a foreign outParam class (`Tor.toHDiv : [Tor P I] → HDiv P P I`, the shape of prismriver's Torsor) is harmless until the library
          -- declares an instance of it at foreign types, also behind abbreviations: `Tor Alias Alias` is `Tor Nat Nat`, and `HDiv Nat Nat ?γ` finds `Tor.toHDiv` before `Nat.instHDiv`
          abbrev Alias := Nat
          abbrev OwnAlias := Own
          class Tor (P I : Type) extends HDiv P P I
          class Tor2 (P I : Type) extends Tor P I
          class Plain (α : Type) extends Add α

          /-- LEAK: the arguments are `Nat` and `Nat` once the abbreviation is unfolded -/
          instance torNat : Tor Alias Alias where hDiv a b := a / b

          /-- LEAK: through a projection of the library's class into a class that has one (`Tor2.toTor`) -/
          instance tor2Nat : Tor2 Alias Alias where hDiv a b := a / b

          /-- not a leak: the arguments are the library's own type -/
          instance torOwn : Tor Own Own where hDiv a _ := a

          /-- not a leak: an abbreviation of the library's own type is still the library's type -/
          instance torOwnAlias : Tor OwnAlias OwnAlias where hDiv a _ := a

          /-- not a leak: the projection of `Plain` is into `Add`, which has no outParams, so nothing about `Nat` changes -/
          instance plainNat : Plain Alias where add a b := a + b

          -- `hopToTor` mentions `Own` in its arguments (`Own × α`): `Tor` is reachable from `HDiv`, but `Hop` is not reachable from `Tor`,
          -- because what `hopToTor` gives `HDiv` is about `Own × Nat`, a type of the library, not about `Nat`
          class Hop (P I : Type) where
            h : P → I
          instance hopToTor {α : Type} [Hop α α] : Tor (Own × α) (Own × α) where hDiv a _ := a

          /-- not a leak: see `hopToTor` -/
          instance hopNat : Hop Alias Alias := ⟨id⟩

          -- but a projection-like instance whose arguments are foreign all through still reaches the foreign type: `hop2ToTor` gives `Tor (List Nat) (List Nat)` from `Hop2 Nat Nat`
          class Hop2 (P I : Type) where
            h : P → I
          instance hop2ToTor {α : Type} [Hop2 α α] : Tor (List α) (List α) where hDiv a _ := a

          /-- LEAK: `HDiv (List Nat) (List Nat) ?γ` finds `Tor.toHDiv` through `hop2ToTor` -/
          instance hop2Nat : Hop2 Alias Alias := ⟨id⟩

          -- NOTATION (lean-pool, 2026-10-17): a global command whose first token, at the same position, is a token core already has (`prefix:80 "-"`: every `-(3 * x)` on a real is
          -- "Ambiguous term"), or whose atom is a word the parser would read as an identifier (`notation "v"`: `fun v => …` fails everywhere). Scoped ones, a token nobody has, and the
          -- first atom of a tactic (`tactic` reads identifiers there) are not leaks.
          def Own.neg (a : Own) : Own := ⟨a.x⟩

          /-- LEAK: the same position and token as core's prefix `-` -/
          prefix:80 "-" => Own.neg

          /-- LEAK: `vee` is a reserved word in every file once this is imported -/
          notation "vee" => Own.mk 0

          /-- not a leak: a token nobody else has -/
          notation:65 a " ⊞⊞ " b => Own.mk (Own.x a + Own.x b)

          /-- not a leak: the first atom of a tactic is read as an identifier -/
          syntax "toytac" : tactic

          /-- LEAK: the second atom of a tactic is a token -/
          syntax "quux " "zork" : tactic

          /-- LEAK: the separator of a `sepBy` is a token as well -/
          syntax "sepdemo(" sepBy(num, "sepword") ")" : term

          /-- not a leak: `&"nrword"` is a non-reserved symbol, it never enters the token table (it reads an identifier) -/
          syntax "nrtac" &"nrword" : tactic

          namespace Sc2
          /-- not global -/
          scoped prefix:80 "~~" => Own.neg
          /-- not global -/
          scoped notation "vee2" => Own.mk 1
          end Sc2
          LEAN
          lake env lean --root="$d" -o "$d/LeakToy.olean" "$d/LeakToy.lean"
          lp="$d:$(lake env printenv LEAN_PATH)"
          lake env env LEAN_PATH="$lp" lean --run ../scripts/bump/TengokuLeak.lean --module LeakToy | tee "$RUNNER_TEMP/leaktoy.out"
          python3 - <<'PY'
          import os, re
          out = open(os.path.join(os.environ["RUNNER_TEMP"], "leaktoy.out")).read()
          leaks = {m.group(2) for m in re.finditer(r"^leak: (instance|simp) (\S+) registered in LeakToy", out, re.M)}
          assert leaks == {"unpinnedHMul", "foreignOnly", "torNat", "tor2Nat", "hop2Nat"}, (leaks, out)
          assert re.search(r"^leakscan: \d+ global instances \(5 can fire outside the library\), 1 scoped", out), out.splitlines()[0]
          print("reported:", sorted(leaks))
          # notation: the prefix `-`, the word `vee`, the atom `zork`; not the new symbol, not `toytac`, not the scoped ones
          notes = [m.group(1) for m in re.finditer(r"^leak: notation (\S+) registered in LeakToy", out, re.M)]
          assert len(notes) == 4 and any("term-_" in n for n in notes) and any("Vee" in n and "Vee2" not in n for n in notes) and any("Zork" in n for n in notes) and any("Sepdemo" in n for n in notes), (notes, out)
          assert not any(x in n for n in notes for x in ("⊞⊞", "Toytac", "~~", "Vee2", "Nrtac")), (notes, out)
          assert re.search(r"global parsers \(4 reuse a token of another module or reserve a word as one\), 2 scoped", out.splitlines()[0]), out.splitlines()[0]
          print("notation reported:", sorted(notes))
          PY
