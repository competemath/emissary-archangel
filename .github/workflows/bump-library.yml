# EXPERIMENT: the Mathlib-style bump of ONE library, with Gate 2 batched. No Claude, no Leak.
#
# 1. the library's real files are built against the Mathlib the Tengoku tree is seeded from (trial-library-build.yml's
#    pass 1: lake build --keep-going, in dependency order);
# 2. Gate 2's `Vendor` modules are built into the same project;
# 3. ONE Lean process imports every module that built and checks the statement of every ledger entry in them
#    (scripts/bump/gate2_batch.py: the same Lean code as gate2/server.py, the original's committed export parsed once
#    per module), plus N control pairs of unrelated statements that must all fail.
# The result is compared, entry by entry, with what the per-theorem pipeline decided (the ledger).
name: bump-library
on:
  workflow_dispatch:
    inputs:
      key: { description: "registered library key (data/exports/<key>/setup.ci.json)", required: true }
      mathlib: { description: "Mathlib tag the Tengoku tree is seeded from", default: "v4.34.0-rc2" }
      toolchain: { description: "the tree's Lean toolchain", default: "leanprover/lean4:v4.34.0-rc2" }
      controls: { description: "control pairs (unrelated statements) that must fail", default: "20" }
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions: { contents: read }
    env:
      KEY: ${{ inputs.key }}
      MATHLIB: ${{ inputs.mathlib }}
      TOOLCHAIN: ${{ inputs.toolchain }}
      CONTROLS: ${{ inputs.controls }}
    steps:
      - name: Free disk (Mathlib's build is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h / | tail -1
      - name: This repository, only what the experiment reads (the library's own exports, ledger and the Gate 2 sources)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git clone -q --filter=blob:none --no-checkout "https://github.com/$GITHUB_REPOSITORY" emissary
          git -C emissary sparse-checkout set --no-cone "/scripts/" "/gate2/" "/sources.json" "/data/translate/$KEY.jsonl" "/data/exports/$KEY/"
          git -C emissary checkout -q "$GITHUB_SHA"
          du -sh emissary/data/exports/"$KEY" | cut -f1
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The library at its pinned commit, pointed at the tree's Mathlib
        run: |
          cd emissary
          read -r repo commit _ roots < <(python3 scripts/trial-library-build.py meta "$KEY")
          echo "ROOTS=$(echo "$roots" | tr ' ' ',')" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none "$repo" lib && git -C lib checkout -q "$commit"
          echo "OLD_MATHLIB=$(python3 -c "import json; print(next(p['rev'] for p in json.load(open('lib/lake-manifest.json'))['packages'] if p['name']=='mathlib'))")" >> "$GITHUB_ENV"
          python3 scripts/trial-library-build.py retarget lib "$MATHLIB" "$TOOLCHAIN"
          # Gate 2's own Lean modules, built into the same project (they import Lean only)
          cp -r ../emissary/gate2/Vendor.lean ../emissary/gate2/Vendor lib/
          if [ -f lib/lakefile.toml ]; then printf '\n[[lean_lib]]\nname = "Vendor"\n' >> lib/lakefile.toml; else printf '\nlean_lib Vendor\n' >> lib/lakefile.lean; fi
          cd lib
          lake update 2>&1 | tail -3
          lake exe cache get 2>&1 | tail -2
      - name: Where Mathlib moved its modules between the library's Mathlib and the tree's
        working-directory: emissary
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 scripts/bump/mine_moves.py "$OLD_MATHLIB" "$MATHLIB" --out moves.json
      - name: Build the library unchanged, then repair and rebuild until nothing more can be repaired mechanically
        working-directory: emissary
        run: |
          # scripts/bump/tolerant_build.py: every module goes through the toolchain's own frontend and its olean is written even
          # when the file has errors (a failing proof costs that declaration, not the module and everything downstream);
          # modules whose source and imports are unchanged since the last round are not rebuilt
          build() { python3 scripts/bump/tolerant_build.py --lib lib --roots "$ROOTS" --log "build-$1.log" --report "tb-$1.json" --jobs 4 --cache lib/.bump-cache; python3 scripts/trial-library-build.py analyze lib "$KEY" "pass-$1" "build-$1.log" | grep -E "^- (Modules|Ledger|Modules that no longer)"; }
          start=$(date +%s); build 0; echo "baseline build: $(( ($(date +%s) - start) / 60 )) min"
          last=0
          for r in 1 2 3 4; do
            python3 scripts/bump/engine.py repair --lib lib --log "build-$last.log" --roots "$ROOTS" --moves moves.json --state state.json --round "$r" --out "repair-$r.json" --deprecations
            [ "$(python3 -c "import json; print(json.load(open('repair-$r.json'))['changed'])")" = True ] || { echo "round $r: nothing left to repair mechanically"; break; }
            start=$(date +%s); build "$r"; echo "round $r build: $(( ($(date +%s) - start) / 60 )) min"; last=$r
          done
          echo "final state: build-$last.log"; cp "build-$last.log" build1.log; cp "pass-$last.json" pass1.json; cp "tb-$last.json" tb-final.json
          (cd lib && lake build Vendor 2>&1 | tail -2)
          git -C lib diff --stat | tail -3; git -C lib diff > ../repairs.patch
      - name: Batched Gate 2 over every declaration of every module that built
        working-directory: emissary
        run: |
          python3 scripts/bump/gate2_batch.py generate --key "$KEY" --lib lib --exports "data/exports/$KEY" --ledger "data/translate/$KEY.jsonl" \
            --roots "$ROOTS" --out lib/gate2-check.lean --controls "$CONTROLS" | tee plan.json
          cd lib
          start=$(date +%s)
          timeout 120m lake env lean gate2-check.lean > ../gate2.log 2>&1 || true
          echo "batched Gate 2: $(( $(date +%s) - start )) seconds for $(grep -c 'GATE2B_' ../gate2.log) verdicts"
          echo "--- Lean errors (not verdicts):"; { grep -E "error" ../gate2.log | grep -v "GATE2B_" | head -8 | cut -c1-300; } || true
      - name: Verdicts against the per-theorem pipeline's
        working-directory: emissary
        run: python3 scripts/bump/gate2_batch.py parse --log gate2.log --ledger "data/translate/$KEY.jsonl" --out gate2-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bump-${{ inputs.key }}
          path: |
            emissary/build-*.log
            emissary/pass-*.json
            emissary/tb-*.json
            emissary/repair-*.json
            emissary/moves.json
            emissary/repairs.patch
            emissary/gate2.log
            emissary/gate2-results.json
            emissary/plan.json
            emissary/lib/gate2-check.lean
            emissary/lib/gate2-check.plan.json
          retention-days: 30
