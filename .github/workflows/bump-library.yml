# EXPERIMENT: the Mathlib-style bump of ONE library, with Gate 2 batched. No Claude, no Leak.
#
# 1. the library's real files are built against the Mathlib the Tengoku tree is seeded from (trial-library-build.yml's
#    pass 1: lake build --keep-going, in dependency order);
# 2. Gate 2's `Vendor` modules are built in a project of their own (the library's lakefile options must not apply to them);
# 3. ONE Lean process imports every module that built and checks the statement of every ledger entry in them
#    (scripts/bump/gate2_batch.py: the same Lean code as gate2/server.py, the original's committed export parsed once
#    per module), plus N control pairs of unrelated statements that must all fail.
# The result is compared, entry by entry, with what the per-theorem pipeline decided (the ledger).
name: bump-library
run-name: bump ${{ inputs.key }}
on:
  workflow_dispatch:
    inputs:
      key: { description: "registered library key (data/exports/<key>/setup.ci.json)", required: true }
      mathlib: { description: "Mathlib tag the Tengoku tree is seeded from", default: "v4.34.0-rc2" }
      toolchain: { description: "the tree's Lean toolchain", default: "leanprover/lean4:v4.34.0-rc2" }
      controls: { description: "control pairs (unrelated statements) that must fail", default: "20" }
      chain: { description: "direct = one jump to `mathlib`; auto = through intermediate Mathlib releases (scripts/bump/plan_chain.py); or a comma list of tags", default: "direct" }
      step: { description: "chain=auto: at most this many Lean minor versions per step", default: "3" }
      records: { description: "on = also stage the old per-theorem records (33 KB each, superseded by the bundle)", default: "off" }
      imports: { description: "full = every Mathlib/Batteries/Aesop/Qq/ProofWidgets import becomes the umbrellas (the environment a record is verified in); minimal = keep the library's imports and repair moved modules (mine_moves.py)", default: "full" }
      portfolio: { description: "on = at the last step, theorems whose proof failed are retried with Lean's own automation (scripts/bump/portfolio.py)", default: "on" }
      recut_from: { description: "RECUT: the id of an earlier run of this workflow for this key. No build: its bundle is packed again (with the Deps.lean marker) and attested by this run", default: "" }
      scope: { description: "RECUT: the `leak:` lines of the merge queue's leak report (separated by `;`): those registrations are made local (scripts/bump/scope_rewrite.py)", default: "" }
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  bump:
    if: ${{ inputs.recut_from == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions: { contents: read }   # this job runs the library's Lean (elaborators, tactics, initializers): it holds no signing identity
    env:
      KEY: ${{ inputs.key }}
      MATHLIB: ${{ inputs.mathlib }}
      TOOLCHAIN: ${{ inputs.toolchain }}
      CONTROLS: ${{ inputs.controls }}
      CHAIN: ${{ inputs.chain }}
      STEP: ${{ inputs.step }}
      PORTFOLIO: ${{ inputs.portfolio }}
      IMPORTS: ${{ inputs.imports }}
      RECORDS: ${{ inputs.records }}
    steps:
      - name: Free disk (Mathlib's build is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h / | tail -1
      - name: This repository, only what the experiment reads (the library's own exports, ledger and the Gate 2 sources)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git clone -q --filter=blob:none --no-checkout "https://github.com/$GITHUB_REPOSITORY" emissary
          git -C emissary sparse-checkout set --no-cone "/scripts/" "/gate2/" "/sources.json" "/data/translate/$KEY.jsonl" "/data/exports/$KEY/"
          git -C emissary checkout -q "$GITHUB_SHA"
          # the record splitter every banked record went through (not checked out as lib/: that is the library's directory)
          git -C emissary show "$GITHUB_SHA:lib/stage-record.mjs" > emissary/scripts/bump/stage-record.copy.mjs
          du -sh emissary/data/exports/"$KEY" | cut -f1
          # the library's entries as tengoku harvested them (the ledger only knows what the per-theorem pipeline got to)
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku tengoku
          git -C tengoku sparse-checkout set --no-cone "/data/tentative/$KEY.jsonl" "/data/tentative/$KEY/"
          git -C tengoku checkout -q main
          ls tengoku/data/tentative | head -3
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The library at its pinned commit
        run: |
          cd emissary
          read -r repo commit _ roots < <(python3 scripts/trial-library-build.py meta "$KEY")
          echo "ROOTS=$(echo "$roots" | tr ' ' ',')" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none "$repo" lib && git -C lib checkout -q "$commit"
          OLD_MATHLIB=$(python3 -c "import json; print(next(p['rev'] for p in json.load(open('lib/lake-manifest.json'))['packages'] if p['name']=='mathlib'))")
          echo "OLD_MATHLIB=$OLD_MATHLIB" >> "$GITHUB_ENV"
          # the Mathlib releases to go through, oldest first (the target last): `direct` = the target alone
          case "$CHAIN" in
            direct) echo "$MATHLIB $TOOLCHAIN" > plan.txt ;;
            auto) GH_TOKEN=${{ github.token }} python3 scripts/bump/plan_chain.py "$OLD_MATHLIB" "$MATHLIB" --step "$STEP" > plan.txt ;;
            *) : > plan.txt; for t in ${CHAIN//,/ }; do echo "$t leanprover/lean4:$(echo "$t" | sed 's/-rc.*//')" >> plan.txt; done ;;
          esac
          # an explicit list still ends at the target
          [ "$CHAIN" = direct ] || [ "$(tail -1 plan.txt | cut -d' ' -f1)" = "$MATHLIB" ] || echo "$MATHLIB $TOOLCHAIN" >> plan.txt
          echo "bump plan:"; cat plan.txt
          python3 scripts/trial-library-build.py retarget lib "$(head -1 plan.txt | cut -d' ' -f1)" "$(head -1 plan.txt | cut -d' ' -f2)"
          # the library's own commands that are synonyms of plain Lean (Compfiles: problem, determine, snip) become plain Lean
          python3 scripts/bump/adapters.py "$KEY" lib "$ROOTS"
      - name: Bump through the plan; at each step rebuild, repair, rebuild until nothing more can be repaired mechanically
        working-directory: emissary
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # scripts/bump/tolerant_build.py: every module goes through the toolchain's own frontend and its olean is written even
          # when the file has errors (a failing proof costs that declaration, not the module and everything downstream);
          # modules whose source and imports are unchanged since the last round are not rebuilt
          build() { python3 scripts/bump/tolerant_build.py --lib lib --roots "$ROOTS" --log "build-$1.log" --report "tb-$1.json" --jobs 4 --cache lib/.bump-cache; python3 scripts/trial-library-build.py analyze lib "$KEY" "pass-$1" "build-$1.log" | grep -E "^- (Modules|Ledger|Modules that no longer)"; }
          prev=$OLD_MATHLIB; n=0; final=""
          while read -r tag toolchain; do
            n=$((n+1)); echo "=== step $n: Mathlib $tag ($toolchain)"
            python3 scripts/trial-library-build.py retarget lib "$tag" "$toolchain"
            (cd lib && lake update 2>&1 | tail -2 && lake exe cache get 2>&1 | tail -1)
            if [ "$IMPORTS" = full ]; then python3 scripts/bump/engine.py normalize-imports --lib lib --roots "$ROOTS" --lean-path "$(cd lib && lake env printenv LEAN_PATH)"; fi
            if [ "$IMPORTS" = full ]; then echo '{"moves":{}}' > "moves-$n.json"; else python3 scripts/bump/mine_moves.py "$prev" "$tag" --out "moves-$n.json"; fi
            start=$(date +%s); build "s$n-0"; echo "step $n baseline build: $(( ($(date +%s) - start) / 60 )) min"
            last="s$n-0"
            for r in 1 2 3 4; do
              python3 scripts/bump/engine.py repair --lib lib --log "build-$last.log" --roots "$ROOTS" --moves "moves-$n.json" --state "state-$n.json" --round "$r" --out "repair-s$n-$r.json" --deprecations
              [ "$(python3 -c "import json; print(json.load(open('repair-s$n-$r.json'))['changed'])")" = True ] || { echo "step $n round $r: nothing left to repair mechanically"; break; }
              start=$(date +%s); build "s$n-$r"; echo "step $n round $r build: $(( ($(date +%s) - start) / 60 )) min"; last="s$n-$r"
            done
            if [ "$PORTFOLIO" = on ] && [ "$tag" = "$MATHLIB" ]; then
              for p in 1 2 3; do
                python3 scripts/bump/portfolio.py apply --lib lib --log "build-$last.log" --out "portfolio-$n-$p.json"
                [ "$(python3 -c "import json; d=json.load(open('portfolio-$n-$p.json')); print(d['theorems_rewritten'] + d.get('superfluous_tactics_deleted', 0))")" != 0 ] || break
                start=$(date +%s); build "s$n-p$p"; echo "step $n portfolio round $p build: $(( ($(date +%s) - start) / 60 )) min"; last="s$n-p$p"
              done
            fi
            final=$last; prev=$tag
          done < plan.txt
          echo "final state: build-$final.log"; cp "build-$final.log" build1.log; cp "pass-$final.json" pass1.json; cp "tb-$final.json" tb-final.json
          git -C lib diff --stat | tail -3; git -C lib diff > ../repairs.patch
      - name: The old exports (a library set up across runners keeps them in a release, not in git; the others have them already)
        working-directory: emissary
        run: node scripts/fetch-exports.mjs "$KEY"
      - name: Gate 2's own Lean modules, in a project of their own (the library's lakefile options, e.g. warnings as errors, must not apply to them)
        run: |
          mkdir vendorproj && cp -r emissary/gate2/Vendor.lean emissary/gate2/Vendor vendorproj/
          # the helper code of Gate 2 and of the batch, compiled here (it imports only Lean), not parsed in the check file
          python3 emissary/scripts/bump/gate2_batch.py emit-vendor --out vendorproj
          cd vendorproj
          echo "$TOOLCHAIN" > lean-toolchain
          printf 'name = "V"\ndefaultTargets = ["Vendor"]\n[[lean_lib]]\nname = "Vendor"\n' > lakefile.toml
          lake build Vendor 2>&1 | tail -5
      - name: Batched Gate 2 over every declaration of every module that built
        working-directory: emissary
        run: |
          # the library's own search path (its Mathlib and its modules) plus Gate 2's Vendor
          LP="$(cd lib && lake env printenv LEAN_PATH):$GITHUB_WORKSPACE/vendorproj/.lake/build/lib/lean"
          # One Lean process imports the modules together. Library modules that cannot be imported together (two copies of one file, a
          # notation Mathlib also has) are split into passes: Lean names the import that failed, that module and its importers are
          # left out of the pass, and the next pass checks exactly what was left out. Verdicts of all passes go into one log.
          : > gate2.log; only=""
          for pass in 1 2 3 4 5 6; do
            exclude=""
            for attempt in $(seq 1 15); do
              python3 scripts/bump/gate2_batch.py generate --key "$KEY" --lib lib --exports "data/exports/$KEY" --ledger "data/translate/$KEY.jsonl" \
                --roots "$ROOTS" --out lib/gate2-check.lean --controls "$CONTROLS" --exclude "$exclude" --only "$only" \
                --tentative "../tengoku/data/tentative/$KEY.jsonl,../tengoku/data/tentative/$KEY/*.jsonl" | tee plan.json
              (cd lib; start=$(date +%s); LEAN_PATH="$LP" timeout 120m lean gate2-check.lean > ../gate2-pass.log 2>&1 || true
               echo "batched Gate 2 (pass $pass, attempt $attempt): $(( ($(date +%s) - start) )) seconds for $(grep -c 'GATE2B_' ../gate2-pass.log) verdicts")
              bad=$(grep -oP "import \K\S+(?= failed)" gate2-pass.log | head -1 || true)
              [ -z "$bad" ] && break
              echo "import clash: $bad (and what imports it) left out of this pass"; exclude="$exclude,$bad"
            done
            cat gate2-pass.log >> gate2.log
            only=$(python3 -c "import json; print(','.join(json.load(open('lib/gate2-check.plan.json')).get('excluded_modules', [])))")
            [ -n "$only" ] || break
            echo "pass $((pass+1)): the $(echo "$only" | tr ',' '\n' | wc -l) modules left out"
          done
          echo "--- Lean errors (not verdicts):"; { grep -E "error" gate2.log | grep -v "GATE2B_" | head -8 | cut -c1-300; } || true
      - name: Verdicts against the per-theorem pipeline's
        working-directory: emissary
        run: |
          python3 scripts/bump/gate2_batch.py parse --log gate2.log --ledger "data/translate/$KEY.jsonl" --out gate2-results.json \
            --tentative "../tengoku/data/tentative/$KEY.jsonl,../tengoku/data/tentative/$KEY/*.jsonl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        name: Upload the build and Gate 2 results now (the records step is the longest and must not be able to lose them)
        if: always()
        with:
          name: gate2-${{ inputs.key }}
          path: |
            emissary/build-*.log
            emissary/pass-*.json
            emissary/tb-*.json
            emissary/repair-*.json
            emissary/portfolio-*.json
            emissary/repairs.patch
            emissary/gate2.log
            emissary/gate2-results.json
            emissary/passed.json
            emissary/plan.json
          retention-days: 30
      - name: Staging records for the declarations that passed (RECORDS=on only)
        if: env.RECORDS == 'on'
        working-directory: emissary
        run: |
          python3 scripts/bump/records.py lean --lib lib --names passed.json --out lib/records-deps.lean
          (cd lib && timeout 90m lake env lean records-deps.lean > ../records-deps.log 2>&1 || true)
          grep -c "REC_DEPS" records-deps.log || true
          { grep -E "error" records-deps.log | grep -v "REC_" | head -5 | cut -c1-300; } || true
          python3 scripts/bump/records.py compose --lib lib --log records-deps.log --meta "data/exports/$KEY/setup.ci.json" --out composed.jsonl
          node scripts/bump/stage-records.mjs composed.jsonl --source "$KEY" --toolchain "$TOOLCHAIN" --out bank.jsonl
          wc -c bank.jsonl | cut -d' ' -f1
          python3 scripts/bump/ledger_rows.py --ledger "data/translate/$KEY.jsonl" --log gate2.log --run "$GITHUB_RUN_ID" --out ledger-rows.jsonl
      - name: The intake bundle (only what passed, as Lean modules for the tree)
        working-directory: emissary
        run: |
          python3 scripts/bump/bundle.py lean --lib lib --passed passed.json --roots "$ROOTS" --out lib/bundle-deps.lean
          (cd lib && timeout 90m lake env lean bundle-deps.lean > ../bundle-deps.log 2>&1 || true)
          python3 scripts/bump/bundle.py compose --lib lib --log bundle-deps.log --passed passed.json --meta "data/exports/$KEY/setup.ci.json" \
            --key "$KEY" --toolchain "$TOOLCHAIN" --errors build1.log --gate2 gate2.log --out bundle --src pruned-src
      - name: Build the pruned sources until they are clean (what is shipped is exactly what was built; a module that does not build, and what imports it, is left out)
        working-directory: emissary
        run: |
          mkdir -p lib2/.lake && cp lib/lakefile.* lib/lake-manifest.json lib/lean-toolchain lib2/ && ln -s "$PWD/lib/.lake/packages" lib2/.lake/packages
          sync_sources() {
            for r in ${ROOTS//,/ }; do
              rm -rf "lib2/$r" "lib2/$r.lean"
              [ -e "pruned-src-proposed/$r" ] && cp -r "pruned-src-proposed/$r" lib2/
              [ -e "pruned-src-proposed/$r.lean" ] && cp "pruned-src-proposed/$r.lean" lib2/
            done
            return 0
          }
          sync_sources
          for round in 1 2 3 4; do
            python3 scripts/bump/tolerant_build.py --lib lib2 --roots "$ROOTS" --log verify.log --report verify.json --jobs 4 --cache lib2/.bump-cache
            if python3 scripts/bump/bundle.py check --report verify.json --log verify.log --out verify-summary.json; then break; fi
            [ "$round" = 4 ] && { echo "still not clean after three refinements"; exit 1; }
            python3 scripts/bump/bundle.py refine --report verify.json --log verify.log --key "$KEY" --out bundle --src pruned-src
            sync_sources
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: results-${{ inputs.key }}
          path: |
            emissary/build-*.log
            emissary/pass-*.json
            emissary/tb-*.json
            emissary/repair-*.json
            emissary/portfolio-*.json
            emissary/moves.json
            emissary/repairs.patch
            emissary/gate2.log
            emissary/gate2-results.json
            emissary/passed.json
            emissary/composed.jsonl
            emissary/bundle
            emissary/bundle-proposed
            emissary/verify.log
            emissary/pruned-src-proposed
            emissary/verify-summary.json
            emissary/bank.jsonl
            emissary/ledger-rows.jsonl
            emissary/records-deps.log
            emissary/plan.json
            emissary/lib/gate2-check.lean
            emissary/lib/gate2-check.plan.json
          retention-days: 30
  # The archive is cut and signed here, in a job that runs no code of the library: it reads the bundle directories (text) as data and
  # attests the canonical archive of them. Signing in the job that compiled the library would let the library mint attestations.
  attest:
    needs: bump
    if: ${{ !cancelled() && (inputs.recut_from != '' || needs.bump.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, id-token: write, attestations: write, actions: read }  # actions: read = the results of an earlier run (recut)
    env: { KEY: "${{ inputs.key }}", SCOPE: "${{ inputs.scope }}" }
    steps:
      - name: The factory's scripts
        run: |
          git clone -q --filter=blob:none --no-checkout "https://github.com/$GITHUB_REPOSITORY" emissary
          git -C emissary sparse-checkout set --no-cone "/scripts/bump/bundle_tar.py" "/scripts/bump/scope_rewrite.py"
          git -C emissary checkout -q "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: "results-${{ inputs.key }}", path: raw, run-id: "${{ inputs.recut_from || github.run_id }}", github-token: "${{ github.token }}" }
      - name: Make the registrations that leak into other libraries local (RECUT only)
        if: ${{ inputs.scope != '' }}
        run: python3 emissary/scripts/bump/scope_rewrite.py --bundle raw/bundle --bundle raw/bundle-proposed --leaks "$SCOPE"
      - name: Pack (the attested bytes are the canonical .tar, the same function as tengoku's gate; the .tar.gz is for transport)
        run: |
          mkdir -p out
          for mode in strict proposed; do
            dir=raw/bundle; [ "$mode" = proposed ] && dir=raw/bundle-proposed
            # tengoku's generator keeps in All.lean the libraries that have a Deps.lean: an empty one (a comment) marks this library
            for t in "$dir"/Tengoku/*/; do
              [ -d "$t" ] && [ ! -f "${t}Deps.lean" ] && printf -- '-- %s: a factory bundle (data/intake/%s). This file only marks the library for Tengoku/All.lean.\n' "$(basename "$t")" "$KEY" > "${t}Deps.lean"
            done
            python3 emissary/scripts/bump/bundle_tar.py "$dir" "out/bundle-$KEY-$mode.tar"
            gzip -n -k "out/bundle-$KEY-$mode.tar"
            cp "$dir/report.json" "out/report-$mode.json"; cp "$dir/manifest.jsonl" "out/manifest-$mode.jsonl"
          done
          sha256sum out/bundle-"$KEY"-*.tar | tee out/bundle.sha256; ls -l out | awk '{print $5, $9}'
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: "out/bundle-${{ inputs.key }}-*.tar" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "bump-${{ inputs.key }}", path: out, retention-days: 30 }
