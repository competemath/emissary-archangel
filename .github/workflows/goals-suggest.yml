name: goals-suggest
# The AI reviewer of tengoku's GOALS.md, weekly and on demand. People write the goals; the reviewer reads them and
# the library and writes only the Suggestions parts: nuances the goals miss, theorems already in Tengoku that help
# (confirmed to exist), outside resources, goals worth adding. Before anything is proposed, tengoku's own check
# runs as the AI reviewer's PR would be checked (scripts/ci/goals_check.py with GOALS_AI=1): anything outside
# Suggestions changed, or a reference to a theorem that does not exist, and nothing is opened. The PR comes from a
# branch goals-suggest/<date>, which tengoku's gate treats as the AI reviewer's.
on:
  schedule:
    - cron: "41 6 * * 1"   # Mondays
  workflow_dispatch:
    inputs:
      dry_run: { description: "Write the suggestions and check them, open no PR", required: true, default: "false" }
      repo: { description: "The tengoku repository (tests: competemath/tengoku-sandbox)", required: true, default: "competemath/tengoku" }

permissions: {}

concurrency:
  group: goals-suggest
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REPO: ${{ inputs.repo || 'competemath/tengoku' }}

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read }
    steps:
      - name: Tengoku at main (the goals, the records' names, the tree)
        run: |
          git clone -q --filter=blob:none --sparse "https://github.com/$REPO.git" tengoku
          git -C tengoku sparse-checkout set docs schemas scripts data/trusted data/staging Tengoku
          goals=$(grep -c '^<!-- goal: ' tengoku/GOALS.md 2>/dev/null || true)
          echo "goals: ${goals:-0}"
          echo "GOALS=${goals:-0}" >> "$GITHUB_ENV"
      - name: Nothing to review yet
        if: env.GOALS == '0'
        run: echo "GOALS.md has no goals written by people yet (or no GOALS.md); nothing to suggest"
      - name: The reviewer (claude CLI, with Leak I for search)
        if: env.GOALS != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_VERSION: "2.1.296"   # exact, as in translate.yml; bump on purpose (docs/agent-security.md)
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "::warning::no CLAUDE_CODE_OAUTH_TOKEN secret"; exit 0; fi
          CLAUDE_CODE_OAUTH_TOKEN=$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]'); export CLAUDE_CODE_OAUTH_TOKEN
          npm install -g -q "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" >/dev/null && claude --version
          cat > mcp.json <<'EOF'
          { "mcpServers": { "leak-i": { "type": "sse", "url": "https://barkingtree-leak-i.hf.space/sse" } } }
          EOF
          cat > prompt.txt <<'EOF'
          You are the AI reviewer of Tengoku's GOALS.md, in the current directory (a checkout of the Tengoku repository).
          People write each goal. You write ONLY the text between the markers <!-- suggestions --> and <!-- /suggestions -->:
          one such part inside each goal, and one page-level part at the end ("Goals worth adding"). Never change anything
          outside those markers, and never add, remove or move a marker. docs/goals.md explains the page.

          For each goal, write short bullet points a mathematician working on it would find useful:
          - nuances or pitfalls in the statement or the approach that the people's part does not mention;
          - theorems already in Tengoku that help, written `tengoku:Full.Name`. Cite only names you have confirmed exist:
            search data/trusted/*.jsonl and data/staging/**/*.jsonl for "name": "...", Tengoku/**/*.lean for the
            declaration, or use the leak-i search tools. A name that does not exist makes the whole proposal fail;
          - outside resources (papers, other formal libraries) with https links you are confident are right;
          - if a Tengoku theorem already proves the goal as stated, say so and name it.
          In the page-level part, propose at most five high-value goals nobody has written, one bullet each: the goal and
          one sentence on why it matters.
          Keep existing suggestions that are still right; replace ones that are wrong or stale. Where you have nothing
          useful, leave the part as it is. Be concise: no filler, no restating the goal.
          A goal need not be a theorem (translating libraries is one). The page has three sections: Open, Completed
          and Retired. Write suggestions only for goals under Open; leave the parts of Completed and Retired goals as
          they are. If a Tengoku theorem already proves an open goal, say so: a person moves it to Completed.
          EOF
          cd tengoku || exit 1
          claude -p "$(cat ../prompt.txt)" --output-format json --mcp-config ../mcp.json \
            --tools "Read,Grep,Glob,Edit" --strict-mcp-config \
            --allowedTools "Read,Grep,Glob,Edit,mcp__leak-i" --permission-mode acceptEdits \
            --max-turns 60 --max-budget-usd 5 > ../claude.json || true
          python3 -c 'import json; r = json.load(open("../claude.json")); print(str(r.get("result", ""))[-1500:])' || true
          git --no-pager diff --stat
      - name: Check it as the AI reviewer's PR is checked, then propose it
        if: env.GOALS != '0'
        env:
          BOT: ${{ secrets.TENGOKU_BOT_TOKEN }}
          DRY: ${{ inputs.dry_run || 'false' }}
        run: |
          cd tengoku || exit 1
          if git diff --quiet; then echo "no suggestions changed"; exit 0; fi
          if git status --porcelain | grep -qv ' GOALS.md$'; then echo "::error::the reviewer changed files other than GOALS.md"; git status --short; exit 1; fi
          login=$(GH_TOKEN="$BOT" gh api user --jq .login 2>/dev/null || echo tengoku-bot)
          git config user.name "$login"
          git config user.email "$login@users.noreply.github.com"
          branch="goals-suggest/$(date -u +%Y-%m-%d)"
          git checkout -q -b "$branch"
          git commit -q -am "GOALS.md: the AI reviewer's suggestions ($(date -u +%Y-%m-%d))" -m "Signed-off-by: $login <$login@users.noreply.github.com>"
          if [ -f scripts/ci/goals_check.py ]; then
            (cd scripts/ci && TENGOKU_CI_ROOT="$PWD/../.." GOALS_AI=1 python3 goals_check.py origin/main HEAD)
          else
            echo "::error::tengoku has no scripts/ci/goals_check.py yet"; exit 1
          fi
          if [ "$DRY" = true ] || [ -z "$BOT" ]; then git --no-pager show --stat HEAD; echo "dry run (or no TENGOKU_BOT_TOKEN): no PR"; exit 0; fi
          git push -q "https://x-access-token:${BOT}@github.com/$REPO.git" "HEAD:refs/heads/$branch"
          GH_TOKEN="$BOT" gh pr create -R "$REPO" --base main --head "$branch" \
            --title "GOALS.md: the AI reviewer's suggestions ($(date -u +%Y-%m-%d))" \
            --body "The weekly AI review of GOALS.md (emissary-archangel goals-suggest). It changes only the Suggestions parts; tengoku's goals check verified that before this PR was opened, and checks it again here. Every \`tengoku:\` name it cites exists in the library. Keep what helps; edit or delete the rest. Anyone may change Suggestions."
          GH_TOKEN="$BOT" gh pr merge "$branch" -R "$REPO" --auto || true
