name: generator-trial
run-name: generator trial (${{ inputs.tengoku_ref }}) ${{ inputs.libraries }}
# Does the tree build what translation banked? Takes competemath/tengoku at a ref (a generator change under test),
# its attested cache, adds every banked record of the given libraries (data/bank, sent or not) as trusted, runs
# scripts/generate.py, and builds each library. The summary lists, per library, the modules that built and the
# errors of those that did not. Read-only: nothing is committed or published.
on:
  workflow_dispatch:
    inputs:
      tengoku_ref: { description: "Branch or commit of competemath/tengoku", required: true, default: "main" }
      libraries: { description: "Space-separated keys", required: true }

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions: { contents: read }
    env:
      TENGOKU_VERIFY: require
      LIBS: ${{ inputs.libraries }}
      REF: ${{ inputs.tengoku_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { filter: "blob:none", sparse-checkout: "data/bank", persist-credentials: false }
      - name: elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/elan-init.sh" https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The tree at the ref, compiled (its attested cache)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git clone -q --filter=blob:none https://github.com/competemath/tengoku tree
          git -C tree checkout -q "$REF"
          cd tree && TENGOKU_REPO=competemath/tengoku scripts/cache.sh get 2>&1 | tail -3 && lake build Tengoku 2>&1 | tail -1
      - name: The banked records as trusted, generated
        run: |
          python3 - <<'PY'
          import glob, json, os
          for lib in os.environ["LIBS"].split():
              recs = [l for f in sorted(glob.glob(f"data/bank/{lib}/sent/*.jsonl") + glob.glob(f"data/bank/{lib}/*.jsonl")) for l in open(f) if l.strip()]
              path = f"tree/data/trusted/{lib}.jsonl"
              have = {json.loads(l).get("name") for l in open(path)} if os.path.exists(path) else set()
              new = [l for l in recs if json.loads(l)["name"] not in have]
              with open(path, "a") as f:
                  f.write("".join(l if l.endswith("\n") else l + "\n" for l in new))
              print(f"{lib}: {len(new)} banked records added to {len(have)} trusted")
          PY
          # each library with its corpus at the pinned commit (only its import lines are read), as the queue does
          cd tree
          for lib in $LIBS; do
            spec=$(python3 -c "import json; c = json.load(open('schemas/sources.json')).get('corpora', {}).get('$lib', {}); print(c.get('repo', ''), c.get('commit', ''))")
            read -r repo commit <<< "$spec"
            if [ -n "$repo" ]; then git clone -q --filter=blob:none "$repo" "corpora/$lib" && git -C "corpora/$lib" checkout -q "$commit"; fi
            python3 scripts/generate.py --corpus "corpora/$lib" --libraries "$lib" 2>&1 | grep -E 'records ->|Error|Traceback' || true
          done
      - name: Build each library, then all of them together (clashes between libraries)
        run: |
          cd tree
          : > ../summary.txt
          nss=()
          for lib in $LIBS; do
            ns=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from generate import pascal; print(pascal('$lib'))")
            nss+=("$ns")
            if lake build "Tengoku.$ns" > "../build-$lib.log" 2>&1; then ok=yes; else ok=no; fi
            total=$(find "Tengoku/$ns" -name '*.lean' | wc -l)
            failed=$( (grep -oE "error: (\./)?Tengoku/$ns/[^:]+\.lean" "../build-$lib.log" || true) | sort -u | wc -l)
            echo "== $lib: build ok=$ok, $total modules, $failed with errors" | tee -a ../summary.txt
            (grep -E '^error: ' "../build-$lib.log" || true) | sed -E 's/:[0-9]+:[0-9]+:/:/' | cut -c1-220 | sort | uniq -c | sort -rn | head -12 | tee -a ../summary.txt
          done
          printf 'import Tengoku.%s\n' "${nss[@]}" > Tengoku/TrialAll.lean
          if lake build Tengoku.TrialAll > ../build-together.log 2>&1; then echo "== together: ok" | tee -a ../summary.txt
          else echo "== together: FAILED" | tee -a ../summary.txt; (grep -E '^error' ../build-together.log || true) | cut -c1-220 | head -20 | tee -a ../summary.txt; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: build-logs, path: "build-*.log\nsummary.txt", retention-days: 7 }
