name: setup-pickup
# Twice an hour, and when sources.json changes on main: libraries registered since FIRST_REGISTER that have no setup yet get one through setup-auto.yml, up to 4 per run as the free runners allow: 10 free for the first, 3 more for each further one (scripts/bump/setup_pickup.py
# says which, with which branch of the tree holding its records, and why not the others). Its bump then follows by itself (bump-pickup.yml). It reads and dispatches; it runs no library's code and
# pushes nothing. LANE_ENABLED (the intake lane's kill switch) stops it too. A person can rehearse it with workflow_dispatch (dry_run prints what it would start).
on:
  schedule:
    - cron: "7,37 * * * *"
  # GitHub's scheduler is not to be counted on for this repository (13 Nov 2026: this cron never fired in its first six hours on main; bump-pickup's hourly cron fired 3 times
  # in 16 hours; six batch-7 libraries waited four hours with 12 runners free). So the pickup also runs whenever a long job ends and frees its runners: a setup-sharded or
  # bump-sharded run (always real work, never a dry run) and a SCHEDULED bump-pickup (the job's `if` skips a person's dry run of it). Main's code, as for every event here.
  workflow_run:
    workflows: [bump-pickup, setup-sharded, bump-sharded]
    types: [completed]
    branches: [main]  # only runs of main: a hand dispatch of a long workflow from another branch must not start setups here (cubic on #191)
  push:
    branches: [main]
    paths: [sources.json]
  workflow_dispatch:
    inputs:
      dry_run: { description: "Print what would start, start nothing", required: true, default: "true" }

permissions: {}

concurrency:
  group: setup-pickup
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  pickup:
    # after a bump-pickup only when that one ran on its schedule: a person's rehearsal of bump-pickup (workflow_dispatch, dry run) must not start setups (cubic on #190); after a setup-sharded or bump-sharded run always
    if: ${{ (github.event_name == 'workflow_dispatch' || vars.LANE_ENABLED == 'true') && (github.event_name != 'workflow_run' || github.event.workflow_run.name != 'bump-pickup' || github.event.workflow_run.event == 'schedule') && github.ref == 'refs/heads/main' && github.repository == 'competemath/emissary-archangel' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45   # up to 30 of them waiting for runners (--wait-minutes): LANE_ENABLED is read when the job starts, so the wait is short enough for the kill switch to take effect soon (cubic on #192)
    permissions: { actions: write, contents: read }  # read the runs of the workflows, dispatch setup-auto
    env: { GH_TOKEN: "${{ github.token }}", DRY: "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false' }}" }
    steps:
      - name: The scripts, the registry with its history, and every library's setup record
        run: |
          git clone -q --filter=blob:none --no-checkout "https://github.com/$GITHUB_REPOSITORY" emissary
          git -C emissary sparse-checkout set --no-cone "/scripts/bump/" "/sources.json" "/data/exports/*/setup.ci.json"
          git -C emissary checkout -q "$GITHUB_SHA"
      - name: Start the setup a newly registered library is waiting for
        working-directory: emissary
        run: python3 scripts/bump/setup_pickup.py $([ "$DRY" = true ] && echo --dry-run || echo --wait-minutes 30)
