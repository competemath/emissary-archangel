name: setup-pickup
# Twice an hour, and when sources.json changes on main: a library registered since FIRST_REGISTER that has no setup yet gets one through setup-auto.yml, one per run (scripts/bump/setup_pickup.py
# says which, with which branch of the tree holding its records, and why not the others). Its bump then follows by itself (bump-pickup.yml). It reads and dispatches; it runs no library's code and
# pushes nothing. LANE_ENABLED (the intake lane's kill switch) stops it too. A person can rehearse it with workflow_dispatch (dry_run prints what it would start).
on:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths: [sources.json]
  workflow_dispatch:
    inputs:
      dry_run: { description: "Print what would start, start nothing", required: true, default: "true" }

permissions: {}

concurrency:
  group: setup-pickup
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  pickup:
    if: ${{ (github.event_name == 'workflow_dispatch' || vars.LANE_ENABLED == 'true') && github.ref == 'refs/heads/main' && github.repository == 'competemath/emissary-archangel' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions: { actions: write, contents: read }  # read the runs of the workflows, dispatch setup-auto
    env: { GH_TOKEN: "${{ github.token }}", DRY: "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false' }}" }
    steps:
      - name: The scripts, the registry with its history, and every library's setup record
        run: |
          git clone -q --filter=blob:none --no-checkout "https://github.com/$GITHUB_REPOSITORY" emissary
          git -C emissary sparse-checkout set --no-cone "/scripts/bump/" "/sources.json" "/data/exports/*/setup.ci.json"
          git -C emissary checkout -q "$GITHUB_SHA"
      - name: Start the setup a newly registered library is waiting for
        working-directory: emissary
        run: python3 scripts/bump/setup_pickup.py $([ "$DRY" = true ] && echo --dry-run)
