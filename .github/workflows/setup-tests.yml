# The setup of a library on runners: the route chosen by size (scripts/setup-plan.mjs), the build that carries on from the
# last round and says whether it is complete (scripts/setup-source.mjs --phase build, build-status), and what the workflows may
# do (scripts/test-setup-workflows.mjs), the per-minute metrics of a build round (scripts/runner-watch.sh, round-summary.py), the tools a setup record names
# (scripts/test-setup-tools.mjs), and that nothing any workflow installs or runs on moves (scripts/test-workflow-pins.mjs: any workflow change runs it). No Lean, no network beyond the checkout.
name: setup-tests
on:
  push:
    paths: ["scripts/setup-plan.mjs", "scripts/setup-source.mjs", "scripts/setup-tools.mjs", "scripts/test-setup-*.mjs", "scripts/test-workflow-pins.mjs", "scripts/check-workflow-pins.mjs", "scripts/runner-watch.sh", "scripts/round-summary.py", ".github/workflows/*.yml"]
  pull_request:
    paths: ["scripts/setup-plan.mjs", "scripts/setup-source.mjs", "scripts/setup-tools.mjs", "scripts/test-setup-*.mjs", "scripts/test-workflow-pins.mjs", "scripts/check-workflow-pins.mjs", "scripts/runner-watch.sh", "scripts/round-summary.py", ".github/workflows/*.yml"]
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            scripts
            .github/workflows
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: node scripts/test-setup-plan.mjs
      - run: node scripts/test-setup-build.mjs
      - run: node scripts/test-setup-workflows.mjs
      - run: node scripts/test-setup-tools.mjs
      - run: node scripts/test-workflow-pins.mjs
      - run: node scripts/test-setup-watch.mjs
