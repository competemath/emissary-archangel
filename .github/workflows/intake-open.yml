name: intake-open
# The intake lane's opener. Every 10 minutes: for every library with a finished bundle (a successful bump run, artifacts kept 3 days), open the next intake / extend PR
# on tengoku as the tengoku-intake App, never more than LANE_MAX_OPEN open at once, LANE_DAILY_CAP in 24 hours, 12 per run, 90 s apart (scripts/bump/intake_open.py).
# Nothing runs unless the repository variable LANE_ENABLED is "true": setting it to anything else is the kill switch. A person starts a rehearsal with workflow_dispatch
# (target: competemath/tengoku-sandbox, dry_run: false). With LANE_AUTOMERGE = "true" an EXTEND part also arms the merge queue; a first part never does (it adds a line to an
# owned file and needs a person). The App's token is minted here and reaches only the target repository; this workflow runs code from this repository's default branch only.
on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      target: { description: "Repository to open the pull requests in (tengoku, or tengoku-sandbox for a rehearsal)", required: true, default: "competemath/tengoku" }
      keys: { description: "Only these libraries (space separated; empty: every library with a finished bundle)", required: false, default: "" }
      dry_run: { description: "Print what would open, open nothing", required: true, default: "true" }
      automatic: { description: "true when intake-next.yml starts this run: it then runs only while the lane is switched on (LANE_ENABLED), like the schedule", required: false, default: "false" }

permissions: {}

concurrency:
  group: intake-open
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  open:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.automatic != 'true') || vars.LANE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions: { contents: read, actions: read, attestations: read }  # actions: the factory's runs and artifacts; attestations: `gh attestation verify`
    env:
      TARGET: ${{ inputs.target || 'competemath/tengoku' }}
      KEYS: ${{ inputs.keys || '' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: The target is one of the two repositories the App is installed on
        run: |
          case "$TARGET" in
            competemath/tengoku|competemath/tengoku-sandbox) echo "REPO_NAME=${TARGET#*/}" >> "$GITHUB_ENV" ;;
            *) echo "::error::target must be competemath/tengoku or competemath/tengoku-sandbox"; exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { filter: "blob:none", sparse-checkout: "scripts/bump", persist-credentials: false }
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.INTAKE_APP_ID }}
          private-key: ${{ secrets.INTAKE_APP_KEY }}
          owner: competemath
          repositories: ${{ env.REPO_NAME }}
      - name: Open the next pull requests
        env:
          GH_TOKEN: ${{ github.token }}  # the factory's runs, artifacts and attestations
          TENGOKU_TOKEN: ${{ steps.app.outputs.token }}  # everything on the target repository
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          MAX_OPEN: ${{ vars.LANE_MAX_OPEN || '80' }}
          DAILY_CAP: ${{ vars.LANE_DAILY_CAP || '400' }}
          AUTOMERGE: ${{ vars.LANE_AUTOMERGE }}
          AUTOMERGE_FIRST: ${{ vars.LANE_AUTOMERGE_FIRST }}
        run: |
          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          export BOT_NAME="${APP_SLUG}[bot]" BOT_EMAIL="${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          args=(--target "$TARGET" --author "app/${APP_SLUG}" --max-open "$MAX_OPEN" --daily-cap "$DAILY_CAP" --keys "$KEYS")
          [ "$AUTOMERGE" = "true" ] && args+=(--auto-merge)
          [ "$AUTOMERGE" = "true" ] && [ "$AUTOMERGE_FIRST" = "true" ] && args+=(--auto-merge-first)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python3 scripts/bump/intake_open.py "${args[@]}" | tee out.txt
          { echo '### intake-open'; echo '```'; tail -40 out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
  # Part N+1 of a library opens only after part N merged, and the schedule above can be hours late: intake-next.yml waits for an open intake pull request to merge and
  # starts this workflow again (scripts/bump/intake_next.py). Only after a real run on tengoku; it ends at once when nothing of the lane is open.
  next:
    needs: open
    if: ${{ !cancelled() && needs.open.result == 'success' && (github.event_name == 'workflow_dispatch' || vars.LANE_ENABLED == 'true') && (inputs.dry_run || 'false') == 'false' && (inputs.target || 'competemath/tengoku') == 'competemath/tengoku' && github.ref == 'refs/heads/main' && github.repository == 'competemath/emissary-archangel' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { actions: write }  # workflow_dispatch of intake-next.yml, nothing else
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the next merge (intake-next.yml)
        run: |
          since=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)  # this run's start: a part merged after the opener looked still counts
          gh workflow run intake-next.yml -R "$GITHUB_REPOSITORY" --ref main -f since="$since"
