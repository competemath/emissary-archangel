# A big library, bumped in shards (plan -> N shards in parallel -> merge into ONE attested intake bundle). Same checks and guarantees as
# bump-library.yml; the difference is only that no single runner builds the whole library. scripts/bump/plan_shards.py cuts it into
# dependency-closed shards (a module goes to the shard that already builds most of what it imports); the merge unions what every shard
# found passed and prunes the library once.
name: bump-sharded
run-name: bump-sharded ${{ inputs.key }}${{ inputs.from_tree == 'true' && ' (from tree)' || '' }}
on:
  workflow_dispatch:
    inputs:
      key: { description: "registered library key", required: true }
      mathlib: { description: "Mathlib tag the Tengoku tree is seeded from", default: "v4.34.0-rc2" }
      toolchain: { description: "the tree's Lean toolchain", default: "leanprover/lean4:v4.34.0-rc2" }
      shards: { description: "number of shards (0 = automatic: as many as it takes for no shard to build more than 250k lines, at most 32)", default: "0" }
      max_targets: { description: "a shard with more modules to judge than this is cut into shards of at most that many (0: never). Gate 2 judges a shard's modules one after the other inside the job's time: a shard with 1,758 of them (navier-stokes-euler's shard 1, one chain) judged 535 in 185 minutes and left 1,223 modules without a verdict, which do not ship. The plan changes, so a run with it cannot fill in from a run without it", default: "0" }
      parallel: { description: "shards running at once (the repository has 20 runners; tengoku's own CI waits for them too: leave it room)", default: "6" }
      recut_from: { description: "RECUT: the id of an earlier run of this workflow for this key. No plan, no shards: its shard artifacts are merged again, without the modules in `drop` (and what imports them), and the new bundle is attested by this run", default: "" }
      drop: { description: "RECUT: modules (comma list) that did not build on the tree, from the merge queue's build of the bundle", default: "" }
      scope: { description: "RECUT: the `leak:` lines of the merge queue's leak report (separated by `;`): those registrations are made local (scripts/bump/scope_rewrite.py)", default: "" }
      tengoku_ref: { description: "a branch of competemath/tengoku to read the library's tentative records from (default main), for records whose PR is not merged yet", default: "" }
      parts: { description: "PARTS: cut each bundle into parts of at most this many modules (scripts/bump/bundle_layers.py), each attested as bundle-<key>-<mode>-part-NNN.tar, for a library too big for one intake PR (the queue builds ~3 s a module in 40 minutes: 300). 0 = no parts", default: "0" }
      verify: { description: "build the bundle in the TREE's own environment (the merge queue's own build, on a checkout seeded from the tree's cache) before it is cut into parts: the modules the tree refuses are dropped with their importers, and what ships is proven byte for byte what was built there. `false` skips it", default: "true" }
      verify_partial: { description: "verify: a build that runs out of its time (210 min) still ships the modules it built; the rest are left for the next from-tree round. For a library with more new modules than one runner builds in that time (a first cut of a giant). Default `false`: a build that does not finish fails the run", default: "false" }
      verify_modes: { description: "the bundle modes that are built in the tree (comma list of strict, proposed, wide): the intake opener ships `proposed`; a mode that is not built ships as the factory cut it", default: "proposed" }
      fork_identical: { description: "with dups: a copy that IS the tree's module is forked too (shipped again under <Library>Fork) when a file of Lean's module system would have to import a tree module that is not one, which Lean refuses; its theorems are duplicates of the tree's and the report counts them apart (dups.duplicate_theorems). Off: such a copy and what imports it stay out", default: "false" }
      dups: { description: "COPIES OF TREE MODULES (tree_dups.py): a module of the library that declares a name the tree already has is not dropped with what imports it at once. It stays in the draft; the tree builds it; where every declaration of it has the same fingerprint (type, value, and everything below them) as the tree's module, the copy is not shipped and what imports it imports the tree's module instead, and each such importer is built again and must come out with exactly the declarations it had. Anything else goes the way it went before. Needs verify", default: "false" }
      from_tree: { description: "PARTS, on a recut after some parts merged: cut only the modules the tree does not have yet (the library's Tengoku/<Ns>.lean on tengoku main), numbered from the next part, so the new parts extend what merged (scripts/bump/bundle_layers.py --tree-umbrella)", default: "" }
      gate2_budget_min: { description: "minutes Gate 2 may spend on each shard (default 150; the shard job has 345 in all, the build and export come first). A shard whose chunks do not fit leaves the rest unjudged, and an unjudged module is cut with its importers", default: "150" }
      gate2_skip: { description: "modules (comma list, the library's own names) that killed Lean alone in an earlier run: Gate 2 does not try them again (they get no verdict, as before) and spends the time on the others", default: "" }
      gate2_rss_share: { description: "the share of the runner's memory one Lean process of Gate 2 may use (default 0.80 = 12.8 GB of 16). A module that outgrows it alone gets no verdict and is cut with its importers", default: "0.80" }
      only_shards: { description: "RESUME: run only these shards of the plan (comma list of shard numbers), the one that died; with fill_from for the others", default: "" }
      fill_from: { description: "RESUME: the id of an earlier run of this workflow for this key whose shard artifacts fill in the shards this run does not build. Its plan must be this run's plan (checked)", default: "" }
      fill_unrecorded: { description: "RESUME: fill_from is a run from before plans recorded what the shards are built with (plan/inputs.json): you vouch that it ran with the same mathlib, toolchain, imports and tengoku_ref as this one", default: "false" }
      imports: { description: "full = every Mathlib/Batteries/Aesop/Qq/ProofWidgets import of a library module becomes the umbrella (the shards run normalize-imports; the bundle imports the root `Tengoku`). faithful = the library keeps the imports its authors wrote and the bundle names the same modules in the tree (`Tengoku.Seed.X`), with a one-line docstring per module: for a library whose names turn ambiguous under the umbrella (navier-stokes-euler). A recut must use what its shards were built with", type: choice, options: [full, faithful], default: "full" }
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  plan:
    if: ${{ inputs.recut_from == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: read }
    env: { KEY: "${{ inputs.key }}", SHARDS: "${{ inputs.shards }}", MAX_TARGETS: "${{ inputs.max_targets }}", TENGOKU_REF: "${{ inputs.tengoku_ref }}" }
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      run_shards: ${{ steps.run.outputs.run_shards }}
    steps:
      - name: This repository (scripts, the library's setup) and tengoku's entries for it
        run: |
          git clone -q --filter=blob:none --no-checkout "https://github.com/$GITHUB_REPOSITORY" emissary
          git -C emissary sparse-checkout set --no-cone "/scripts/" "/sources.json" "/data/exports/$KEY/setup.ci.json"
          git -C emissary checkout -q "$GITHUB_SHA"
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku tengoku
          git -C tengoku sparse-checkout set --no-cone "/data/tentative/$KEY.jsonl" "/data/tentative/$KEY/"
          # TENGOKU_REF: a branch of the tree repository that holds the records of a library whose PR is not merged yet (empty: main)
          ref=${TENGOKU_REF:+origin/$TENGOKU_REF}; git -C tengoku checkout -q "${ref:-main}"
      - name: The library, its import graph, the plan
        id: p
        working-directory: emissary
        run: |
          read -r repo commit _ roots < <(python3 scripts/trial-library-build.py meta "$KEY")
          git clone -q --filter=blob:none "$repo" lib && git -C lib checkout -q "$commit"
          # a library whose Lake project is a subdirectory of its repository (sources.json `subdir`): `lib` is that project, a symlink, so that a path dependency (`../concepts`)
          # still resolves next to it in the clone (as bump-library.yml does)
          sub=$(python3 -c "import json, os; print(json.load(open('sources.json'))['sources'][os.environ['KEY']].get('subdir', ''))")
          if [ -n "$sub" ]; then mv lib lib-repo && ln -s "lib-repo/$sub" lib; fi
          python3 - <<'PY'
          import glob, json, math, os, sys
          sys.path.insert(0, "scripts/bump")
          import gate2_batch as g, plan_shards as ps
          from pathlib import Path
          key = os.environ["KEY"]
          roots = [r for r in json.load(open(f"data/exports/{key}/setup.ci.json"))["roots"]]
          ents = g.tentative_entries(sorted(glob.glob(f"../tengoku/data/tentative/{key}.jsonl") + glob.glob(f"../tengoku/data/tentative/{key}/*.jsonl")))
          import tolerant_build as tb
          wanted = {".".join(tb.esc(x) for x in r["sourcePath"][:-5].split("/")) for r in ents.values()}
          imp, weight = ps.graph(Path("lib"), roots)
          wanted &= set(imp)
          k = int(os.environ["SHARDS"] or 0)
          if k <= 0:  # automatic: start from one shard per ~200k lines, then as many as it takes for no shard to build more than ps.MAX_SHARD_LINES (Gate 2 is one lean process: a bigger shard is OOM-killed)
              k, plan = ps.choose_k(imp, weight, wanted, max(1, math.ceil(sum(weight.values()) / 200_000)))
          else:
              plan = ps.plan(imp, weight, k, wanted=wanted)
          if int(os.environ.get("MAX_TARGETS") or 0) > 0:  # the shards that judge too many modules are cut (plan_shards.plan, max_targets)
              plan = ps.plan(imp, weight, k, wanted=wanted, max_targets=int(os.environ["MAX_TARGETS"]))
          os.makedirs("../plan", exist_ok=True)
          json.dump(plan, open("../plan/plan.json", "w"))
          print({kk: v for kk, v in plan.items() if kk != "shards"}, "entries:", len(ents), "modules with entries:", len(wanted))
          shards = [s["shard"] for s in plan["shards"] if s["targets"]]
          out = os.environ["GITHUB_OUTPUT"]
          open(out, "a").write("shards=" + json.dumps(shards) + "\n")
          PY
      - name: The shards this run builds (all of the plan, or only_shards)
        id: run
        working-directory: emissary
        env: { PLANNED: "${{ steps.p.outputs.shards }}", ONLY: "${{ inputs.only_shards }}" }
        run: echo "run_shards=$(python3 scripts/bump/shard_pack.py select --planned "$PLANNED" --only "$ONLY")" >> "$GITHUB_OUTPUT"
      # what the shards are built with: shards built under other settings must not be mixed in by a resume (fill_from), and the plan alone does not say
      - name: What the shards are built with
        working-directory: emissary
        env: { MATHLIB: "${{ inputs.mathlib }}", TOOLCHAIN: "${{ inputs.toolchain }}", IMPORTS: "${{ inputs.imports }}", TENGOKU_REF: "${{ inputs.tengoku_ref }}" }
        run: |
          python3 - <<'PY'
          import json, os
          names = ("MATHLIB", "TOOLCHAIN", "IMPORTS", "TENGOKU_REF")
          json.dump({k.lower(): os.environ[k] for k in names}, open("../plan/inputs.json", "w"), indent=1, sort_keys=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "plan-${{ inputs.key }}", path: plan, retention-days: 14 }
  shard:
    needs: plan
    if: ${{ inputs.recut_from == '' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix: { shard: "${{ fromJSON(needs.plan.outputs.run_shards) }}" }
    uses: ./.github/workflows/bump-shard.yml
    with:
      key: ${{ inputs.key }}
      mathlib: ${{ inputs.mathlib }}
      toolchain: ${{ inputs.toolchain }}
      shard: ${{ matrix.shard }}
      tengoku_ref: ${{ inputs.tengoku_ref }}
      imports: ${{ inputs.imports }}
      gate2_budget_min: ${{ inputs.gate2_budget_min }}
      gate2_rss_share: ${{ inputs.gate2_rss_share }}
      gate2_skip: ${{ inputs.gate2_skip }}
    permissions: { contents: read }
  # compose: the DRAFT. Merges the shards and cuts the bundle exactly as `finish` will, and hands the draft to `verify` (the tree's own build of it). Nothing is signed here
  # and no code of the library runs: the shards' artifacts are read as data (shard_pack.merge refuses symlinks and `..`).
  compose:
    needs: [plan, shard]
    if: ${{ !cancelled() && (inputs.recut_from != '' || needs.plan.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: { contents: read, actions: read }  # actions: read = the shard artifacts of an earlier run (recut)
    env: { KEY: "${{ inputs.key }}", TOOLCHAIN: "${{ inputs.toolchain }}", DROP: "${{ inputs.drop }}", SCOPE: "${{ inputs.scope }}", VERIFY: "${{ inputs.verify }}", VERIFY_MODES: "${{ inputs.verify_modes }}", DUPS: "${{ inputs.dups }}", IMPORTS: "${{ inputs.imports }}" }
    outputs:
      modes: ${{ steps.draft.outputs.modes }}
    steps:
      - name: This repository (scripts, the library's setup)
        run: |
          git clone -q --filter=blob:none --no-checkout "https://github.com/$GITHUB_REPOSITORY" emissary
          git -C emissary sparse-checkout set --no-cone "/scripts/" "/sources.json" "/data/exports/$KEY/setup.ci.json"
          git -C emissary checkout -q "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: "shard-${{ inputs.key }}-*", path: shards, run-id: "${{ inputs.recut_from || github.run_id }}", github-token: "${{ github.token }}" }
      # RESUME (fill_from): the shards this run did not build come from the earlier run; a shard built here is never replaced by its old copy
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.fill_from != '' }}
        with: { pattern: "shard-${{ inputs.key }}-*", path: shards-fill, run-id: "${{ inputs.fill_from }}", github-token: "${{ github.token }}" }
      - name: Fill in the shards of the earlier run
        if: ${{ inputs.fill_from != '' }}
        run: python3 emissary/scripts/bump/shard_pack.py fill --shards shards --fill shards-fill
      # this run's plan: its own, or (a recut that fills in from another run has no plan job) the plan of the run it recuts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.fill_from != '' }}
        with: { name: "plan-${{ inputs.key }}", path: plan-new, run-id: "${{ inputs.recut_from || github.run_id }}", github-token: "${{ github.token }}" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.fill_from != '' }}
        with: { name: "plan-${{ inputs.key }}", path: plan-old, run-id: "${{ inputs.fill_from }}", github-token: "${{ github.token }}" }
      - name: The earlier run planned the same shards, built with the same settings
        if: ${{ inputs.fill_from != '' }}
        env: { UNRECORDED: "${{ inputs.fill_unrecorded }}" }
        run: |
          cmp plan-old/plan.json plan-new/plan.json || { echo "::error::the plan of fill_from differs from this run's, so its shards are not these shards (same shards, library commit?)"; exit 1; }
          if [ -f plan-old/inputs.json ]; then
            cmp plan-old/inputs.json plan-new/inputs.json || { echo "::error::fill_from was built with other settings (mathlib, toolchain, imports, tengoku_ref) than this run"; exit 1; }
          elif [ "$UNRECORDED" != true ]; then
            echo "::error::fill_from recorded no settings (it predates plan/inputs.json): pass fill_unrecorded=true to vouch that they are the same"; exit 1
          fi
      - name: Every shard of the plan has its result (a shard whose job died must not read as a library without it)
        # a plain recut has no plan and merges what an earlier run left; a recut that fills in from another run (fill_from) has the plan of the run it recuts, checked above
        if: ${{ inputs.recut_from == '' || inputs.fill_from != '' }}
        env: { PLANNED: "${{ needs.plan.outputs.shards }}" }
        run: |
          if [ -z "$PLANNED" ]; then
            PLANNED=$(python3 -c "import json; p = json.load(open('plan-new/plan.json')); print(json.dumps([s['shard'] for s in p['shards'] if s['targets']]))")
          fi
          python3 emissary/scripts/bump/shard_pack.py complete --shards shards --key "$KEY" --planned "$PLANNED"
      - name: The record names the tree already has (tengoku data files, read as text and never run)
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku tengoku
          git -C tengoku sparse-checkout set --no-cone "/data/trusted/" "/data/intake/" "/Tengoku/" "!/Tengoku/Seed/"
          git -C tengoku checkout -q main
          python3 emissary/scripts/bump/tree_names.py --root tengoku --lib "$KEY" --out tree-names.txt --decls-out tree-decls.txt
      - name: Merge the shards and cut the bundle
        working-directory: emissary
        run: |
          mkdir -p ../merged ../logs
          python3 scripts/bump/shard_pack.py merge --shards ../shards --out ../merged --logs ../logs
          cat ../logs/gate2-results.json
          # the copies of tree modules stay in the draft for the tree's build to decide (tree_dups.py), when asked for and when there is a tree build to decide them
          keep=(); if [ "$DUPS" = true ] && [ "$VERIFY" != false ]; then keep=(--keep-dups); fi
          python3 scripts/bump/bundle.py compose --lib ../merged --log ../logs/bundle-deps.log --passed ../logs/passed.json --meta "data/exports/$KEY/setup.ci.json" \
            --key "$KEY" --toolchain "$TOOLCHAIN" --errors ../logs/errors.log --gate2 ../logs/gate2.log --gate2-killed ../logs/gate2-killed.json --out ../bundle --src ../pruned-src --drop-modules "$DROP" \
            --tree-names ../tree-names.txt --tree-decls ../tree-decls.txt --drop-leaks --imports "$IMPORTS" "${keep[@]}"
      - name: Make the registrations that leak into other libraries local (RECUT only)
        if: ${{ inputs.scope != '' }}
        run: python3 emissary/scripts/bump/scope_rewrite.py --bundle bundle --bundle bundle-proposed --bundle bundle-wide --reexport --leaks "$SCOPE"
      # The draft of every mode that is to be verified, as a tar. `verify` builds each in the tree; `finish` cuts the same bundle again from the same shards and the same
      # tree names (they travel with the draft), drops what the tree refused, and proves that what is left is byte for byte what was built.
      - name: The draft, for the tree's build
        id: draft
        run: |
          modes='[]'
          if [ "$VERIFY" != false ]; then
            modes=$(python3 -c 'import json, os, sys; m = [x for x in os.environ["VERIFY_MODES"].replace(",", " ").split()]; bad = [x for x in m if x not in ("strict", "proposed", "wide")]; sys.exit(f"unknown mode(s) {bad}") if bad else print(json.dumps(sorted(set(m))))')
            for mode in $(python3 -c 'import json, sys; print(" ".join(json.loads(sys.argv[1])))' "$modes"); do
              dir=bundle; [ "$mode" != strict ] && dir="bundle-$mode"
              tar -C "$dir" -cf "draft-$mode.tar" .
            done
          fi
          echo "modes=$modes" >> "$GITHUB_OUTPUT"
          echo "verifying in the tree: $modes"
          mkdir -p draft && { mv draft-*.tar draft/ 2>/dev/null || true; } && cp tree-names.txt tree-decls.txt draft/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "draft-${{ inputs.key }}", path: draft, retention-days: 14, if-no-files-found: error }
  # verify: the merge queue's own build, ahead of time, on the whole draft. A checkout of the tree seeded from its attested cache (as the queue seeds it), the draft's new
  # modules copied in, `lake build` of every one of them. The modules that fail (and what imports them) are dropped by `finish`. This job compiles the library's code, so it
  # holds nothing: read-only token, no signing identity, and the one token it ever sees (the cache download) is only in that step's environment.
  verify:
    needs: compose
    if: ${{ !cancelled() && needs.compose.result == 'success' && needs.compose.outputs.modes != '[]' }}
    strategy:
      fail-fast: false
      matrix: { mode: "${{ fromJSON(needs.compose.outputs.modes) }}" }
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions: { contents: read }
    env: { KEY: "${{ inputs.key }}", MODE: "${{ matrix.mode }}", VERIFY_PARTIAL: "${{ inputs.verify_partial }}", DUPS: "${{ inputs.dups }}", FORK_IDENTICAL: "${{ inputs.fork_identical }}" }
    steps:
      # the copies-of-tree-modules steps spend what is left of the job after the steps that must still run (axiom check 15, clash scan 20, whole-tree import 50, verdict and upload 25: 110 minutes)
      - name: The clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: This repository (scripts)
        run: |
          git clone -q --filter=blob:none --no-checkout "https://github.com/$GITHUB_REPOSITORY" emissary
          git -C emissary sparse-checkout set --no-cone "/scripts/"
          git -C emissary checkout -q "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: "draft-${{ inputs.key }}", path: draft }
      - name: The draft
        run: mkdir bundle && tar --no-same-owner -xf "draft/draft-$MODE.tar" -C bundle
      # the tree's cache is several GB packed and about ten times that unpacked (queue-gate.yml, "Free disk"). The runner has 145 GB, 34 GB of it used before anything runs: the tree's build
      # directory now takes most of the rest, and a runner whose disk fills is LOST, with no log and no error (2026-10-13: the tauceti verify job, the queue's last step for lean-pool part 10 and
      # both nightly cache builds died that way within 12 hours). So: free what the build does not use, and measure (out/disk.log is uploaded with the verdict).
      - name: Free disk (the tree's cache and build are several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/local/graalvm /usr/local/share/chromium || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo swapoff -a >/dev/null 2>&1 || true; sudo rm -f /mnt/swapfile /swapfile || true
          mkdir -p out && { echo "== after freeing"; df -h / | tail -1; } | tee out/disk.log
      # the installer at a fixed commit, checked against its digest before it runs (as bundle-keep-tests.yml does): this job's verdict is what `finish` signs, so what it runs must not be mutable
      - name: Lean toolchain (pinned by the tree's lean-toolchain)
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none && echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -q zstd >/dev/null
      - name: The tree, seeded from the newest published cache (verified), as the merge queue seeds it
        env: { GH_TOKEN: "${{ github.token }}", TENGOKU_VERIFY: require, TENGOKU_TOPUPS: "1" }
        run: |
          git clone -q --filter=blob:none https://github.com/competemath/tengoku tree
          mkdir -p out
          echo "tree: $(git -C tree rev-parse HEAD)" | tee out/tree-sha.txt
          cd tree && scripts/cache.sh get 2>&1 | tail -3
          { echo "== after seeding"; df -h / | tail -1; du -sh .lake/build 2>/dev/null; } | tee -a ../out/disk.log
      - name: Copy the new modules into the tree
        run: |
          python3 emissary/scripts/bump/tree_verify.py apply --bundle bundle --tree tree --out out
          : > out/dups-failures.txt  # the importers of a copy of a tree module that the swap refused (tree_dups.py): none unless a step below says so
      # the queue's own command, for every new module at once. Lake goes on after a module fails and lists them all; a build that is killed leaves a log with no ending,
      # which `collect` refuses (nothing is verified by a log that stops).
      - name: Build them (the queue's own command)
        run: |
          targets="$(tr '\n' ' ' < out/targets.txt)"
          if [ -z "${targets// }" ]; then echo "nothing new to build"; echo "Build completed successfully" > out/build.log; exit 0; fi
          if [ ${#targets} -gt 1500000 ]; then echo "::error::the new modules do not fit one command line; recut from the tree in rounds (from_tree) so that fewer are new"; exit 1; fi
          cd tree
          set +e
          # the disk, every minute: a runner whose disk fills dies without a word, and this is what says so afterwards
          ( while sleep 60; do echo "$(date -u +%H:%M:%S) $(df -h / | tail -1 | awk '{print "used=" $3 " avail=" $4}') mem_avail_kb=$(awk '/MemAvailable/ {print $2}' /proc/meminfo)" >> ../out/disk.log; done ) &
          sampler=$!
          # shellcheck disable=SC2086  # targets is a space-separated module list
          timeout -k 60 210m lake build $targets 2>&1 | tee ../out/build.log
          echo "lake exit status: ${PIPESTATUS[0]}"
          kill "$sampler" 2>/dev/null || true
          { echo "== after the build"; df -h / | tail -1; du -sh .lake/build 2>/dev/null; } >> ../out/disk.log
      # R2 (tree_repair.py): a declaration that ran out of heartbeats in the tree is given room (`set_option … in` above it and one line of module docstring saying so) and the same command
      # builds the modules again. A module that still fails is refused like one that never had a repair; `collect` reads the log in two parts at the marker. The repaired bytes are what
      # `check` holds the shipped modules to, and `compose --tree-repairs` makes the same edit in `finish`.
      - name: Give the declarations that ran out of heartbeats room, and build again (tree_repair.py)
        run: |
          python3 emissary/scripts/bump/tree_repair.py plan --log out/build.log --new out/new.json --tree tree --out out | tee out/repairs.txt
          if python3 -c 'import json, sys; sys.exit(0 if json.load(open("out/repairs.json"))["modules"] else 1)'; then
            targets="$(tr '\n' ' ' < out/targets.txt)"
            python3 -c 'import sys; sys.path.insert(0, "emissary/scripts/bump"); import tree_repair; print(tree_repair.MARKER)' >> out/build.log
            cd tree
            set +e
            # shellcheck disable=SC2086  # targets is a space-separated module list
            timeout -k 60 90m lake build $targets 2>&1 | tee -a ../out/build.log
            echo "lake exit status: ${PIPESTATUS[0]}"
          else
            echo "nothing to repair"
          fi
      - name: What the build accepted
        run: |
          flag=(); if [ "$VERIFY_PARTIAL" = true ]; then flag=(--allow-unfinished); fi
          python3 emissary/scripts/bump/tree_verify.py collect --new out/new.json --log out/build.log --out out --bundle bundle "${flag[@]}"
      # COPIES OF TREE MODULES (tree_dups.py, input `dups`). The draft still holds each copy M of a tree module and everything that imports it, and the tree has built them all. Here: which copies
      # are provably the same as the tree's module (every declaration of M has the fingerprint, type + value + everything below, of a declaration of the tree's module(s)), what imports them
      # imports the tree's module instead, those importers are built again, and each must come out with exactly the declarations it had. What this does and does not guarantee is in tree_dups.py.
      # Every step below leaves a verdict (`out/dups.json`) in which nothing is aliased when it does not run, has no time, or its Lean program does not finish: the copy then goes the way it went
      # before this existed (the clash scan refuses it with what imports it).
      - name: Copies of tree modules in the draft (tree_dups.py candidates)
        id: dups_find
        run: |
          found=false
          if [ "$DUPS" = true ] && [ -s out/built.txt ]; then
            cap=$(( (JOB_START + 355 * 60 - $(date +%s)) / 60 - 110 )); [ "$cap" -gt 10 ] && cap=10
            if [ "$cap" -ge 3 ]; then
              cd tree
              timeout -k 30 "${cap}m" lake env lean --run ../emissary/scripts/bump/ModuleClashes.lean .lake/build/lib/lean ../out/built.txt Tengoku > ../out/clashes-dups.txt 2>&1 || true
              tail -n 3 ../out/clashes-dups.txt
              cd ..
              # a scan that did not finish (killed, out of time) has no `clashes:` line: nothing is known, nothing is aliased, and the job goes on (the clash scan after these steps decides, as before)
              if grep -q '^clashes: ' out/clashes-dups.txt; then
                python3 emissary/scripts/bump/tree_dups.py candidates --clashes out/clashes-dups.txt --new out/new.json --built out/built.txt --bundle bundle --tree tree --out out --mode "$MODE"
                if [ -s out/dups-before.txt ]; then found=true; fi
              else
                echo "::warning::the clash scan for copies of tree modules did not finish: nothing is aliased"
              fi
            else
              echo "::warning::no time left to look for copies of tree modules"
            fi
          fi
          [ -f out/dups.json ] || python3 -c 'import json, sys; n = json.load(open("out/new.json")); json.dump({"ns": n["ns"], "mode": sys.argv[1], "aliases": {}, "not_same": {}, "refused": {}}, open("out/dups.json", "w"))' "$MODE"
          echo "found=$found" >> "$GITHUB_OUTPUT"
      - name: Copies of tree modules, fingerprinted (ModuleFingerprint.lean)
        if: ${{ steps.dups_find.outputs.found == 'true' }}
        run: |
          cap=$(( (JOB_START + 355 * 60 - $(date +%s)) / 60 - 110 )); [ "$cap" -gt 60 ] && cap=60
          if [ "$cap" -lt 6 ]; then echo "::warning::no time left to fingerprint the copies of tree modules"; exit 0; fi
          # the copies and what imports them, then the tree's modules; the tree's modules are named in both so that they are compared whole, like the library's own. Every module is fingerprinted in
          # an environment of its own, in a process of its own, four at once (fingerprint_chunks.sh): a module that cannot be loaded, or a process that dies, loses only its own share
          chunks=emissary/scripts/bump/fingerprint_chunks.sh
          # the namespace a forked copy is wrapped in is left off every name the program reads (FP_STRIP): the same value in every run that is compared with another
          export FP_STRIP="$(python3 -c 'import json, sys; sys.path.insert(0, "emissary/scripts/bump"); import tree_dups; print(tree_dups.fork_namespace(json.load(open("out/new.json"))["ns"]))')"
          bash "$chunks" "$PWD/out/dups-before.txt" "$PWD/out/dups-partners.txt" out/fp-before.txt "$((cap * 2 / 3))"
          bash "$chunks" "$PWD/out/dups-partners.txt" "$PWD/out/dups-partners.txt" out/fp-partners.txt "$((cap / 3))"
          n() { grep -c "^$1" "$2" || true; }  # grep -c prints 0 and exits 1 when nothing matches
          echo "fingerprinted: $(n FPEND out/fp-before.txt) of $(wc -l < out/dups-before.txt) copies and importers, $(n FPEND out/fp-partners.txt) of $(wc -l < out/dups-partners.txt) tree modules; $(( $(n FPERR out/fp-before.txt) + $(n FPERR out/fp-partners.txt) )) could not be loaded"
      - name: Copies of tree modules, decided; their importers move to the tree's module (tree_dups.py plan)
        id: dups_plan
        if: ${{ steps.dups_find.outputs.found == 'true' }}
        run: |
          swapped=false
          python3 emissary/scripts/bump/tree_dups.py plan --candidates out/dups-candidates.json --fp-before out/fp-before.txt --fp-partners out/fp-partners.txt --new out/new.json --tree tree --out out --mode "$MODE" --fork $([ "$FORK_IDENTICAL" = true ] && echo --fork-identical) | tee out/dups.txt
          if python3 -c 'import json, sys; d = json.load(open("out/dups.json")); sys.exit(0 if d["aliases"] or d["forked"] else 1)'; then swapped=true; fi
          echo "swapped=$swapped" >> "$GITHUB_OUTPUT"
      - name: Copies of tree modules, the importers built on the tree's module
        if: ${{ steps.dups_plan.outputs.swapped == 'true' }}
        run: |
          : > out/build-dups.log
          cap=$(( (JOB_START + 355 * 60 - $(date +%s)) / 60 - 110 )); [ "$cap" -gt 180 ] && cap=180
          if [ "$cap" -lt 10 ]; then echo "::warning::no time left to build the importers of the copies: none of them is kept"; exit 0; fi
          targets="$(tr '\n' ' ' < out/targets.txt)"
          cd tree
          set +e
          # shellcheck disable=SC2086  # targets is a space-separated module list
          timeout -k 60 "${cap}m" lake build $targets 2>&1 | tee ../out/build-dups.log
          echo "lake exit status: ${PIPESTATUS[0]}"
          # R2 again, for THIS build (the importers on the tree's modules): a limit that is too small in that environment is given room the same way as in the first build (tree_repair.py), and the build
          # is made again; what ships carries the same edit (`compose` applies it last, from dups.json). A module that now builds lets the ones after it be reached, and they may need room too: up to six
          # rounds, each module repaired once. The log of round N stays in out/build-dups-N.log. Nothing is planned unless there is time to build again: a plan changes the checkout and new.json, and
          # a log that was emptied for a build that never ran would refuse every importer, the ones that built too.
          round=0
          while [ "$round" -lt 6 ]; do
            cap=$(( (JOB_START + 355 * 60 - $(date +%s)) / 60 - 110 )); [ "$cap" -gt 180 ] && cap=180
            if [ "$cap" -lt 10 ]; then echo "::warning::no time left to repair the importers' build: the verdict of the last round stands"; break; fi
            skip=""; [ "$round" -gt 0 ] && skip="--skip-repaired"
            round=$((round + 1))
            python3 ../emissary/scripts/bump/tree_repair.py plan --log ../out/build-dups.log --new ../out/new.json --tree . --out "../dups-repair-$round" $skip | tee -a ../out/dups-repairs.txt
            cp "../dups-repair-$round/repairs.json" ../out/dups-repairs.json
            python3 -c 'import json, sys; sys.exit(0 if json.load(open("../out/dups-repairs.json"))["modules"] else 1)' || break
            cp ../out/build-dups.log "../out/build-dups-$round.log"
            python3 ../emissary/scripts/bump/tree_dups.py add-repairs --dups ../out/dups.json --repairs ../out/dups-repairs.json
            : > ../out/build-dups.log
            # shellcheck disable=SC2086  # targets is a space-separated module list
            timeout -k 60 "${cap}m" lake build $targets 2>&1 | tee ../out/build-dups.log
            echo "lake exit status: ${PIPESTATUS[0]}"
          done
          python3 -c 'import sys; sys.path.insert(0, "../emissary/scripts/bump"); import tree_verify; print(tree_verify.DUPS_MARKER)' >> ../out/build.log
          cat ../out/build-dups.log >> ../out/build.log
      - name: Copies of tree modules, the importers fingerprinted again, and the verdict (tree_dups.py after-verdict)
        if: ${{ steps.dups_plan.outputs.swapped == 'true' }}
        run: |
          common=(--candidates out/dups-candidates.json --dups out/dups.json --new out/new.json --tree tree --log2 out/build-dups.log --out out)
          python3 emissary/scripts/bump/tree_dups.py after-list "${common[@]}"
          : > out/fp-after.txt
          cap=$(( (JOB_START + 355 * 60 - $(date +%s)) / 60 - 110 )); [ "$cap" -gt 60 ] && cap=60
          if [ -s out/dups-after.txt ] && [ "$cap" -ge 6 ]; then
            # the namespace a forked copy is wrapped in is left off every name the program reads (FP_STRIP): the same value in every run that is compared with another
            export FP_STRIP="$(python3 -c 'import json, sys; sys.path.insert(0, "emissary/scripts/bump"); import tree_dups; print(tree_dups.fork_namespace(json.load(open("out/new.json"))["ns"]))')"
            bash emissary/scripts/bump/fingerprint_chunks.sh "$PWD/out/dups-after.txt" "$PWD/out/dups-partners.txt" out/fp-after.txt "$cap"
          elif [ -s out/dups-after.txt ]; then
            echo "::warning::no time left to fingerprint the importers again: none of them is kept"
          fi
          python3 emissary/scripts/bump/tree_dups.py after-verdict "${common[@]}" --fp-before out/fp-before.txt --fp-after out/fp-after.txt | tee -a out/dups.txt
          { echo "### Copies of tree modules ($KEY, $MODE)"; cat out/dups.txt; } >> "$GITHUB_STEP_SUMMARY"
      # The axiom check imports every module that built in ONE Lean environment, so two modules that declare the same name stop it before it checks anything (lana-oka, 2026-10-19: the library's own copy of
      # Mathlib's `Sheaf/Submodule` against the seed's, "import Tengoku.Seed.… failed, environment already contains 'SheafOfModules.Submodule.noConfusion'"; the clash scan sat after the axiom check and never
      # ran, and the whole verify failed). The scan below reads the names without importing anything, so it comes first, and the modules it refuses are out of the list the axiom check imports.
      # The queue's last step imports the whole tree at once (`Tengoku.All`): two modules of different libraries that declare the same name stop it, and no module of one library imports another,
      # so nothing above sees it (lean-pool part 10, 2026-10-12: its vendored copy of AddCombi against the tree's AddCombi, "environment already contains"). ModuleClashes.lean reads the names
      # every module declares (no import: an import stops at the first clash) and lists the pairs that share one when one of them is new.
      - name: The names that two modules of the tree both declare (what `import Tengoku.All` stops at)
        run: |
          if [ -s out/built.txt ]; then
            cd tree
            timeout -k 60 20m lake env lean --run ../emissary/scripts/bump/ModuleClashes.lean .lake/build/lib/lean ../out/built.txt Tengoku 2>&1 | tee ../out/clashes.txt
          else
            echo "clashes: 0 module pair(s), 0 name(s)" > out/clashes.txt
          fi
      - name: The modules that share a name with the tree leave the list the axioms are checked on
        run: |
          flag=(); if [ "$VERIFY_PARTIAL" = true ]; then flag=(--allow-unfinished); fi
          python3 emissary/scripts/bump/tree_verify.py collect --new out/new.json --log out/build.log --out out --bundle bundle --clashes out/clashes.txt --extra-failing out/dups-failures.txt "${flag[@]}" > /dev/null
      # The queue's second step: the axioms of every declaration of what it built (Gate 2 checks theorems only: an instance made by `deriving Repr` on a Finset product
      # rests on `lcProof`, and lean-pool part 10, which compiled, was rejected on it). ModuleAxioms.lean is that check with the module of each offender in its output.
      - name: The axiom check of the queue, on every module that built
        run: |
          if [ -s out/built.txt ]; then
            cd tree
            timeout -k 60 15m lake env lean --run ../emissary/scripts/bump/ModuleAxioms.lean ../out/built.txt 2>&1 | tee ../out/axioms.txt
          else
            echo "axioms: 0 declarations checked, 0 with non-standard axioms" > out/axioms.txt
          fi
      # The authority on the import of the whole tree is Lean itself, not a re-implementation of its rules: the static scan above missed a real clash (lean-pool part 10, twice: the tree's module
      # is a module-system file, whose olean has a public and a private part). A file that imports every module of the tree and the new ones that are still in play is elaborated, as the queue's
      # last step does; when Lean refuses it (`import X failed, environment already contains 'N' from Y`) the new module of the pair goes with its importers and the file is elaborated again.
      - name: The import of the whole tree, as the queue does it (what `import Tengoku.All` stops at)
        run: |
          flag=(); if [ "$VERIFY_PARTIAL" = true ]; then flag=(--allow-unfinished); fi
          python3 emissary/scripts/bump/tree_verify.py collect --new out/new.json --log out/build.log --out out --bundle bundle --axioms out/axioms.txt --clashes out/clashes.txt --extra-failing out/dups-failures.txt "${flag[@]}" > /dev/null
          : > out/union-excluded.txt
          if [ ! -s out/built.txt ]; then echo "nothing built: nothing to import"; exit 0; fi
          # the tree is `Tengoku.All`, what the queue's last step builds: NOT every olean of the cache (it keeps the oleans of modules that no longer exist: the seed's move left
          # `Tengoku.Std.CodeAction.Deprecated` next to `Tengoku.Seed.Std.CodeAction.Deprecated`) and NOT every source file (Aesop's `DiscrKeyConfig` and `DiscrTreeConfig` both declare
          # `Aesop.indexConfig` and are never imported together): two attempts at that, refused by pairs that no `import Tengoku.All` contains
          deadline=$((SECONDS + 3000)); settled=0
          for i in $(seq 1 60); do
            python3 emissary/scripts/bump/tree_verify.py union-input --root Tengoku.All --new out/new.json --keep out/built.txt --excluded out/union-excluded.txt --out out/UnionImport.lean
            if (cd tree && timeout -k 30 20m lake env lean ../out/UnionImport.lean) > "out/union-$i.txt" 2>&1; then settled=1; echo "the whole tree imports, after $((i - 1)) exclusion(s)"; break; fi
            head -3 "out/union-$i.txt"
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::the import of the whole tree did not settle in 50 minutes"; exit 1; }
            python3 emissary/scripts/bump/tree_verify.py union-next --message "out/union-$i.txt" --new out/new.json --keep out/built.txt --excluded out/union-excluded.txt --bundle bundle
          done
          [ "$settled" = 1 ] || { echo "::error::the import of the whole tree did not settle"; exit 1; }
      - name: What the tree accepted
        run: |
          flag=(); if [ "$VERIFY_PARTIAL" = true ]; then flag=(--allow-unfinished); fi
          python3 emissary/scripts/bump/tree_verify.py collect --new out/new.json --log out/build.log --out out --bundle bundle --axioms out/axioms.txt --clashes out/clashes.txt --union-excluded out/union-excluded.txt --extra-failing out/dups-failures.txt "${flag[@]}"
          { echo "### Tree build ($KEY, $MODE)"; cat out/summary.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the log
        if: ${{ always() }}
        run: gzip -n out/build.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: treeverify-${{ inputs.key }}-${{ matrix.mode }}
          path: |
            out/new.json
            out/ok.json
            out/repairs.json
            out/repairs.txt
            out/failing.txt
            out/summary.txt
            out/axioms.txt
            out/clashes.txt
            out/union-excluded.txt
            out/union-excluded.reasons
            out/union-*.txt
            out/dups.json
            out/dups.txt
            out/dups-candidates.json
            out/dups-failures.txt
            out/dups-before.txt
            out/dups-partners.txt
            out/dups-after.txt
            out/clashes-dups.txt
            out/fp-before.txt
            out/fp-partners.txt
            out/fp-after.txt
            out/fp-*.err
            out/build-dups.log
            out/build-dups-[1-6].log
            out/dups-repairs.txt
            out/dups-repairs.json
            out/disk.log
            out/build.log.gz
            out/tree-sha.txt
          retention-days: 14
          if-no-files-found: ignore
  # finish: cuts the bundle again from the same shards and the same tree names, drops what the tree refused (and what imports it), proves that every module that ships is
  # byte for byte a module the tree's build accepted, and only then packs and signs. It holds the signing identity and runs no code of the library.
  finish:
    needs: [compose, verify]
    if: ${{ !cancelled() && needs.compose.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: { contents: read, id-token: write, attestations: write, actions: read }  # actions: read = the shard artifacts of an earlier run (recut)
    env: { KEY: "${{ inputs.key }}", TOOLCHAIN: "${{ inputs.toolchain }}", DROP: "${{ inputs.drop }}", SCOPE: "${{ inputs.scope }}", PARTS: "${{ inputs.parts }}", FROM_TREE: "${{ inputs.from_tree }}", DUPS: "${{ inputs.dups }}", VERIFIED: "${{ needs.verify.result }}", IMPORTS: "${{ inputs.imports }}" }
    steps:
      - name: This repository (scripts, the library's setup)
        run: |
          git clone -q --filter=blob:none --no-checkout "https://github.com/$GITHUB_REPOSITORY" emissary
          git -C emissary sparse-checkout set --no-cone "/scripts/" "/sources.json" "/data/exports/$KEY/setup.ci.json"
          git -C emissary checkout -q "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: "shard-${{ inputs.key }}-*", path: shards, run-id: "${{ inputs.recut_from || github.run_id }}", github-token: "${{ github.token }}" }
      # RESUME (fill_from): the shards this run did not build come from the earlier run; a shard built here is never replaced by its old copy
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.fill_from != '' }}
        with: { pattern: "shard-${{ inputs.key }}-*", path: shards-fill, run-id: "${{ inputs.fill_from }}", github-token: "${{ github.token }}" }
      - name: Fill in the shards of the earlier run
        if: ${{ inputs.fill_from != '' }}
        run: python3 emissary/scripts/bump/shard_pack.py fill --shards shards --fill shards-fill
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: "draft-${{ inputs.key }}", path: draft }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ needs.verify.result == 'success' }}
        with: { pattern: "treeverify-${{ inputs.key }}-*", path: treeverify }
      # the verdict of every mode that was to be verified, or the run stops: an artifact that lacks its files must never read as "the tree refused nothing" (the first live run of this
      # job, 2026-10-12, found `out/` in front of every path: the list came out empty and only the check below kept the bundle from shipping)
      - name: What the tree refused (the library modules, from every verified mode)
        env: { MODES: "${{ needs.compose.outputs.modes }}" }
        run: |
          cp draft/tree-names.txt draft/tree-decls.txt .
          : > tree-failures.txt
          repair_files=()
          dups_files=()
          for mode in $(python3 -c 'import json, os; print(" ".join(json.loads(os.environ["MODES"])))'); do
            dir="treeverify/treeverify-$KEY-$mode"
            for f in failing.txt ok.json new.json summary.txt repairs.json; do
              [ -f "$dir/$f" ] || { echo "::error::the tree's verdict for mode $mode is incomplete: $dir/$f is missing"; exit 1; }
            done
            cat "$dir/failing.txt" >> tree-failures.txt
            repair_files+=("$dir/repairs.json")
            if [ "$DUPS" = true ]; then
              [ -f "$dir/dups.json" ] || { echo "::error::the tree's verdict for mode $mode has no dups.json"; exit 1; }
              dups_files+=("$dir/dups.json")
            fi
          done
          sort -u -o tree-failures.txt tree-failures.txt
          echo "the tree refused $(wc -l < tree-failures.txt) module(s)"
          # the declarations the tree timed out on that were given room (tree_repair.py): `compose` makes the same edit in the bundle that ships
          if [ "${#repair_files[@]}" -gt 0 ]; then python3 emissary/scripts/bump/tree_repair.py merge --out tree-repairs.json "${repair_files[@]}"; else echo '{"rule": "R2", "modules": {}}' > tree-repairs.json; fi
          # the copies of tree modules the tree's build showed to be the same as the tree's module (tree_dups.py): `compose` leaves them out and points what imports them at the tree's module
          if [ "${#dups_files[@]}" -gt 0 ]; then python3 emissary/scripts/bump/tree_dups.py merge --out tree-dups.json "${dups_files[@]}"; fi
      - name: Merge the shards and cut the bundle
        working-directory: emissary
        run: |
          mkdir -p ../merged ../logs
          python3 scripts/bump/shard_pack.py merge --shards ../shards --out ../merged --logs ../logs
          cat ../logs/gate2-results.json
          keep=(); if [ "$DUPS" = true ] && [ "$VERIFIED" = success ]; then keep=(--keep-dups --tree-dups ../tree-dups.json); fi
          python3 scripts/bump/bundle.py compose --lib ../merged --log ../logs/bundle-deps.log --passed ../logs/passed.json --meta "data/exports/$KEY/setup.ci.json" \
            --key "$KEY" --toolchain "$TOOLCHAIN" --errors ../logs/errors.log --gate2 ../logs/gate2.log --gate2-killed ../logs/gate2-killed.json --out ../bundle --src ../pruned-src --drop-modules "$DROP" \
            --tree-names ../tree-names.txt --tree-decls ../tree-decls.txt --drop-leaks --tree-failures ../tree-failures.txt --tree-repairs ../tree-repairs.json --imports "$IMPORTS" "${keep[@]}"
      - name: Make the registrations that leak into other libraries local (RECUT only)
        if: ${{ inputs.scope != '' }}
        run: python3 emissary/scripts/bump/scope_rewrite.py --bundle bundle --bundle bundle-proposed --bundle bundle-wide --reexport --leaks "$SCOPE"
      # What ships is what the tree built: every new module of the final bundle, in every verified mode, has the bytes the tree's build accepted.
      - name: Every module that ships was built in the tree, byte for byte
        env: { MODES: "${{ needs.compose.outputs.modes }}" }
        run: |
          for mode in $(python3 -c 'import json, os; print(" ".join(json.loads(os.environ["MODES"])))'); do
            dir="treeverify/treeverify-$KEY-$mode"
            d=bundle; [ "$mode" != strict ] && d="bundle-$mode"
            echo "== $mode"; cat "$dir/summary.txt"
            python3 emissary/scripts/bump/tree_verify.py check --bundle "$d" --new "$dir/new.json" --ok "$dir/ok.json"
          done
      - name: Pack and attest
        run: |
          for mode in strict proposed wide; do
            dir=bundle; [ "$mode" != strict ] && dir="bundle-$mode"
            python3 emissary/scripts/bump/bundle_tar.py "$dir" "bundle-$KEY-$mode.tar"
            gzip -n -k "bundle-$KEY-$mode.tar"
            if [ "${PARTS:-0}" != 0 ]; then
              from_tree=""
              if [ "${FROM_TREE:-}" = true ]; then
                # the library is in the tree already (its first parts merged): cut only the modules it does not have, from the next part number
                ns=$(basename "$dir"/Tengoku/*.lean .lean)
                curl -sSfL "https://raw.githubusercontent.com/competemath/tengoku/main/Tengoku/$ns.lean" -o "tree-umbrella-$mode.lean"
                last=$(curl -sS "https://api.github.com/repos/competemath/tengoku/contents/data/intake/$KEY/parts" | python3 -c 'import json, re, sys; d = json.load(sys.stdin); n = [int(m.group(1)) for x in (d if isinstance(d, list) else []) for m in [re.match(r"(\d{3})\.json$", x["name"])] if m]; print(max(n, default=1))')
                from_tree="--tree-umbrella tree-umbrella-$mode.lean --start $((last + 1))"
              fi
              python3 emissary/scripts/bump/bundle_layers.py --bundle "$dir" --out "parts-$mode" --max-modules "$PARTS" --tar $from_tree
              # a mode can have no new module (navier-stokes-euler, 2026-10-18: every module of the strict bundle was in the tree already, 0 parts): the glob then stays as typed and the
              # plan alone is copied, instead of `cp` failing the whole run after the shards, compose and verify had taken five hours
              for t in "parts-$mode"/part-*.tar; do [ -e "$t" ] || continue; cp "$t" "bundle-$KEY-$mode-$(basename "$t")"; done
              cp "parts-$mode/plan.json" "parts-$mode.json"
            fi
          done
          sha256sum bundle-"$KEY"-*.tar | tee bundle.sha256
          cat bundle/report.json bundle-proposed/report.json bundle-wide/report.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: "bundle-${{ inputs.key }}-*.tar" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bump-${{ inputs.key }}
          path: |
            bundle-*.tar
            bundle-*.tar.gz
            parts-*.json
            bundle.sha256
            bundle/report.json
            bundle/manifest.jsonl
            bundle-proposed/report.json
            bundle-proposed/manifest.jsonl
            bundle-wide/report.json
            bundle*.ledger.json
            bundle-wide/manifest.jsonl
            logs/gate2-results.json
            logs/passed.json
          retention-days: 90
