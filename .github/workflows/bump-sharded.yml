# A big library, bumped in shards (plan -> N shards in parallel -> merge into ONE attested intake bundle). Same checks and guarantees as
# bump-library.yml; the difference is only that no single runner builds the whole library. scripts/bump/plan_shards.py cuts it into
# dependency-closed shards (a module goes to the shard that already builds most of what it imports); the merge unions what every shard
# found passed and prunes the library once.
name: bump-sharded
run-name: bump-sharded ${{ inputs.key }}${{ inputs.from_tree == 'true' && ' (from tree)' || '' }}
on:
  workflow_dispatch:
    inputs:
      key: { description: "registered library key", required: true }
      mathlib: { description: "Mathlib tag the Tengoku tree is seeded from", default: "v4.34.0-rc2" }
      toolchain: { description: "the tree's Lean toolchain", default: "leanprover/lean4:v4.34.0-rc2" }
      shards: { description: "number of shards (0 = automatic: as many as it takes for no shard to build more than 250k lines, at most 32)", default: "0" }
      parallel: { description: "shards running at once (the repository has 20 runners; tengoku's own CI waits for them too: leave it room)", default: "6" }
      recut_from: { description: "RECUT: the id of an earlier run of this workflow for this key. No plan, no shards: its shard artifacts are merged again, without the modules in `drop` (and what imports them), and the new bundle is attested by this run", default: "" }
      drop: { description: "RECUT: modules (comma list) that did not build on the tree, from the merge queue's build of the bundle", default: "" }
      scope: { description: "RECUT: the `leak:` lines of the merge queue's leak report (separated by `;`): those registrations are made local (scripts/bump/scope_rewrite.py)", default: "" }
      tengoku_ref: { description: "a branch of competemath/tengoku to read the library's tentative records from (default main), for records whose PR is not merged yet", default: "" }
      parts: { description: "PARTS: cut each bundle into parts of at most this many modules (scripts/bump/bundle_layers.py), each attested as bundle-<key>-<mode>-part-NNN.tar, for a library too big for one intake PR (the queue builds ~3 s a module in 40 minutes: 300). 0 = no parts", default: "0" }
      verify: { description: "build the bundle in the TREE's own environment (the merge queue's own build, on a checkout seeded from the tree's cache) before it is cut into parts: the modules the tree refuses are dropped with their importers, and what ships is proven byte for byte what was built there. `false` skips it", default: "true" }
      verify_partial: { description: "verify: a build that runs out of its time (250 min) still ships the modules it built; the rest are left for the next from-tree round. For a library with more new modules than one runner builds in that time (a first cut of a giant). Default `false`: a build that does not finish fails the run", default: "false" }
      verify_modes: { description: "the bundle modes that are built in the tree (comma list of strict, proposed, wide): the intake opener ships `proposed`; a mode that is not built ships as the factory cut it", default: "proposed" }
      from_tree: { description: "PARTS, on a recut after some parts merged: cut only the modules the tree does not have yet (the library's Tengoku/<Ns>.lean on tengoku main), numbered from the next part, so the new parts extend what merged (scripts/bump/bundle_layers.py --tree-umbrella)", default: "" }
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  plan:
    if: ${{ inputs.recut_from == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: read }
    env: { KEY: "${{ inputs.key }}", SHARDS: "${{ inputs.shards }}", TENGOKU_REF: "${{ inputs.tengoku_ref }}" }
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - name: This repository (scripts, the library's setup) and tengoku's entries for it
        run: |
          git clone -q --filter=blob:none --no-checkout "https://github.com/$GITHUB_REPOSITORY" emissary
          git -C emissary sparse-checkout set --no-cone "/scripts/" "/sources.json" "/data/exports/$KEY/setup.ci.json"
          git -C emissary checkout -q "$GITHUB_SHA"
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku tengoku
          git -C tengoku sparse-checkout set --no-cone "/data/tentative/$KEY.jsonl" "/data/tentative/$KEY/"
          # TENGOKU_REF: a branch of the tree repository that holds the records of a library whose PR is not merged yet (empty: main)
          ref=${TENGOKU_REF:+origin/$TENGOKU_REF}; git -C tengoku checkout -q "${ref:-main}"
      - name: The library, its import graph, the plan
        id: p
        working-directory: emissary
        run: |
          read -r repo commit _ roots < <(python3 scripts/trial-library-build.py meta "$KEY")
          git clone -q --filter=blob:none "$repo" lib && git -C lib checkout -q "$commit"
          # a library whose Lake project is a subdirectory of its repository (sources.json `subdir`): `lib` is that project, a symlink, so that a path dependency (`../concepts`)
          # still resolves next to it in the clone (as bump-library.yml does)
          sub=$(python3 -c "import json, os; print(json.load(open('sources.json'))['sources'][os.environ['KEY']].get('subdir', ''))")
          if [ -n "$sub" ]; then mv lib lib-repo && ln -s "lib-repo/$sub" lib; fi
          python3 - <<'PY'
          import glob, json, math, os, sys
          sys.path.insert(0, "scripts/bump")
          import gate2_batch as g, plan_shards as ps
          from pathlib import Path
          key = os.environ["KEY"]
          roots = [r for r in json.load(open(f"data/exports/{key}/setup.ci.json"))["roots"]]
          ents = g.tentative_entries(sorted(glob.glob(f"../tengoku/data/tentative/{key}.jsonl") + glob.glob(f"../tengoku/data/tentative/{key}/*.jsonl")))
          import tolerant_build as tb
          wanted = {".".join(tb.esc(x) for x in r["sourcePath"][:-5].split("/")) for r in ents.values()}
          imp, weight = ps.graph(Path("lib"), roots)
          wanted &= set(imp)
          k = int(os.environ["SHARDS"] or 0)
          if k <= 0:  # automatic: start from one shard per ~200k lines, then as many as it takes for no shard to build more than ps.MAX_SHARD_LINES (Gate 2 is one lean process: a bigger shard is OOM-killed)
              k, plan = ps.choose_k(imp, weight, wanted, max(1, math.ceil(sum(weight.values()) / 200_000)))
          else:
              plan = ps.plan(imp, weight, k, wanted=wanted)
          os.makedirs("../plan", exist_ok=True)
          json.dump(plan, open("../plan/plan.json", "w"))
          print({kk: v for kk, v in plan.items() if kk != "shards"}, "entries:", len(ents), "modules with entries:", len(wanted))
          shards = [s["shard"] for s in plan["shards"] if s["targets"]]
          out = os.environ["GITHUB_OUTPUT"]
          open(out, "a").write("shards=" + json.dumps(shards) + "\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "plan-${{ inputs.key }}", path: plan, retention-days: 14 }
  shard:
    needs: plan
    if: ${{ inputs.recut_from == '' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix: { shard: "${{ fromJSON(needs.plan.outputs.shards) }}" }
    uses: ./.github/workflows/bump-shard.yml
    with:
      key: ${{ inputs.key }}
      mathlib: ${{ inputs.mathlib }}
      toolchain: ${{ inputs.toolchain }}
      shard: ${{ matrix.shard }}
      tengoku_ref: ${{ inputs.tengoku_ref }}
    permissions: { contents: read }
  # compose: the DRAFT. Merges the shards and cuts the bundle exactly as `finish` will, and hands the draft to `verify` (the tree's own build of it). Nothing is signed here
  # and no code of the library runs: the shards' artifacts are read as data (shard_pack.merge refuses symlinks and `..`).
  compose:
    needs: [plan, shard]
    if: ${{ !cancelled() && (inputs.recut_from != '' || needs.plan.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: { contents: read, actions: read }  # actions: read = the shard artifacts of an earlier run (recut)
    env: { KEY: "${{ inputs.key }}", TOOLCHAIN: "${{ inputs.toolchain }}", DROP: "${{ inputs.drop }}", SCOPE: "${{ inputs.scope }}", VERIFY: "${{ inputs.verify }}", VERIFY_MODES: "${{ inputs.verify_modes }}" }
    outputs:
      modes: ${{ steps.draft.outputs.modes }}
    steps:
      - name: This repository (scripts, the library's setup)
        run: |
          git clone -q --filter=blob:none --no-checkout "https://github.com/$GITHUB_REPOSITORY" emissary
          git -C emissary sparse-checkout set --no-cone "/scripts/" "/sources.json" "/data/exports/$KEY/setup.ci.json"
          git -C emissary checkout -q "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: "shard-${{ inputs.key }}-*", path: shards, run-id: "${{ inputs.recut_from || github.run_id }}", github-token: "${{ github.token }}" }
      - name: The record names the tree already has (tengoku data files, read as text and never run)
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku tengoku
          git -C tengoku sparse-checkout set --no-cone "/data/trusted/" "/data/intake/" "/Tengoku/" "!/Tengoku/Seed/"
          git -C tengoku checkout -q main
          python3 emissary/scripts/bump/tree_names.py --root tengoku --lib "$KEY" --out tree-names.txt --decls-out tree-decls.txt
      - name: Merge the shards and cut the bundle
        working-directory: emissary
        run: |
          mkdir -p ../merged ../logs
          python3 scripts/bump/shard_pack.py merge --shards ../shards --out ../merged --logs ../logs
          cat ../logs/gate2-results.json
          python3 scripts/bump/bundle.py compose --lib ../merged --log ../logs/bundle-deps.log --passed ../logs/passed.json --meta "data/exports/$KEY/setup.ci.json" \
            --key "$KEY" --toolchain "$TOOLCHAIN" --errors ../logs/errors.log --gate2 ../logs/gate2.log --out ../bundle --src ../pruned-src --drop-modules "$DROP" \
            --tree-names ../tree-names.txt --tree-decls ../tree-decls.txt --drop-leaks
      - name: Make the registrations that leak into other libraries local (RECUT only)
        if: ${{ inputs.scope != '' }}
        run: python3 emissary/scripts/bump/scope_rewrite.py --bundle bundle --bundle bundle-proposed --bundle bundle-wide --leaks "$SCOPE"
      # The draft of every mode that is to be verified, as a tar. `verify` builds each in the tree; `finish` cuts the same bundle again from the same shards and the same
      # tree names (they travel with the draft), drops what the tree refused, and proves that what is left is byte for byte what was built.
      - name: The draft, for the tree's build
        id: draft
        run: |
          modes='[]'
          if [ "$VERIFY" != false ]; then
            modes=$(python3 -c 'import json, os, sys; m = [x for x in os.environ["VERIFY_MODES"].replace(",", " ").split()]; bad = [x for x in m if x not in ("strict", "proposed", "wide")]; sys.exit(f"unknown mode(s) {bad}") if bad else print(json.dumps(sorted(set(m))))')
            for mode in $(python3 -c 'import json, sys; print(" ".join(json.loads(sys.argv[1])))' "$modes"); do
              dir=bundle; [ "$mode" != strict ] && dir="bundle-$mode"
              tar -C "$dir" -cf "draft-$mode.tar" .
            done
          fi
          echo "modes=$modes" >> "$GITHUB_OUTPUT"
          echo "verifying in the tree: $modes"
          mkdir -p draft && { mv draft-*.tar draft/ 2>/dev/null || true; } && cp tree-names.txt tree-decls.txt draft/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "draft-${{ inputs.key }}", path: draft, retention-days: 14, if-no-files-found: error }
  # verify: the merge queue's own build, ahead of time, on the whole draft. A checkout of the tree seeded from its attested cache (as the queue seeds it), the draft's new
  # modules copied in, `lake build` of every one of them. The modules that fail (and what imports them) are dropped by `finish`. This job compiles the library's code, so it
  # holds nothing: read-only token, no signing identity, and the one token it ever sees (the cache download) is only in that step's environment.
  verify:
    needs: compose
    if: ${{ !cancelled() && needs.compose.result == 'success' && needs.compose.outputs.modes != '[]' }}
    strategy:
      fail-fast: false
      matrix: { mode: "${{ fromJSON(needs.compose.outputs.modes) }}" }
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions: { contents: read }
    env: { KEY: "${{ inputs.key }}", MODE: "${{ matrix.mode }}", VERIFY_PARTIAL: "${{ inputs.verify_partial }}" }
    steps:
      - name: This repository (scripts)
        run: |
          git clone -q --filter=blob:none --no-checkout "https://github.com/$GITHUB_REPOSITORY" emissary
          git -C emissary sparse-checkout set --no-cone "/scripts/"
          git -C emissary checkout -q "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: "draft-${{ inputs.key }}", path: draft }
      - name: The draft
        run: mkdir bundle && tar --no-same-owner -xf "draft/draft-$MODE.tar" -C bundle
      # the tree's cache is several GB packed and about ten times that unpacked (queue-gate.yml, "Free disk"). The runner has 145 GB, 34 GB of it used before anything runs: the tree's build
      # directory now takes most of the rest, and a runner whose disk fills is LOST, with no log and no error (2026-10-13: the tauceti verify job, the queue's last step for lean-pool part 10 and
      # both nightly cache builds died that way within 12 hours). So: free what the build does not use, and measure (out/disk.log is uploaded with the verdict).
      - name: Free disk (the tree's cache and build are several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/local/graalvm /usr/local/share/chromium || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo swapoff -a >/dev/null 2>&1 || true; sudo rm -f /mnt/swapfile /swapfile || true
          mkdir -p out && { echo "== after freeing"; df -h / | tail -1; } | tee out/disk.log
      # the installer at a fixed commit, checked against its digest before it runs (as bundle-keep-tests.yml does): this job's verdict is what `finish` signs, so what it runs must not be mutable
      - name: Lean toolchain (pinned by the tree's lean-toolchain)
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none && echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -q zstd >/dev/null
      - name: The tree, seeded from the newest published cache (verified), as the merge queue seeds it
        env: { GH_TOKEN: "${{ github.token }}", TENGOKU_VERIFY: require, TENGOKU_TOPUPS: "1" }
        run: |
          git clone -q --filter=blob:none https://github.com/competemath/tengoku tree
          mkdir -p out
          echo "tree: $(git -C tree rev-parse HEAD)" | tee out/tree-sha.txt
          cd tree && scripts/cache.sh get 2>&1 | tail -3
          { echo "== after seeding"; df -h / | tail -1; du -sh .lake/build 2>/dev/null; } | tee -a ../out/disk.log
      - name: Copy the new modules into the tree
        run: python3 emissary/scripts/bump/tree_verify.py apply --bundle bundle --tree tree --out out
      # the queue's own command, for every new module at once. Lake goes on after a module fails and lists them all; a build that is killed leaves a log with no ending,
      # which `collect` refuses (nothing is verified by a log that stops).
      - name: Build them (the queue's own command)
        run: |
          targets="$(tr '\n' ' ' < out/targets.txt)"
          if [ -z "${targets// }" ]; then echo "nothing new to build"; echo "Build completed successfully" > out/build.log; exit 0; fi
          if [ ${#targets} -gt 1500000 ]; then echo "::error::the new modules do not fit one command line; recut from the tree in rounds (from_tree) so that fewer are new"; exit 1; fi
          cd tree
          set +e
          # the disk, every minute: a runner whose disk fills dies without a word, and this is what says so afterwards
          ( while sleep 60; do echo "$(date -u +%H:%M:%S) $(df -h / | tail -1 | awk '{print "used=" $3 " avail=" $4}') mem_avail_kb=$(awk '/MemAvailable/ {print $2}' /proc/meminfo)" >> ../out/disk.log; done ) &
          sampler=$!
          # shellcheck disable=SC2086  # targets is a space-separated module list
          timeout -k 60 250m lake build $targets 2>&1 | tee ../out/build.log
          echo "lake exit status: ${PIPESTATUS[0]}"
          kill "$sampler" 2>/dev/null || true
          { echo "== after the build"; df -h / | tail -1; du -sh .lake/build 2>/dev/null; } >> ../out/disk.log
      - name: What the build accepted
        run: |
          flag=(); if [ "$VERIFY_PARTIAL" = true ]; then flag=(--allow-unfinished); fi
          python3 emissary/scripts/bump/tree_verify.py collect --new out/new.json --log out/build.log --out out --bundle bundle "${flag[@]}"
      # The queue's second step: the axioms of every declaration of what it built (Gate 2 checks theorems only: an instance made by `deriving Repr` on a Finset product
      # rests on `lcProof`, and lean-pool part 10, which compiled, was rejected on it). ModuleAxioms.lean is that check with the module of each offender in its output.
      - name: The axiom check of the queue, on every module that built
        run: |
          if [ -s out/built.txt ]; then
            cd tree
            timeout -k 60 20m lake env lean --run ../emissary/scripts/bump/ModuleAxioms.lean ../out/built.txt 2>&1 | tee ../out/axioms.txt
          else
            echo "axioms: 0 declarations checked, 0 with non-standard axioms" > out/axioms.txt
          fi
      # The queue's last step imports the whole tree at once (`Tengoku.All`): two modules of different libraries that declare the same name stop it, and no module of one library imports another,
      # so nothing above sees it (lean-pool part 10, 2026-10-12: its vendored copy of AddCombi against the tree's AddCombi, "environment already contains"). ModuleClashes.lean reads the names
      # every module declares (no import: an import stops at the first clash) and lists the pairs that share one when one of them is new.
      - name: The names that two modules of the tree both declare (what `import Tengoku.All` stops at)
        run: |
          if [ -s out/built.txt ]; then
            cd tree
            timeout -k 60 30m lake env lean --run ../emissary/scripts/bump/ModuleClashes.lean .lake/build/lib/lean ../out/built.txt Tengoku 2>&1 | tee ../out/clashes.txt
          else
            echo "clashes: 0 module pair(s), 0 name(s)" > out/clashes.txt
          fi
      - name: What the tree accepted
        run: |
          flag=(); if [ "$VERIFY_PARTIAL" = true ]; then flag=(--allow-unfinished); fi
          python3 emissary/scripts/bump/tree_verify.py collect --new out/new.json --log out/build.log --out out --bundle bundle --axioms out/axioms.txt --clashes out/clashes.txt "${flag[@]}"
          { echo "### Tree build ($KEY, $MODE)"; cat out/summary.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the log
        if: ${{ always() }}
        run: gzip -n out/build.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: treeverify-${{ inputs.key }}-${{ matrix.mode }}
          path: |
            out/new.json
            out/ok.json
            out/failing.txt
            out/summary.txt
            out/axioms.txt
            out/clashes.txt
            out/disk.log
            out/build.log.gz
            out/tree-sha.txt
          retention-days: 14
          if-no-files-found: ignore
  # finish: cuts the bundle again from the same shards and the same tree names, drops what the tree refused (and what imports it), proves that every module that ships is
  # byte for byte a module the tree's build accepted, and only then packs and signs. It holds the signing identity and runs no code of the library.
  finish:
    needs: [compose, verify]
    if: ${{ !cancelled() && needs.compose.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: { contents: read, id-token: write, attestations: write, actions: read }  # actions: read = the shard artifacts of an earlier run (recut)
    env: { KEY: "${{ inputs.key }}", TOOLCHAIN: "${{ inputs.toolchain }}", DROP: "${{ inputs.drop }}", SCOPE: "${{ inputs.scope }}", PARTS: "${{ inputs.parts }}", FROM_TREE: "${{ inputs.from_tree }}" }
    steps:
      - name: This repository (scripts, the library's setup)
        run: |
          git clone -q --filter=blob:none --no-checkout "https://github.com/$GITHUB_REPOSITORY" emissary
          git -C emissary sparse-checkout set --no-cone "/scripts/" "/sources.json" "/data/exports/$KEY/setup.ci.json"
          git -C emissary checkout -q "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: "shard-${{ inputs.key }}-*", path: shards, run-id: "${{ inputs.recut_from || github.run_id }}", github-token: "${{ github.token }}" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: "draft-${{ inputs.key }}", path: draft }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ needs.verify.result == 'success' }}
        with: { pattern: "treeverify-${{ inputs.key }}-*", path: treeverify }
      # the verdict of every mode that was to be verified, or the run stops: an artifact that lacks its files must never read as "the tree refused nothing" (the first live run of this
      # job, 2026-10-12, found `out/` in front of every path: the list came out empty and only the check below kept the bundle from shipping)
      - name: What the tree refused (the library modules, from every verified mode)
        env: { MODES: "${{ needs.compose.outputs.modes }}" }
        run: |
          cp draft/tree-names.txt draft/tree-decls.txt .
          : > tree-failures.txt
          for mode in $(python3 -c 'import json, os; print(" ".join(json.loads(os.environ["MODES"])))'); do
            dir="treeverify/treeverify-$KEY-$mode"
            for f in failing.txt ok.json new.json summary.txt; do
              [ -f "$dir/$f" ] || { echo "::error::the tree's verdict for mode $mode is incomplete: $dir/$f is missing"; exit 1; }
            done
            cat "$dir/failing.txt" >> tree-failures.txt
          done
          sort -u -o tree-failures.txt tree-failures.txt
          echo "the tree refused $(wc -l < tree-failures.txt) module(s)"
      - name: Merge the shards and cut the bundle
        working-directory: emissary
        run: |
          mkdir -p ../merged ../logs
          python3 scripts/bump/shard_pack.py merge --shards ../shards --out ../merged --logs ../logs
          cat ../logs/gate2-results.json
          python3 scripts/bump/bundle.py compose --lib ../merged --log ../logs/bundle-deps.log --passed ../logs/passed.json --meta "data/exports/$KEY/setup.ci.json" \
            --key "$KEY" --toolchain "$TOOLCHAIN" --errors ../logs/errors.log --gate2 ../logs/gate2.log --out ../bundle --src ../pruned-src --drop-modules "$DROP" \
            --tree-names ../tree-names.txt --tree-decls ../tree-decls.txt --drop-leaks --tree-failures ../tree-failures.txt
      - name: Make the registrations that leak into other libraries local (RECUT only)
        if: ${{ inputs.scope != '' }}
        run: python3 emissary/scripts/bump/scope_rewrite.py --bundle bundle --bundle bundle-proposed --bundle bundle-wide --leaks "$SCOPE"
      # What ships is what the tree built: every new module of the final bundle, in every verified mode, has the bytes the tree's build accepted.
      - name: Every module that ships was built in the tree, byte for byte
        env: { MODES: "${{ needs.compose.outputs.modes }}" }
        run: |
          for mode in $(python3 -c 'import json, os; print(" ".join(json.loads(os.environ["MODES"])))'); do
            dir="treeverify/treeverify-$KEY-$mode"
            d=bundle; [ "$mode" != strict ] && d="bundle-$mode"
            echo "== $mode"; cat "$dir/summary.txt"
            python3 emissary/scripts/bump/tree_verify.py check --bundle "$d" --new "$dir/new.json" --ok "$dir/ok.json"
          done
      - name: Pack and attest
        run: |
          for mode in strict proposed wide; do
            dir=bundle; [ "$mode" != strict ] && dir="bundle-$mode"
            python3 emissary/scripts/bump/bundle_tar.py "$dir" "bundle-$KEY-$mode.tar"
            gzip -n -k "bundle-$KEY-$mode.tar"
            if [ "${PARTS:-0}" != 0 ]; then
              from_tree=""
              if [ "${FROM_TREE:-}" = true ]; then
                # the library is in the tree already (its first parts merged): cut only the modules it does not have, from the next part number
                ns=$(basename "$dir"/Tengoku/*.lean .lean)
                curl -sSfL "https://raw.githubusercontent.com/competemath/tengoku/main/Tengoku/$ns.lean" -o "tree-umbrella-$mode.lean"
                last=$(curl -sS "https://api.github.com/repos/competemath/tengoku/contents/data/intake/$KEY/parts" | python3 -c 'import json, re, sys; d = json.load(sys.stdin); n = [int(m.group(1)) for x in (d if isinstance(d, list) else []) for m in [re.match(r"(\d{3})\.json$", x["name"])] if m]; print(max(n, default=1))')
                from_tree="--tree-umbrella tree-umbrella-$mode.lean --start $((last + 1))"
              fi
              python3 emissary/scripts/bump/bundle_layers.py --bundle "$dir" --out "parts-$mode" --max-modules "$PARTS" --tar $from_tree
              for t in "parts-$mode"/part-*.tar; do cp "$t" "bundle-$KEY-$mode-$(basename "$t")"; done
              cp "parts-$mode/plan.json" "parts-$mode.json"
            fi
          done
          sha256sum bundle-"$KEY"-*.tar | tee bundle.sha256
          cat bundle/report.json bundle-proposed/report.json bundle-wide/report.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: "bundle-${{ inputs.key }}-*.tar" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bump-${{ inputs.key }}
          path: |
            bundle-*.tar
            bundle-*.tar.gz
            parts-*.json
            bundle.sha256
            bundle/report.json
            bundle/manifest.jsonl
            bundle-proposed/report.json
            bundle-proposed/manifest.jsonl
            bundle-wide/report.json
            bundle*.ledger.json
            bundle-wide/manifest.jsonl
            logs/gate2-results.json
            logs/passed.json
          retention-days: 90
