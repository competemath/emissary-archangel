name: bump-waves
run-name: bump-waves ${{ inputs.key }}
# A build-once: a library too big to rebuild in every shard (flt-anthropic: 60,474 modules, 13.5M lines) is built once, wave after wave. scripts/bump/build_waves.py cuts the import graph into bands of
# connected pieces; each job builds its own modules on top of what earlier jobs handed on (scripts/bump/wave_pack.py) and judges them with Gate 2 like any shard (bump-shard.yml, build_once). When every
# wave has passed, bump-sharded.yml is started on this run's shards (recut_from): compose, the tree's own build, signing and parts are the same as for any bump.
# This file is a chain of the same job 32 times: a job's `needs` is the wave before it, and tests/test_wave_workflow.py holds them identical.
on:
  workflow_dispatch:
    inputs:
      key: { description: "registered library key", required: true }
      mathlib: { description: "Mathlib tag the Tengoku tree is seeded from", default: "v4.34.0-rc2" }
      toolchain: { description: "the tree's Lean toolchain", default: "leanprover/lean4:v4.34.0-rc2" }
      from_tree: { description: "true for a library with parts in the tree already: only the modules the tree does not have are cut, numbered from the next part (bump-sharded.yml from_tree)", default: "false" }
      budget_lines: { description: "lines of Lean one job builds (132000: about 2 hours at the measured 1,100 lines a minute)", default: "132000" }
      runners: { description: "runners a wave may use at most: the plan's bands are cut to this", default: "17" }
      parallel: { description: "jobs running at once", default: "17" }
      tengoku_ref: { description: "a branch of competemath/tengoku to read the records from (default main)", default: "" }
      imports: { description: "faithful: the library keeps the imports its authors wrote, as every bump is dispatched now (bump-sharded.yml's own default is older and is full)", default: "faithful" }
      gate2_budget_min: { description: "as in bump-sharded.yml", default: "150" }
      gate2_rss_share: { description: "as in bump-sharded.yml", default: "0.80" }
      swap_gb: { description: "GB of swap every job adds", default: "48" }
      build_timeout_min: { description: "minutes one module may take to build", default: "170" }
      reuse_from: { description: "RESUME: an earlier bump-waves run of this key whose plan this run takes; every job that finished there is kept, the others run here (scripts/bump/lane_reuse.py). The settings above must be the ones it ran with", default: "" }
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions: { contents: read, actions: read }  # actions: read = a reuse_from run's plan, jobs and artifacts
    env: { KEY: "${{ inputs.key }}", TENGOKU_REF: "${{ inputs.tengoku_ref }}", BUDGET: "${{ inputs.budget_lines }}", RUNNERS: "${{ inputs.runners }}", FROM_TREE: "${{ inputs.from_tree }}", REUSE_FROM: "${{ inputs.reuse_from }}" }
    outputs:
      w0: ${{ steps.p.outputs.w0 || steps.r.outputs.w0 }}
      w1: ${{ steps.p.outputs.w1 || steps.r.outputs.w1 }}
      w2: ${{ steps.p.outputs.w2 || steps.r.outputs.w2 }}
      w3: ${{ steps.p.outputs.w3 || steps.r.outputs.w3 }}
      w4: ${{ steps.p.outputs.w4 || steps.r.outputs.w4 }}
      w5: ${{ steps.p.outputs.w5 || steps.r.outputs.w5 }}
      w6: ${{ steps.p.outputs.w6 || steps.r.outputs.w6 }}
      w7: ${{ steps.p.outputs.w7 || steps.r.outputs.w7 }}
      w8: ${{ steps.p.outputs.w8 || steps.r.outputs.w8 }}
      w9: ${{ steps.p.outputs.w9 || steps.r.outputs.w9 }}
      w10: ${{ steps.p.outputs.w10 || steps.r.outputs.w10 }}
      w11: ${{ steps.p.outputs.w11 || steps.r.outputs.w11 }}
      w12: ${{ steps.p.outputs.w12 || steps.r.outputs.w12 }}
      w13: ${{ steps.p.outputs.w13 || steps.r.outputs.w13 }}
      w14: ${{ steps.p.outputs.w14 || steps.r.outputs.w14 }}
      w15: ${{ steps.p.outputs.w15 || steps.r.outputs.w15 }}
      w16: ${{ steps.p.outputs.w16 || steps.r.outputs.w16 }}
      w17: ${{ steps.p.outputs.w17 || steps.r.outputs.w17 }}
      w18: ${{ steps.p.outputs.w18 || steps.r.outputs.w18 }}
      w19: ${{ steps.p.outputs.w19 || steps.r.outputs.w19 }}
      w20: ${{ steps.p.outputs.w20 || steps.r.outputs.w20 }}
      w21: ${{ steps.p.outputs.w21 || steps.r.outputs.w21 }}
      w22: ${{ steps.p.outputs.w22 || steps.r.outputs.w22 }}
      w23: ${{ steps.p.outputs.w23 || steps.r.outputs.w23 }}
      w24: ${{ steps.p.outputs.w24 || steps.r.outputs.w24 }}
      w25: ${{ steps.p.outputs.w25 || steps.r.outputs.w25 }}
      w26: ${{ steps.p.outputs.w26 || steps.r.outputs.w26 }}
      w27: ${{ steps.p.outputs.w27 || steps.r.outputs.w27 }}
      w28: ${{ steps.p.outputs.w28 || steps.r.outputs.w28 }}
      w29: ${{ steps.p.outputs.w29 || steps.r.outputs.w29 }}
      w30: ${{ steps.p.outputs.w30 || steps.r.outputs.w30 }}
      w31: ${{ steps.p.outputs.w31 || steps.r.outputs.w31 }}
      packs: ${{ steps.r.outputs.packs }}
      fill: ${{ steps.r.outputs.fill }}
    steps:
      - name: This repository (scripts, the library's setup) and tengoku's entries for it
        run: |
          [[ "$KEY" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::the key is not a source key"; exit 1; }
          [[ "$BUDGET" =~ ^[1-9][0-9]{3,7}$ && "$RUNNERS" =~ ^[1-9][0-9]?$ ]] || { echo "::error::budget_lines and runners are numbers"; exit 1; }
          [[ "$FROM_TREE" =~ ^(true|false)$ ]] || { echo "::error::from_tree is true or false"; exit 1; }
          git clone -q --filter=blob:none --no-checkout "https://github.com/$GITHUB_REPOSITORY" emissary
          git -C emissary sparse-checkout set --no-cone "/scripts/" "/gate2/" "/sources.json" "/data/exports/$KEY/setup.ci.json"
          git -C emissary checkout -q "$GITHUB_SHA"
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku tengoku
          git -C tengoku sparse-checkout set --no-cone $(python3 emissary/scripts/bump/tentative_files.py sparse emissary/sources.json "$KEY")
          ref=${TENGOKU_REF:+origin/$TENGOKU_REF}; git -C tengoku checkout -q "${ref:-main}"
      - name: A library in the tree is cut from the tree (from_tree=true), or the run stops here
        if: ${{ inputs.reuse_from == '' }}
        working-directory: emissary
        run: git -C ../tengoku ls-tree -r --name-only main -- "data/intake/$KEY" | python3 scripts/bump/in_tree.py --key "$KEY" --from-tree "$FROM_TREE" --parts 300
      - name: The library, its import graph, the plan
        id: p
        if: ${{ inputs.reuse_from == '' }}
        working-directory: emissary
        run: |
          read -r repo commit _ roots < <(python3 scripts/trial-library-build.py meta "$KEY")
          git clone -q --filter=blob:none "$repo" lib && git -C lib checkout -q "$commit"
          sub=$(python3 -c "import json, os; print(json.load(open('sources.json'))['sources'][os.environ['KEY']].get('subdir', ''))")
          if [ -n "$sub" ]; then mv lib lib-repo && ln -s "lib-repo/$sub" lib; fi
          python3 scripts/bump/link_srcdir.py "$KEY" lib
          python3 scripts/bump/plan_waves.py "$KEY" lib --tengoku ../tengoku --budget-lines "$BUDGET" --runners "$RUNNERS" --out ../plan
      # RESUME: the earlier run's plan as it is (the same shards, so its packs fit), and the jobs it finished (scripts/bump/lane_reuse.py). flt-anthropic, 11 Nov 2026: run
      # 42678283150 lost job 62's pack at its time limit and 42 of the 55 jobs after it built on it; the new run keeps the 62 jobs that finished and runs 49.
      - name: RESUME - the earlier run's plan, and which of its jobs this run keeps
        id: r
        if: ${{ inputs.reuse_from != '' }}
        working-directory: emissary
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          [[ "$REUSE_FROM" =~ ^[1-9][0-9]{0,14}$ ]] || { echo "::error::reuse_from is a run id"; exit 1; }
          gh run download "$REUSE_FROM" -R "$GITHUB_REPOSITORY" -n "plan-$KEY" -D ../plan
          # A RESUME OF A RESUME: the run reuse_from resumed, and the one that one resumed, back to the run that started from wave 0 (lane_reuse.py chain_view). flt-anthropic,
          # 11 Nov 2026: the resume 43075875630 of 42678283150 lost job 43 to a GitHub outage, and the 63 jobs it kept live in 42678283150.
          # The jobs API answered 502 to 100-job pages of these runs that evening: pages of 30, each call tried again.
          # each try's output is kept apart and printed only when the try succeeds: a failed page (gh prints a 502's body to stdout) or a half-done --paginate
          # must not stay in front of the next try's whole output (cubic, #178); a download goes into a directory emptied before each try
          retry() { local i out; for i in 1 2 3 4 5; do if out=$("$@"); then [ -z "$out" ] || printf '%s\n' "$out"; return 0; fi; sleep $((i * 20)); done; return 1; }
          retry_into() { local dir=$1 i; shift; for i in 1 2 3 4 5; do rm -rf "$dir"; "$@" && return 0; sleep $((i * 20)); done; return 1; }
          now_lib=$(python3 scripts/bump/lane_reuse.py library --setup "data/exports/$KEY/setup.ci.json" --sources sources.json --key "$KEY")
          chain=(); run="$REUSE_FROM"
          while [ -n "$run" ]; do
            [[ "$run" =~ ^[1-9][0-9]{0,14}$ ]] || { echo "::error::an earlier run of the chain is not a run id: $run"; exit 1; }
            [ "${#chain[@]}" -lt 8 ] || { echo "::error::more than 8 runs in the chain of reuse_from"; exit 1; }
            for c in "${chain[@]}"; do [ "$c" != "$run" ] || { echo "::error::the chain of reuse_from loops at $run"; exit 1; }; done
            # a run of this lane for this key, dispatched on main of this repository: no other run's artifacts may be taken (hacktron, #178)
            what=$(retry gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.path + " | " + .display_title + " | " + .head_branch + " | " + .event + " | " + .head_repository.full_name')
            [ "$what" = ".github/workflows/bump-waves.yml | bump-waves $KEY | main | workflow_dispatch | $GITHUB_REPOSITORY" ] || { echo "::error::$run (the chain of reuse_from) is not a bump-waves run of $KEY dispatched on main of $GITHUB_REPOSITORY ($what)"; exit 1; }
            d="../reuse/$run"; mkdir -p "$d"
            # the run built THIS library (repo, commit, roots, subdir as its own commit of this repository recorded them): the plan and the settings can match across
            # two commits of the library, and a pack or shard of another commit must not reach this bundle (hacktron, #178)
            head=$(retry gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)
            [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::run $run has no head commit"; exit 1; }
            retry gh api "repos/$GITHUB_REPOSITORY/contents/data/exports/$KEY/setup.ci.json?ref=$head" --jq .content | base64 -d > "$d/setup.ci.json"
            retry gh api "repos/$GITHUB_REPOSITORY/contents/sources.json?ref=$head" --jq .content | base64 -d > "$d/sources.json"
            then_lib=$(python3 scripts/bump/lane_reuse.py library --setup "$d/setup.ci.json" --sources "$d/sources.json" --key "$KEY")
            [ "$then_lib" = "$now_lib" ] || { echo "::error::run $run built another library ($then_lib) than this run ($now_lib)"; exit 1; }
            if [ "$run" = "$REUSE_FROM" ]; then cp -r ../plan "$d/plan"; else
              retry_into "$d/plan" gh run download "$run" -R "$GITHUB_REPOSITORY" -n "plan-$KEY" -D "$d/plan"
              # every run of the chain planned these shards and built them with these settings (each resume checked it against the run before it, but not a run started by hand)
              cmp "$d/plan/plan.json" ../plan/plan.json || { echo "::error::run $run of the chain planned other shards"; exit 1; }
              cmp "$d/plan/inputs.json" ../plan/inputs.json || { echo "::error::run $run of the chain was built with other settings"; exit 1; }
            fi
            retry gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=30&filter=latest" \
              --jq '.jobs[] | {name, conclusion, pack_step: ([.steps[] | select(.name | startswith("This job'"'"'s work, for the jobs after it")) | .conclusion][0])}' > "$d/jobs.lines"
            jq -s . "$d/jobs.lines" > "$d/jobs.json"
            retry gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" --jq '.artifacts[] | select(.expired | not) | .name' > "$d/artifacts.lines"
            jq -R . "$d/artifacts.lines" | jq -s . > "$d/artifacts.json"
            plan_job=$(jq -r 'map(select(.name == "plan")) | length' "$d/jobs.json")
            [ "$plan_job" = 1 ] || { echo "::error::run $run has no plan job"; exit 1; }
            plan_job=$(retry gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=30&filter=latest" --jq '.jobs[] | select(.name == "plan") | .id')
            # from_tree and reuse_from of a run from before plan/lane.json said them (lane_reuse.py). curl, not `gh api`: a log holds terminal colour codes and gh refuses to
            # write it ("the response contains terminal escape sequences"; run 43066356910, 11 Nov 2026, stopped on an empty log)
            curl -sSfL --retry 5 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$plan_job/logs" -o "$d/plan.log" || true
            chain+=("$run")
            run=$(python3 scripts/bump/lane_reuse.py earlier --plan-log "$d/plan.log" --lane "$d/plan/lane.json")
          done
          python3 scripts/bump/lane_reuse.py --plan ../plan/plan.json --chain "$(IFS=,; echo "${chain[*]}")" --reuse-dir ../reuse --key "$KEY" \
            --from-tree "$FROM_TREE" --lane ../plan/lane.json --plan-log "../reuse/$REUSE_FROM/plan.log" >> "$GITHUB_OUTPUT"
      - name: What the shards are built with
        working-directory: emissary
        env: { MATHLIB: "${{ inputs.mathlib }}", TOOLCHAIN: "${{ inputs.toolchain }}", IMPORTS: "${{ inputs.imports }}", SWAP_GB: "${{ inputs.swap_gb }}", BUILD_TIMEOUT_MIN: "${{ inputs.build_timeout_min }}" }
        run: |
          if [ -z "$REUSE_FROM" ]; then
            python3 scripts/bump/plan_inputs.py ../plan/inputs.json
            printf '{"from_tree": "%s"}\n' "$FROM_TREE" > ../plan/lane.json  # a later run that reuses this one numbers its parts the same way (lane_reuse.py)
            exit 0
          fi
          # a later resume of this one walks back through it to the run it resumed (lane_reuse.py earlier_of)
          python3 -c 'import json, sys; p = "../plan/lane.json"; d = {"from_tree": sys.argv[1], "reuse_from": sys.argv[2]}; open(p, "w").write(json.dumps(d) + "\n")' "$FROM_TREE" "$REUSE_FROM"
          # a resumed run builds with the settings the earlier run built with: its packs and shards are mixed with this run's (the bundle refuses a mix too, bump-sharded.yml)
          python3 scripts/bump/plan_inputs.py ../this-run-inputs.json
          cmp ../plan/inputs.json ../this-run-inputs.json || { echo "::error::reuse_from ran with other settings (mathlib, toolchain, imports, tengoku_ref, swap_gb, build_timeout_min)"; diff ../plan/inputs.json ../this-run-inputs.json || true; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "plan-${{ inputs.key }}", path: plan, retention-days: 14 }
  w0:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.w0 != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix: { shard: "${{ fromJSON(needs.plan.outputs.w0) }}" }
    uses: ./.github/workflows/bump-shard.yml
    with:
      key: ${{ inputs.key }}
      mathlib: ${{ inputs.mathlib }}
      toolchain: ${{ inputs.toolchain }}
      shard: ${{ matrix.shard }}
      tengoku_ref: ${{ inputs.tengoku_ref }}
      imports: ${{ inputs.imports }}
      gate2_budget_min: ${{ inputs.gate2_budget_min }}
      gate2_rss_share: ${{ inputs.gate2_rss_share }}
      swap_gb: ${{ inputs.swap_gb }}
      build_timeout_min: ${{ inputs.build_timeout_min }}
      build_once: "true"
      reuse_run: ${{ inputs.reuse_from }}
      reuse_packs: ${{ needs.plan.outputs.packs }}
    permissions: { contents: read, actions: read }
  w1:
    needs: [plan, w0]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.w1 != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix: { shard: "${{ fromJSON(needs.plan.outputs.w1) }}" }
    uses: ./.github/workflows/bump-shard.yml
    with:
      key: ${{ inputs.key }}
      mathlib: ${{ inputs.mathlib }}
      toolchain: ${{ inputs.toolchain }}
      shard: ${{ matrix.shard }}
      tengoku_ref: ${{ inputs.tengoku_ref }}
      imports: ${{ inputs.imports }}
      gate2_budget_min: ${{ inputs.gate2_budget_min }}
      gate2_rss_share: ${{ inputs.gate2_rss_share }}
      swap_gb: ${{ inputs.swap_gb }}
      build_timeout_min: ${{ inputs.build_timeout_min }}
      build_once: "true"
      reuse_run: ${{ inputs.reuse_from }}
      reuse_packs: ${{ needs.plan.outputs.packs }}
    permissions: { contents: read, actions: read }
  w2:
    needs: [plan, w1]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.w2 != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix: { shard: "${{ fromJSON(needs.plan.outputs.w2) }}" }
    uses: ./.github/workflows/bump-shard.yml
    with:
      key: ${{ inputs.key }}
      mathlib: ${{ inputs.mathlib }}
      toolchain: ${{ inputs.toolchain }}
      shard: ${{ matrix.shard }}
      tengoku_ref: ${{ inputs.tengoku_ref }}
      imports: ${{ inputs.imports }}
      gate2_budget_min: ${{ inputs.gate2_budget_min }}
      gate2_rss_share: ${{ inputs.gate2_rss_share }}
      swap_gb: ${{ inputs.swap_gb }}
      build_timeout_min: ${{ inputs.build_timeout_min }}
      build_once: "true"
      reuse_run: ${{ inputs.reuse_from }}
      reuse_packs: ${{ needs.plan.outputs.packs }}
    permissions: { contents: read, actions: read }
  w3:
    needs: [plan, w2]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.w3 != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix: { shard: "${{ fromJSON(needs.plan.outputs.w3) }}" }
    uses: ./.github/workflows/bump-shard.yml
    with:
      key: ${{ inputs.key }}
      mathlib: ${{ inputs.mathlib }}
      toolchain: ${{ inputs.toolchain }}
      shard: ${{ matrix.shard }}
      tengoku_ref: ${{ inputs.tengoku_ref }}
      imports: ${{ inputs.imports }}
      gate2_budget_min: ${{ inputs.gate2_budget_min }}
      gate2_rss_share: ${{ inputs.gate2_rss_share }}
      swap_gb: ${{ inputs.swap_gb }}
      build_timeout_min: ${{ inputs.build_timeout_min }}
      build_once: "true"
      reuse_run: ${{ inputs.reuse_from }}
      reuse_packs: ${{ needs.plan.outputs.packs }}
    permissions: { contents: read, actions: read }
  w4:
    needs: [plan, w3]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.w4 != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix: { shard: "${{ fromJSON(needs.plan.outputs.w4) }}" }
    uses: ./.github/workflows/bump-shard.yml
    with:
      key: ${{ inputs.key }}
      mathlib: ${{ inputs.mathlib }}
      toolchain: ${{ inputs.toolchain }}
      shard: ${{ matrix.shard }}
      tengoku_ref: ${{ inputs.tengoku_ref }}
      imports: ${{ inputs.imports }}
      gate2_budget_min: ${{ inputs.gate2_budget_min }}
      gate2_rss_share: ${{ inputs.gate2_rss_share }}
      swap_gb: ${{ inputs.swap_gb }}
      build_timeout_min: ${{ inputs.build_timeout_min }}
      build_once: "true"
      reuse_run: ${{ inputs.reuse_from }}
      reuse_packs: ${{ needs.plan.outputs.packs }}
    permissions: { contents: read, actions: read }
  w5:
    needs: [plan, w4]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.w5 != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix: { shard: "${{ fromJSON(needs.plan.outputs.w5) }}" }
    uses: ./.github/workflows/bump-shard.yml
    with:
      key: ${{ inputs.key }}
      mathlib: ${{ inputs.mathlib }}
      toolchain: ${{ inputs.toolchain }}
      shard: ${{ matrix.shard }}
      tengoku_ref: ${{ inputs.tengoku_ref }}
      imports: ${{ inputs.imports }}
      gate2_budget_min: ${{ inputs.gate2_budget_min }}
      gate2_rss_share: ${{ inputs.gate2_rss_share }}
      swap_gb: ${{ inputs.swap_gb }}
      build_timeout_min: ${{ inputs.build_timeout_min }}
      build_once: "true"
      reuse_run: ${{ inputs.reuse_from }}
      reuse_packs: ${{ needs.plan.outputs.packs }}
    permissions: { contents: read, actions: read }
  w6:
    needs: [plan, w5]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.w6 != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix: { shard: "${{ fromJSON(needs.plan.outputs.w6) }}" }
    uses: ./.github/workflows/bump-shard.yml
    with:
      key: ${{ inputs.key }}
      mathlib: ${{ inputs.mathlib }}
      toolchain: ${{ inputs.toolchain }}
      shard: ${{ matrix.shard }}
      tengoku_ref: ${{ inputs.tengoku_ref }}
      imports: ${{ inputs.imports }}
      gate2_budget_min: ${{ inputs.gate2_budget_min }}
      gate2_rss_share: ${{ inputs.gate2_rss_share }}
      swap_gb: ${{ inputs.swap_gb }}
      build_timeout_min: ${{ inputs.build_timeout_min }}
      build_once: "true"
      reuse_run: ${{ inputs.reuse_from }}
      reuse_packs: ${{ needs.plan.outputs.packs }}
    permissions: { contents: read, actions: read }
  w7:
    needs: [plan, w6]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.w7 != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix: { shard: "${{ fromJSON(needs.plan.outputs.w7) }}" }
    uses: ./.github/workflows/bump-shard.yml
    with:
      key: ${{ inputs.key }}
      mathlib: ${{ inputs.mathlib }}
      toolchain: ${{ inputs.toolchain }}
      shard: ${{ matrix.shard }}
      tengoku_ref: ${{ inputs.tengoku_ref }}
      imports: ${{ inputs.imports }}
      gate2_budget_min: ${{ inputs.gate2_budget_min }}
      gate2_rss_share: ${{ inputs.gate2_rss_share }}
      swap_gb: ${{ inputs.swap_gb }}
      build_timeout_min: ${{ inputs.build_timeout_min }}
      build_once: "true"
      reuse_run: ${{ inputs.reuse_from }}
      reuse_packs: ${{ needs.plan.outputs.packs }}
    permissions: { contents: read, actions: read }
  w8:
    needs: [plan, w7]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.w8 != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix: { shard: "${{ fromJSON(needs.plan.outputs.w8) }}" }
    uses: ./.github/workflows/bump-shard.yml
    with:
      key: ${{ inputs.key }}
      mathlib: ${{ inputs.mathlib }}
