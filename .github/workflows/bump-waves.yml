    needs: [plan, w0, w1, w2, w3, w4, w5, w6, w7, w8, w9, w10, w11, w12, w13, w14, w15, w16, w17, w18, w19, w20, w21, w22, w23, w24, w25, w26, w27, w28, w29, w30, w31]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/main' && github.repository == 'competemath/emissary-archangel' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: { actions: write }  # dispatch bump-sharded
    env: { GH_TOKEN: "${{ github.token }}", KEY: "${{ inputs.key }}", MATHLIB: "${{ inputs.mathlib }}", TOOLCHAIN: "${{ inputs.toolchain }}", IMPORTS: "${{ inputs.imports }}", TENGOKU_REF: "${{ inputs.tengoku_ref }}", FROM_TREE: "${{ inputs.from_tree }}", REUSE_FROM: "${{ inputs.reuse_from }}", FILL: "${{ needs.plan.outputs.fill }}" }
    steps:
      - name: Start the bundle
        run: |
          # a resumed run holds the shards it ran; the ones it kept are the earlier run's (fill_from: bump-sharded.yml checks the plans and settings are the same)
          # a resume of a resume: every run of the chain, newest first (lane_reuse.py `fill`; bump-sharded.yml fill_from reads each)
          fill=(); [ -z "$REUSE_FROM" ] || fill=(-f fill_from="$FILL")
          gh workflow run bump-sharded.yml -R "$GITHUB_REPOSITORY" --ref main -f key="$KEY" -f mathlib="$MATHLIB" -f toolchain="$TOOLCHAIN" -f imports="$IMPORTS" -f tengoku_ref="$TENGOKU_REF" \
            -f recut_from="$GITHUB_RUN_ID" -f from_tree="$FROM_TREE" -f parts=300 -f verify=true -f verify_partial=true -f verify_modes=proposed "${fill[@]}"
