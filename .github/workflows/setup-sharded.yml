name: setup-sharded
# One library too big for one 6-hour job (flt-anthropic, lean-pool, tauceti, navier-stokes-euler), split across
# runners. The prime job builds what fits in its time budget (lake builds the modules in name order, and their
# imports first, so the shared modules land here) and hands the build to the shards as an artifact. Each shard
# restores it, builds the rest of its slice (a stable hash of the module name picks it), runs closures, notation
# expansion and lean4export for that slice with scripts/setup-source.mjs --phase shard, and hands what it produced
# to the finish job as an artifact. The shards run the library's own Lean code, so they only read: their token can
# write nothing and is never stored in a checkout. The finish job, which runs no Lean, commits every shard's
# exports. Every stage skips outputs that are already committed, so a shard that runs out of time loses nothing:
# the finish job writes setup.ci.json once every module is exported or recorded as failed, and otherwise
# dispatches the next round, which resumes from this round's build (at most `max_rounds`).
on:
  workflow_dispatch:
    inputs:
      key:
        description: "One source key from sources.json."
        required: true
      shards:
        description: "Runners that split the per-module work (at most 16 run at once)."
        required: false
        default: "16"
      prime_minutes:
        description: "Time budget of the prime build, in minutes."
        required: false
        default: "120"
      expand_chunk:
        description: "Modules per notation-expansion process (EMISSARY_EXPAND_CHUNK); raise it for many tiny modules."
        required: false
        default: "1"
      round:
        description: "internal: which round this is"
        required: false
        default: "1"
      max_rounds:
        description: "Rounds before the workflow stops dispatching itself."
        required: false
        default: "4"
      resume_run:
        description: "internal: the run whose prime build this round resumes"
        required: false
        default: ""

permissions: {}

concurrency:
  group: setup-sharded-${{ inputs.key }}
  cancel-in-progress: false

env:
  KEY: ${{ inputs.key }}
  SHARDS: ${{ inputs.shards }}
  LEAN_NUM_THREADS: "4"
  EMISSARY_LEAN_MB: "12288"
  EMISSARY_EXPAND_CHUNK: ${{ inputs.expand_chunk }}
  EMISSARY_TENTATIVE_DIR: ${{ github.workspace }}/tengoku/data/tentative

jobs:
  prime:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions: { contents: read, actions: read }
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Free disk (a Mathlib cache plus a library build need ~20 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { filter: "blob:none", sparse-checkout: "scripts", persist-credentials: false }
      - id: plan
        run: |
          python3 - <<'PY'
          import json, os
          n = int(os.environ["SHARDS"])
          assert 1 <= n <= 64, f"shards must be 1-64, not {n}"
          s = json.load(open("sources.json"))["sources"][os.environ["KEY"]]
          assert not s.get("corpusRoot"), "a corpusRoot source is set up in place, not on runners"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("shards=" + json.dumps(list(range(n))) + "\n")
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: This library's tentative records (only its own files from the tree repository)
        run: |
          files=$(python3 -c "import json, os; s = json.load(open('sources.json'))['sources'][os.environ['KEY']]; print(' '.join('data/tentative/' + f for f in s.get('tentative', [os.environ['KEY'] + '.jsonl'])))")
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku tengoku
          git -C tengoku sparse-checkout set --no-cone $files
          git -C tengoku checkout -q
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The previous round's build
        if: inputs.resume_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: build, run-id: "${{ inputs.resume_run }}", github-token: "${{ github.token }}" }
      - name: Build what fits in ${{ inputs.prime_minutes }} minutes
        env: { PRIME_MINUTES: "${{ inputs.prime_minutes }}" }
        run: |
          args=$(python3 -c "import json, os; print(' '.join(json.load(open('sources.json'))['sources'][os.environ['KEY']].get('setup', {}).get('args', [])))")
          restore=""; [ -f build.tar.zst ] && restore="--restore build.tar.zst"
          timeout -k 2m "${PRIME_MINUTES}m" node scripts/setup-source.mjs "$KEY" --phase build $restore $args || echo "::notice::the prime build stopped at its budget; the shards build the rest"
          pkill -f 'bin/lake|bin/lean' || true
      - name: Pack the build
        run: |
          repo="infra/$KEY/repo/$(python3 -c "import json, os; print(json.load(open('sources.json'))['sources'][os.environ['KEY']].get('subdir', ''))")"
          mkdir -p "$repo/.lake/build"
          rm -f build.tar.zst
          tar --zstd -cf build.tar.zst -C "$repo" .lake/build
          ls -la build.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: build, path: build.tar.zst, retention-days: 3, compression-level: 0 }

  shard:
    needs: prime
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions: { contents: read }
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard: ${{ fromJSON(needs.prime.outputs.shards) }}
    env:
      I: ${{ matrix.shard }}
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      # the committed exports come along: every stage skips what an earlier round or shard already produced
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          filter: "blob:none"
          sparse-checkout: |
            scripts
            data/exports/${{ inputs.key }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: This library's tentative records
        run: |
          files=$(python3 -c "import json, os; s = json.load(open('sources.json'))['sources'][os.environ['KEY']]; print(' '.join('data/tentative/' + f for f in s.get('tentative', [os.environ['KEY'] + '.jsonl'])))")
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku tengoku
          git -C tengoku sparse-checkout set --no-cone $files
          git -C tengoku checkout -q
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: build }
      - name: Shard ${{ matrix.shard }} of ${{ inputs.shards }}
        run: |
          args=$(python3 -c "import json, os; print(' '.join(json.load(open('sources.json'))['sources'][os.environ['KEY']].get('setup', {}).get('args', [])))")
          timeout -k 2m 300m node scripts/setup-source.mjs "$KEY" --phase shard --shard "$I/$SHARDS" --restore build.tar.zst $args || echo "::notice::shard $I stopped before finishing; committing what it produced"
          pkill -f 'bin/lake|bin/lean' || true
          rm -f build.tar.zst
      - name: What this shard produced
        if: always()
        run: |
          d="data/exports/$KEY"
          # GitHub refuses a file over 100 MB; a module left out this way is handled again by the next round
          find "$d" -type f -size +95M -print -delete || true
          find "$d" -type f \( -name '*.tmp' -o -name '*.tmp-*' -o -name '.batch-*.tsv' \) -delete || true
          git ls-files --others --modified --exclude-standard -z -- "$d" > produced.lst
          echo "$(tr -cd '\0' < produced.lst | wc -c) files"
          tar --null -T produced.lst --zstd -cf "out-$I.tar.zst"
          ls -la "out-$I.tar.zst"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "out-${{ matrix.shard }}", path: "out-${{ matrix.shard }}.tar.zst", retention-days: 3, compression-level: 0 }

  finish:
    needs: [prime, shard]
    if: always() && needs.prime.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: write, actions: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          filter: "blob:none"
          fetch-depth: 0
          sparse-checkout: |
            scripts
            data/exports/${{ inputs.key }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: This library's tentative records
        run: |
          files=$(python3 -c "import json, os; s = json.load(open('sources.json'))['sources'][os.environ['KEY']]; print(' '.join('data/tentative/' + f for f in s.get('tentative', [os.environ['KEY'] + '.jsonl'])))")
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku tengoku
          git -C tengoku sparse-checkout set --no-cone $files
          git -C tengoku checkout -q
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true   # a round in which no shard uploaded anything still dispatches the next one
        with: { pattern: "out-*", path: shard-out, merge-multiple: true }
      - name: Bank every shard's exports
        env: { GH_TOKEN: "${{ github.token }}", ROUND: "${{ inputs.round }}" }
        run: |
          shopt -s nullglob
          for f in shard-out/out-*.tar.zst; do tar --zstd -xf "$f"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -- "data/exports/$KEY"
          if git diff --cached --quiet; then echo "the shards produced nothing new"; exit 0; fi
          git commit -q -m "exports: $KEY round $ROUND ($(ls shard-out | wc -l | tr -d ' ') shards, runner)" -m "Run $GITHUB_RUN_ID of .github/workflows/setup-sharded.yml." -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          for i in $(seq 1 30); do
            if git pull -q --rebase --autostash origin main && git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then echo "banked round $ROUND"; exit 0; fi
            sleep $((RANDOM % 25 + 5))
          done
          echo "could not push after 30 attempts"; exit 1
      - name: Every module exported or recorded as failed?
        run: node scripts/setup-source.mjs "$KEY" --phase finish
      - name: Bank the setup record, or dispatch the next round
        env:
          GH_TOKEN: ${{ github.token }}
          ROUND: ${{ inputs.round }}
          MAX_ROUNDS: ${{ inputs.max_rounds }}
          PRIME_MINUTES: ${{ inputs.prime_minutes }}
          EXPAND_CHUNK: ${{ inputs.expand_chunk }}
        run: |
          if [ -f "infra/$KEY/setup.json" ]; then
            cp "infra/$KEY/setup.json" "data/exports/$KEY/setup.ci.json"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --sparse -- "data/exports/$KEY/setup.ci.json"
            summary=$(python3 -c "import json, os; j = json.load(open('data/exports/' + os.environ['KEY'] + '/setup.ci.json')); print(f\"{j['exported']}/{j['modules']} modules exported on {j['toolchain']} ({j['repo']} @ {j['commit'][:12]}), {len(j['failed'])} failed\")")
            git commit -q -m "exports: $KEY (sharded runner)" -m "$summary. Set up across runners by .github/workflows/setup-sharded.yml in $ROUND round(s); a laptop's setup-source.mjs adopts setup.ci.json instead of building." -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
            for i in $(seq 1 30); do
              if git pull -q --rebase --autostash origin main && git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then echo "banked $KEY"; exit 0; fi
              sleep $((RANDOM % 25 + 5))
            done
            echo "could not push after 30 attempts"; exit 1
          fi
          if [ "$ROUND" -ge "$MAX_ROUNDS" ]; then echo "::error::$KEY is not finished after $ROUND rounds: see the finish step"; exit 1; fi
          gh workflow run setup-sharded.yml -R "$GITHUB_REPOSITORY" --ref main -f key="$KEY" -f shards="$SHARDS" -f prime_minutes="$PRIME_MINUTES" \
            -f expand_chunk="$EXPAND_CHUNK" -f round="$((ROUND + 1))" -f max_rounds="$MAX_ROUNDS" -f resume_run="$GITHUB_RUN_ID"
          echo "::notice::dispatched round $((ROUND + 1))"
