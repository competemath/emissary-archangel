name: setup-sharded
run-name: setup-sharded ${{ inputs.key }} (round ${{ inputs.round || '1' }}${{ inputs.build_round != '' && inputs.build_round != '1' && format(', build {0}', inputs.build_round) || '' }})
# One library too big for one 6-hour job (flt-anthropic, lean-pool, tauceti, navier-stokes-euler), split across
# runners. Every shard starts at once: it builds its slice of the modules (a stable hash of the module name picks
# it) with their imports, so a module many slices import is compiled on each of them; on free runners that
# duplicated work costs nothing, and waiting for one runner to compile the shared modules first cost hours. A
# prime build (prime_minutes > 0) is still there for a later round, which resumes from it. The shard runs closures, notation
# expansion and lean4export for that slice with scripts/setup-source.mjs --phase shard, and hands what it produced
# to the finish job as an artifact. The shards run the library's own Lean code, so they only read: their token can
# write nothing and is never stored in a checkout. The finish job, which runs no Lean, commits every shard's
# outputs. Such a library's machine exports (.ndjson, .names.json: many GB, kept only until the library is
# translated) go into ONE release archive, `<key>@<commit>-exports.tar.zst` under the release `exports-<key>`;
# git gets its setup.ci.json, which names the archive and its sha256, and the readable .expanded.lean files. The
# bridge downloads the archive the first time a translation needs the library (scripts/fetch-exports.mjs by hand).
# Every stage skips outputs that already exist, so a shard that runs out of time loses nothing: the finish job
# publishes once every module is exported or recorded as failed, and otherwise hands the outputs so far to the next
# round as an artifact and dispatches it (at most `max_rounds`). `bank_run` publishes an earlier run's shard outputs.
# The build comes first when it is long (prime_minutes > 0): the prime job builds for that many minutes, carrying on from
# the build of the previous round (`build_run`, or `resume_run`), and then looks at what it has (--phase build-status). Only
# a complete build starts the shards; an incomplete one hands over to the build-gate job, which dispatches one more build
# round (at most `max_build_rounds`) and ends this run. A library that builds in one round goes straight on to its shards.
# setup-auto.yml chooses between this and setup-libraries.yml (one job) from the size of the library.
on:
  workflow_dispatch:
    inputs:
      key:
        description: "One source key from sources.json."
        required: true
      shards:
        description: "Runners that split the per-module work (at most 16 run at once)."
        required: false
        default: "16"
      prime_minutes:
        description: "Minutes of shared build on one runner before the shards start (0: none, every shard builds its own slice at once)."
        required: false
        default: "0"
      expand_chunk:
        description: "Modules per notation-expansion process (EMISSARY_EXPAND_CHUNK); raise it for many tiny modules."
        required: false
        default: "1"
      round:
        description: "internal: which round this is"
        required: false
        default: "1"
      parallel:
        description: "Shards running at once (runners are shared with translation and the tree's gate and queue)."
        required: false
        default: "6"
      max_rounds:
        description: "Rounds before the workflow stops dispatching itself."
        required: false
        default: "4"
      resume_run:
        description: "internal: the run whose outputs (and prime build) this round resumes"
        required: false
        default: ""
      build_run:
        description: "internal: the run whose build the prime job carries on from (default: resume_run)"
        required: false
        default: ""
      build_round:
        description: "internal: which build-only round this is"
        required: false
        default: "1"
      max_build_rounds:
        description: "Build rounds before the workflow gives up on a build that is still not complete."
        required: false
        default: "6"
      prev_built:
        description: "internal: modules with an .olean after the build round before this one (the build-gate job of that round passes it on); empty for the first round"
        required: false
        default: ""
      min_progress:
        description: "Modules a build round (not the first) must add to the round before it; a round that adds fewer is not followed by another (0: no such stop)."
        required: false
        default: "1"
      bank_run:
        description: "Publish the shard outputs of this earlier run instead of running shards (their artifacts last 3 days)."
        required: false
        default: ""
      tengoku_ref:
        description: "A branch of competemath/tengoku to read the library's tentative records from (default: main). For libraries whose records are in a PR that is not merged yet."
        required: false
        default: ""

permissions: {}

concurrency:
  group: setup-sharded-${{ inputs.key }}
  cancel-in-progress: false

env:
  KEY: ${{ inputs.key }}
  SHARDS: ${{ inputs.shards }}
  LEAN_NUM_THREADS: "4"
  EMISSARY_LEAN_MB: "12288"
  EMISSARY_EXPAND_CHUNK: ${{ inputs.expand_chunk }}
  EMISSARY_TENTATIVE_DIR: ${{ github.workspace }}/tengoku/data/tentative
  TENGOKU_REF: ${{ inputs.tengoku_ref }}

jobs:
  prime:
    if: inputs.bank_run == ''
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    permissions: { contents: read, actions: read }
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      complete: ${{ steps.status.outputs.complete }}
      built: ${{ steps.status.outputs.built }}
      modules: ${{ steps.status.outputs.modules }}
      toobig: ${{ steps.status.outputs.toobig }}
      blocked: ${{ steps.status.outputs.blocked }}
    steps:
      - name: Free disk (a Mathlib cache plus a library build need ~20 GB)
        if: inputs.prime_minutes != '0'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { filter: "blob:none", sparse-checkout: "scripts", persist-credentials: false }
      - id: plan
        env: { PRIME_MINUTES: "${{ inputs.prime_minutes }}" }
        run: |
          python3 - <<'PY'
          import json, os
          n = int(os.environ["SHARDS"])
          assert 1 <= n <= 64, f"shards must be 1-64, not {n}"
          assert 0 <= int(os.environ["PRIME_MINUTES"]) <= 300, "prime_minutes is 0-300: the job has 350 minutes and the setup and the packing take the rest"
          s = json.load(open("sources.json"))["sources"][os.environ["KEY"]]
          assert not s.get("corpusRoot"), "a corpusRoot source is set up in place, not on runners"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("shards=" + json.dumps(list(range(n))) + "\n")
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: This library's tentative records (only its own files from the tree repository)
        if: inputs.prime_minutes != '0'
        run: |
          files=$(python3 -c "import json, os; s = json.load(open('sources.json'))['sources'][os.environ['KEY']]; print(' '.join('data/tentative/' + f for f in s.get('tentative', [os.environ['KEY'] + '.jsonl'])))")
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku tengoku
          git -C tengoku sparse-checkout set --no-cone $files
          # TENGOKU_REF: a branch of the tree repository that holds records not merged yet (empty: the default branch)
          if [ -n "${TENGOKU_REF:-}" ]; then git -C tengoku checkout -q "origin/$TENGOKU_REF"; else git -C tengoku checkout -q; fi
      - name: elan
        if: inputs.prime_minutes != '0'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The previous round's build
        if: (inputs.build_run != '' || inputs.resume_run != '') && inputs.prime_minutes != '0'
        continue-on-error: true   # an artifact older than its 3 days is gone: the build then starts again, which is slow but not wrong
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: build, run-id: "${{ inputs.build_run || inputs.resume_run }}", github-token: "${{ github.token }}" }
      - name: Build what fits in ${{ inputs.prime_minutes }} minutes
        if: inputs.prime_minutes != '0'
        env: { PRIME_MINUTES: "${{ inputs.prime_minutes }}" }
        run: |
          args=$(python3 -c "import json, os; print(' '.join(json.load(open('sources.json'))['sources'][os.environ['KEY']].get('setup', {}).get('args', [])))")
          restore=""; [ -f build.tar.zst ] && restore="--restore build.tar.zst"
          # Lake writes a <module>.setup.json per module under .lake/build/ir listing its whole import closure: 7.6 MB each on average for
          # this library (11,792 of them were 89.5 GB when unpacked; compressed they are 5 GB, so the artifact looked harmless and the next
          # round's unpack filled the runner's disk in 35 minutes). Lake regenerates them on demand and Tengoku's own cache leaves them
          # out, so they are not packed, not restored, and the ones older than 15 minutes are deleted while the build runs.
          # the Lake project is infra/$KEY/repo/<subdir> for a source with a subdir (formal-math, immerman-vardi, fagin, openai-math), as in "Pack the build"
          sub=$(python3 -c "import json, os; print(json.load(open('sources.json'))['sources'][os.environ['KEY']].get('subdir', ''))")
          ( while sleep 300; do find "infra/$KEY/repo/$sub/.lake/build/ir" -name '*.setup.json' -mmin +15 -delete 2>/dev/null; done ) &
          cleaner=$!   # stopped right after the build: it must not delete files while the next step packs the folder (tar: file changed as we read it)
          # one line a minute: free memory, modules built, the biggest process (build-metrics.tsv, kept as an artifact); every fifth is also printed so the log is never silent
          sh scripts/runner-watch.sh "infra/$KEY/repo/$sub/.lake/build/lib/lean" build-metrics.tsv 60 &
          watcher=$!
          timeout -k 2m "${PRIME_MINUTES}m" node scripts/setup-source.mjs "$KEY" --phase build $restore $args || echo "::notice::the prime build stopped at its budget; the shards build the rest"
          pkill -f 'bin/lake|bin/lean' || true
          kill "$cleaner" 2>/dev/null || true
          kill "$watcher" 2>/dev/null || true; wait "$watcher" 2>/dev/null || true   # the watcher takes a last sample when told to stop
      - name: This round in numbers
        if: always() && inputs.prime_minutes != '0'
        env: { BUILD_ROUND: "${{ inputs.build_round }}" }
        run: |
          [ -f build-metrics.tsv ] && python3 scripts/round-summary.py build-metrics.tsv "Build round $BUILD_ROUND of $KEY" 60 >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && inputs.prime_minutes != '0'
        with: { name: "build-metrics-${{ inputs.build_round }}", path: build-metrics.tsv, retention-days: 14, if-no-files-found: ignore }
      - name: Is the build complete?
        id: status
        if: inputs.prime_minutes != '0'
        run: |
          # runs no Lean; the library's own code has run in this job, so only a word and two counts are taken from the answer, each cut down to its shape
          answer=$(node scripts/setup-source.mjs "$KEY" --phase build-status || true)
          word=$(printf '%s\n' "$answer" | grep -E '^complete=(true|false)$' | tail -n 1 || true)
          echo "complete=${word#complete=}" | grep -E '^complete=(true|false)$' >> "$GITHUB_OUTPUT" || echo "complete=false" >> "$GITHUB_OUTPUT"
          # built = modules with an .olean after this round: the next round's build-gate compares its own count with it. Nothing is written when the line is not a count (the gate then has nothing to compare)
          # toobig and blocked: modules the memory watchdog killed even when built alone, and the modules that import them (scripts/setup-source.mjs buildStatus)
          for name in built modules toobig blocked; do
            printf '%s\n' "$answer" | grep -E "^${name}=(0|[1-9][0-9]{0,8})$" | tail -n 1 >> "$GITHUB_OUTPUT" || true
          done
          cat "infra/$KEY/build-status.json" || true
          # which modules have no .olean and why (module names only, each checked against the shape of a Lean module name when written)
          [ -f "infra/$KEY/unbuilt-summary.md" ] && cat "infra/$KEY/unbuilt-summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Pack the build
        run: |
          repo="infra/$KEY/repo/$(python3 -c "import json, os; print(json.load(open('sources.json'))['sources'][os.environ['KEY']].get('subdir', ''))")"
          mkdir -p "$repo/.lake/build"
          rm -f build.tar.zst
          # tar exits 1 when a file changed while it was read: the archive is still written, and losing a 5-hour round to it is worse (round 3 of flt-anthropic was)
          tar --zstd --exclude='*.setup.json' -cf build.tar.zst -C "$repo" .lake/build || { rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; echo "::warning::tar: a file changed while it was packed (exit 1); the archive was written"; }
          ls -la build.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: build, path: build.tar.zst, retention-days: 3, compression-level: 0 }

  # One more build round when the build is not complete. Runs none of the library's code, so unlike the prime job it may hold a
  # token that can dispatch; the only thing taken from the prime job is a word that is compared, never run.
  build-gate:
    needs: prime
    if: always() && inputs.bank_run == '' && inputs.prime_minutes != '0' && needs.prime.result == 'success' && needs.prime.outputs.complete != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: { actions: write }
    outputs:
      stalled: ${{ steps.gate.outputs.stalled }}
      built: ${{ steps.gate.outputs.built }}
      prev_built: ${{ steps.gate.outputs.prev_built }}
      modules: ${{ steps.gate.outputs.modules }}
      toobig: ${{ steps.gate.outputs.toobig }}
      blocked: ${{ steps.gate.outputs.blocked }}
      added: ${{ steps.gate.outputs.added }}
      min_progress: ${{ steps.gate.outputs.min_progress }}
    steps:
      - name: Dispatch the next build round
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHARDS: ${{ inputs.shards }}
          PRIME_MINUTES: ${{ inputs.prime_minutes }}
          EXPAND_CHUNK: ${{ inputs.expand_chunk }}
          ROUND: ${{ inputs.round }}
          MAX_ROUNDS: ${{ inputs.max_rounds }}
          PARALLEL: ${{ inputs.parallel || '12' }}
          RESUME_RUN: ${{ inputs.resume_run }}
          BUILD_ROUND: ${{ inputs.build_round }}
          MAX_BUILD_ROUNDS: ${{ inputs.max_build_rounds }}
          TENGOKU_REF: ${{ inputs.tengoku_ref }}
          MIN_PROGRESS: ${{ inputs.min_progress }}
          PREV_BUILT: ${{ inputs.prev_built }}
          BUILT: ${{ needs.prime.outputs.built }}
          MODULES: ${{ needs.prime.outputs.modules }}
          TOOBIG: ${{ needs.prime.outputs.toobig }}
          BLOCKED: ${{ needs.prime.outputs.blocked }}
        run: |
          for v in "$SHARDS" "$PRIME_MINUTES" "$EXPAND_CHUNK" "$ROUND" "$MAX_ROUNDS" "$PARALLEL" "$BUILD_ROUND" "$MAX_BUILD_ROUNDS"; do
            [[ "$v" =~ ^[0-9]+$ ]] || { echo "::error::an input is not a number: $v"; exit 1; }
          done
          # the counts are plain decimal numbers (no sign, no leading zero: bash would read 08 as octal), at most nine digits; prev_built, built and modules may be empty (nothing known)
          [[ "$MIN_PROGRESS" =~ ^(0|[1-9][0-9]{0,8})$ ]] || { echo "::error::min_progress is not a count: $MIN_PROGRESS"; exit 1; }
          for v in "$PREV_BUILT" "$BUILT" "$MODULES" "$TOOBIG" "$BLOCKED"; do
            [[ "$v" =~ ^((0|[1-9][0-9]{0,8}))?$ ]] || { echo "::error::a module count is not a number: $v"; exit 1; }
          done
          [[ "$RESUME_RUN" =~ ^[0-9]*$ ]] || { echo "::error::resume_run is not a run id"; exit 1; }
          [[ "$TENGOKU_REF" =~ ^[A-Za-z0-9._/-]*$ ]] || { echo "::error::tengoku_ref is not a branch name"; exit 1; }
          # A round that did nothing is not followed by another. Round 1 has no round before it, and a chain started by hand may not know the count of the round before: neither is judged.
          # (flt-anthropic, 30,662 modules: three rounds in a row exported nothing and nothing noticed.) scripts/setup-plan.mjs roundProgress is the same rule; scripts/test-setup-workflows.mjs runs this text against it.
          if [ "$BUILD_ROUND" -gt 1 ] && [ -n "$PREV_BUILT" ] && [ -n "$BUILT" ]; then
            added=$((10#$BUILT - 10#$PREV_BUILT))
            if [ "$MIN_PROGRESS" -gt 0 ] && [ "$added" -lt "$MIN_PROGRESS" ]; then   # min_progress 0: no such stop, not even for a count that fell
              {
                echo "stalled=true"; echo "built=$BUILT"; echo "prev_built=$PREV_BUILT"; echo "modules=$MODULES"; echo "toobig=$TOOBIG"; echo "blocked=$BLOCKED"; echo "added=$added"; echo "min_progress=$MIN_PROGRESS"
              } >> "$GITHUB_OUTPUT"
              echo "::error::$KEY: build round $BUILD_ROUND made no progress: $BUILT of ${MODULES:-?} modules built, $PREV_BUILT after round $((BUILD_ROUND - 1)), so $added added, fewer than min_progress=$MIN_PROGRESS. Not dispatching another round. (A negative number means the build of the round before was not restored, e.g. its artifact had expired.)"
              exit 1
            fi
          elif [ "$BUILD_ROUND" -gt 1 ]; then
            echo "::notice::build round $BUILD_ROUND: no count of the round before it (prev_built=${PREV_BUILT:-empty}, built=${BUILT:-empty}), so its progress is not judged"
          fi
          if [ "$BUILD_ROUND" -ge "$MAX_BUILD_ROUNDS" ]; then
            echo "::error::$KEY is not built after $BUILD_ROUND build rounds (see the 'Is the build complete?' step of the prime job): raise max_build_rounds, or the library needs a bigger runner"
            exit 1
          fi
          gh workflow run setup-sharded.yml -R "$GITHUB_REPOSITORY" --ref main -f key="$KEY" -f shards="$SHARDS" -f prime_minutes="$PRIME_MINUTES" \
            -f expand_chunk="$EXPAND_CHUNK" -f round="$ROUND" -f max_rounds="$MAX_ROUNDS" -f parallel="$PARALLEL" -f resume_run="$RESUME_RUN" \
            -f build_run="$GITHUB_RUN_ID" -f build_round="$((BUILD_ROUND + 1))" -f max_build_rounds="$MAX_BUILD_ROUNDS" \
            -f tengoku_ref="$TENGOKU_REF" -f min_progress="$MIN_PROGRESS" -f prev_built="$BUILT"
          echo "::notice::the build is not complete: dispatched build round $((BUILD_ROUND + 1)) of at most $MAX_BUILD_ROUNDS"

  # The build-gate job stopped the chain because a round built (almost) nothing: say so where it will be seen, in ONE issue (opened, or updated when it is already open). Runs none of the
  # library's code and checks nothing out; the only things it takes from the other jobs are numbers, checked again here. `issues: write` is held by this job alone.
  report-stall:
    needs: build-gate
    if: always() && inputs.bank_run == '' && needs.build-gate.outputs.stalled == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: { issues: write }
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ROUND: ${{ inputs.build_round }}
          BUILT: ${{ needs.build-gate.outputs.built }}
          PREV_BUILT: ${{ needs.build-gate.outputs.prev_built }}
          MODULES: ${{ needs.build-gate.outputs.modules }}
          TOOBIG: ${{ needs.build-gate.outputs.toobig }}
          BLOCKED: ${{ needs.build-gate.outputs.blocked }}
          ADDED: ${{ needs.build-gate.outputs.added }}
          MIN_PROGRESS: ${{ needs.build-gate.outputs.min_progress }}
          RUN_ID: ${{ github.run_id }}
        run: |
          [[ "$KEY" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::the key is not a source key"; exit 1; }
          for v in "$BUILD_ROUND" "$BUILT" "$PREV_BUILT" "$MIN_PROGRESS" "$RUN_ID"; do
            [[ "$v" =~ ^[0-9]{1,12}$ ]] || { echo "::error::not a number: $v"; exit 1; }
          done
          for v in "$MODULES" "$TOOBIG" "$BLOCKED"; do
            [[ "$v" =~ ^[0-9]{0,9}$ ]] || { echo "::error::not a number: $v"; exit 1; }
          done
          [[ "$ADDED" =~ ^-?[0-9]{1,9}$ ]] || { echo "::error::not a number: $ADDED"; exit 1; }
          title="setup $KEY: build round made no progress"
          {
            echo "Build round $BUILD_ROUND of \`$KEY\` (workflow \`setup-sharded\`) added **$ADDED** modules; the chain was stopped instead of dispatching another round."
            echo
            echo "| | modules with an .olean |"
            echo "|---|---|"
            echo "| after round $((10#$BUILD_ROUND - 1)) | $PREV_BUILT |"
            echo "| after round $BUILD_ROUND | $BUILT |"
            echo "| the library | ${MODULES:-unknown} |"
            echo "| required per round (\`min_progress\`) | $MIN_PROGRESS |"
            echo
            if [ -n "$TOOBIG" ] && [ "$TOOBIG" -gt 0 ]; then
              echo "**$TOOBIG module(s) were killed for memory even when built alone, and ${BLOCKED:-0} more are left out because they import one of them.** Those are what no further round can build: the 'Modules without an .olean' part of the run summary names them and the size they were killed at. A bigger runner, or a change to the library, is the way on."
              echo
            elif [ -n "$TOOBIG" ]; then
              echo "No module was killed for memory (the build is not stuck on memory); the 'Modules without an .olean' part of the run summary says what else is missing."
              echo
            fi
            echo "A negative number of added modules means the build of the round before was not restored (its artifact lasts 3 days). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
            echo
            echo "Look at the 'This round in numbers' summary and the build-metrics artifact of that round; raise \`min_progress\` or set it to 0 to continue regardless."
          } > body.md
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 100 --search "\"$title\" in:title" --json number,title | jq -r --arg t "$title" '[.[] | select(.title == $t)] | sort_by(.number) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" -R "$GITHUB_REPOSITORY" --body-file body.md
            echo "::notice::updated issue #$number"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
          fi

  shard:
    needs: prime
    if: inputs.prime_minutes == '0' || needs.prime.outputs.complete == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    permissions: { contents: read }
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel || '6') }}   # runners are shared with translation and the tree's gate and queue
      matrix:
        shard: ${{ fromJSON(needs.prime.outputs.shards) }}
    env:
      I: ${{ matrix.shard }}
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      # the committed exports come along: every stage skips what an earlier round or shard already produced
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          filter: "blob:none"
          sparse-checkout: |
            scripts
            data/exports/${{ inputs.key }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: This library's tentative records
        run: |
          files=$(python3 -c "import json, os; s = json.load(open('sources.json'))['sources'][os.environ['KEY']]; print(' '.join('data/tentative/' + f for f in s.get('tentative', [os.environ['KEY'] + '.jsonl'])))")
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku tengoku
          git -C tengoku sparse-checkout set --no-cone $files
          # TENGOKU_REF: a branch of the tree repository that holds records not merged yet (empty: the default branch)
          if [ -n "${TENGOKU_REF:-}" ]; then git -C tengoku checkout -q "origin/$TENGOKU_REF"; else git -C tengoku checkout -q; fi
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: build }
      - name: The previous round's outputs
        if: inputs.resume_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: exports-partial, run-id: "${{ inputs.resume_run }}", github-token: "${{ github.token }}" }
      - name: Everything present before this shard runs
        run: |
          d="data/exports/$KEY"
          mkdir -p "$d"
          # an archive holds paths relative to the library's export folder; one from before 2026-09-26 holds
          # data/exports/<key>/... paths from the repository root: both land in the folder itself
          unpack() {
            local first; first=$(tar --zstd -tf "$1" | head -n 1 || true)
            case "$first" in
              data/exports/*) tar --zstd -xf "$1" -C "$d" --strip-components=3 ;;
              *) tar --zstd -xf "$1" -C "$d" ;;
            esac
          }
          if [ -f exports-partial.tar.zst ]; then unpack exports-partial.tar.zst; rm exports-partial.tar.zst; fi
          find "$d" -type f | sort > before.lst
      - name: Shard ${{ matrix.shard }} of ${{ inputs.shards }}
        run: |
          args=$(python3 -c "import json, os; print(' '.join(json.load(open('sources.json'))['sources'][os.environ['KEY']].get('setup', {}).get('args', [])))")
          # Lake writes a <module>.setup.json per module under .lake/build/ir listing its whole import closure: 7.6 MB each on average for
          # this library (11,792 of them were 89.5 GB when unpacked; compressed they are 5 GB, so the artifact looked harmless and the next
          # round's unpack filled the runner's disk in 35 minutes). Lake regenerates them on demand and Tengoku's own cache leaves them
          # out, so they are not packed, not restored, and the ones older than 15 minutes are deleted while the build runs.
          # the Lake project is infra/$KEY/repo/<subdir> for a source with a subdir (formal-math, immerman-vardi, fagin, openai-math), as in "Pack the build"
          sub=$(python3 -c "import json, os; print(json.load(open('sources.json'))['sources'][os.environ['KEY']].get('subdir', ''))")
          ( while sleep 300; do find "infra/$KEY/repo/$sub/.lake/build/ir" -name '*.setup.json' -mmin +15 -delete 2>/dev/null; done ) &
          cleaner=$!   # stopped right after the build: it must not delete files while the next step packs the folder (tar: file changed as we read it)
          timeout -k 2m 300m node scripts/setup-source.mjs "$KEY" --phase shard --shard "$I/$SHARDS" --restore build.tar.zst $args || echo "::notice::shard $I stopped before finishing; handing on what it produced"
          pkill -f 'bin/lake|bin/lean' || true
          kill "$cleaner" 2>/dev/null || true
          rm -f build.tar.zst
      - name: What this shard produced
        if: always()
        run: |
          d="data/exports/$KEY"
          find "$d" -type f \( -name '*.tmp' -o -name '*.tmp-*' -o -name '.batch-*.tsv' \) -delete || true
          find "$d" -type f | sort > after.lst
          comm -13 before.lst after.lst | sed "s|^$d/||" > produced.lst
          echo "$(wc -l < produced.lst | tr -d ' ') files"
          tar -C "$d" -T produced.lst --zstd -cf "out-$I.tar.zst"
          ls -la "out-$I.tar.zst"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "out-${{ matrix.shard }}", path: "out-${{ matrix.shard }}.tar.zst", retention-days: 3, compression-level: 0 }

  finish:
    needs: [prime, shard]
    if: always() && (needs.prime.result == 'success' || inputs.bank_run != '') && (inputs.bank_run != '' || inputs.prime_minutes == '0' || needs.prime.outputs.complete == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    permissions: { contents: write, actions: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          filter: "blob:none"
          fetch-depth: 0
          sparse-checkout: |
            scripts
            data/exports/${{ inputs.key }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: This library's tentative records
        run: |
          files=$(python3 -c "import json, os; s = json.load(open('sources.json'))['sources'][os.environ['KEY']]; print(' '.join('data/tentative/' + f for f in s.get('tentative', [os.environ['KEY'] + '.jsonl'])))")
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku tengoku
          git -C tengoku sparse-checkout set --no-cone $files
          # TENGOKU_REF: a branch of the tree repository that holds records not merged yet (empty: the default branch)
          if [ -n "${TENGOKU_REF:-}" ]; then git -C tengoku checkout -q "origin/$TENGOKU_REF"; else git -C tengoku checkout -q; fi
      - name: The previous round's outputs
        if: inputs.resume_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: exports-partial, run-id: "${{ inputs.resume_run }}", github-token: "${{ github.token }}" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true   # a round in which no shard uploaded anything still dispatches the next one
        with: { pattern: "out-*", path: shard-out, merge-multiple: true, run-id: "${{ inputs.bank_run || github.run_id }}", github-token: "${{ github.token }}" }
      - name: Every output so far, in one place
        run: |
          shopt -s nullglob
          d="data/exports/$KEY"
          mkdir -p "$d"
          # an archive holds paths relative to the library's export folder; one from before 2026-09-26 holds
          # data/exports/<key>/... paths from the repository root: both land in the folder itself
          unpack() {
            local first; first=$(tar --zstd -tf "$1" | head -n 1 || true)
            case "$first" in
              data/exports/*) tar --zstd -xf "$1" -C "$d" --strip-components=3 ;;
              *) tar --zstd -xf "$1" -C "$d" ;;
            esac
          }
          if [ -f exports-partial.tar.zst ]; then unpack exports-partial.tar.zst; rm exports-partial.tar.zst; fi
          for f in shard-out/out-*.tar.zst; do unpack "$f"; done
          rm -rf shard-out
          echo "$(find "$d" -name '*.ndjson' | wc -l | tr -d ' ') exports, $(du -sh "$d" | cut -f1)"
      - name: Every module exported or recorded as failed?
        run: node scripts/setup-source.mjs "$KEY" --phase finish
      - name: Publish the archive and the setup record, or hand on to the next round
        env:
          GH_TOKEN: ${{ github.token }}
          ROUND: ${{ inputs.round }}
          MAX_ROUNDS: ${{ inputs.max_rounds }}
          PRIME_MINUTES: ${{ inputs.prime_minutes }}
          EXPAND_CHUNK: ${{ inputs.expand_chunk }}
        run: |
          d="data/exports/$KEY"
          machine() { (cd "$d" && find . -type f \( -name '*.ndjson' -o -name '*.names.json' \) | sed 's|^\./||' | sort); }
          if [ ! -f "infra/$KEY/setup.json" ]; then
            if [ "$ROUND" -ge "$MAX_ROUNDS" ]; then echo "::error::$KEY is not finished after $ROUND rounds: see the step above"; exit 1; fi
            (cd "$d" && find . -type f | sed 's|^\./||') > partial.lst
            tar -C "$d" -T partial.lst --zstd -cf exports-partial.tar.zst
            echo "partial=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # the machine exports: ONE archive (split into parts only when over GitHub's 2 GB per file). Level 12:
          # level 19 took 110 of this job's 150 minutes on navier-stokes-euler (1.95 GB); 12 is several times faster.
          # --long=27 is the widest window a plain `tar --zstd -xf` still unpacks.
          commit=$(python3 -c "import json, os; print(json.load(open('sources.json'))['sources'][os.environ['KEY']]['commit'][:12])")
          asset="$KEY@$commit-exports.tar.zst"
          machine > archive.lst
          tar -C "$d" -T archive.lst -cf - | zstd -q -12 --long=27 -T0 -o "$asset"
          bytes=$(stat -c %s "$asset"); sha=$(sha256sum "$asset" | cut -d' ' -f1)
          echo "$asset: $(wc -l < archive.lst | tr -d ' ') files, $bytes bytes, sha256 $sha"
          files=("$asset")
          if [ "$bytes" -gt 2000000000 ]; then
            split -b 1900m -d -a 2 "$asset" "$asset.part-"; rm "$asset"; files=("$asset".part-*)
            echo "::warning::$asset is over 2 GB: published in ${#files[@]} parts, which the bridge joins"
          fi
          tag="exports-$KEY"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create "$tag" -R "$GITHUB_REPOSITORY" --target main --title "exports: $KEY" \
            --notes "The machine exports (lean4export .ndjson and closure .names.json) of $KEY, kept here until the library is translated. data/exports/$KEY/setup.ci.json names the archive for each pinned commit, with its sha256; the bridge downloads it on first use. By hand: node scripts/fetch-exports.mjs $KEY, or download and run: tar --zstd -xf <archive> -C data/exports/$KEY"
          gh release upload "$tag" "${files[@]}" -R "$GITHUB_REPOSITORY" --clobber
          python3 - "$asset" "$bytes" "$sha" "$(wc -l < archive.lst)" "${files[@]}" <<'PY'
          import json, os, sys
          asset, size, sha, count, *files = sys.argv[1:]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/exports-{os.environ['KEY']}/"
          rec_path = f"infra/{os.environ['KEY']}/setup.json"
          rec = json.load(open(rec_path))
          rec["archive"] = {"release": f"exports-{os.environ['KEY']}", "asset": asset, "url": base + asset, "bytes": int(size), "sha256": sha,
                            "files": int(count), "unpack": f"tar --zstd -xf {asset} -C data/exports/{os.environ['KEY']}"}
          if files != [asset]:
              rec["archive"]["parts"] = [{"asset": f, "url": base + f} for f in files]
          json.dump(rec, open(f"data/exports/{os.environ['KEY']}/setup.ci.json", "w"), indent=2)
          PY
          # git keeps the record, the readable .expanded.lean files and the shard records; never the machine exports
          printf '%s\n' '# machine exports: in the release archive named by setup.ci.json (scripts/fetch-exports.mjs)' '*.ndjson' '*.names.json' '.archive-*' > "$d/.gitignore"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -- "$d"
          if git diff --cached --name-only | grep -E '\.(ndjson|names\.json)$'; then echo "::error::a machine export was staged"; exit 1; fi
          summary=$(python3 -c "import json, os; j = json.load(open('data/exports/' + os.environ['KEY'] + '/setup.ci.json')); print(f\"{j['exported']}/{j['modules']} modules exported on {j['toolchain']} ({j['repo']} @ {j['commit'][:12]}), {len(j['failed'])} failed\")")
          git commit -q -m "exports: $KEY (sharded runner)" -m "$summary. Set up across runners by .github/workflows/setup-sharded.yml; the machine exports are the release archive $asset (sha256 ${sha:0:16}…), which the bridge downloads on first use." -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          for i in $(seq 1 30); do
            if git pull -q --rebase --autostash origin main && git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then echo "published $KEY"; exit 0; fi
            sleep $((RANDOM % 25 + 5))
          done
          echo "could not push after 30 attempts"; exit 1
      - if: env.partial == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: exports-partial, path: exports-partial.tar.zst, retention-days: 7, compression-level: 0 }
      - name: Dispatch the next round
        if: env.partial == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          ROUND: ${{ inputs.round }}
          MAX_ROUNDS: ${{ inputs.max_rounds }}
          PRIME_MINUTES: ${{ inputs.prime_minutes }}
          EXPAND_CHUNK: ${{ inputs.expand_chunk }}
          PARALLEL: ${{ inputs.parallel || '12' }}
          MAX_BUILD_ROUNDS: ${{ inputs.max_build_rounds }}
        run: |
          gh workflow run setup-sharded.yml -R "$GITHUB_REPOSITORY" --ref main -f key="$KEY" -f shards="$SHARDS" -f prime_minutes="$PRIME_MINUTES" \
            -f expand_chunk="$EXPAND_CHUNK" -f round="$((ROUND + 1))" -f max_rounds="$MAX_ROUNDS" -f resume_run="$GITHUB_RUN_ID" -f parallel="$PARALLEL" \
            -f max_build_rounds="$MAX_BUILD_ROUNDS" -f tengoku_ref="$TENGOKU_REF"
          echo "::notice::dispatched round $((ROUND + 1))"
