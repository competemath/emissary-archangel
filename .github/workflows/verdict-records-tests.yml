# What a ledger row records about WHY an entry ended as it did (lib/ledger-row.mjs, the verdict helpers of the bridge): no dependencies, no network.
name: verdict-records-tests
on:
  push:
    paths: ["lib/ledger-row.mjs", "scripts/test-verdict-records.mjs", "scripts/run-recurse.mjs", "public/local-claude-bridge.mjs", ".github/workflows/verdict-records-tests.yml"]
  pull_request:
    paths: ["lib/ledger-row.mjs", "scripts/test-verdict-records.mjs", "scripts/run-recurse.mjs", "public/local-claude-bridge.mjs", ".github/workflows/verdict-records-tests.yml"]
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            lib
            scripts
            public
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: node scripts/test-verdict-records.mjs
