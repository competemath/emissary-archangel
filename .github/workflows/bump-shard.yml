# One shard of a big library's bump (called by bump-sharded.yml; see scripts/bump/README.md). A shard builds a dependency-closed set of
# modules (its targets and everything they import), repairs them, runs the batched Gate 2 for the declarations of its TARGETS and works
# out which library constants their passed theorems are made of. It sends the merge what it needs to cut the intake bundle: the repaired
# sources and range sidecars of its modules, its verdicts, the constants to keep.
name: bump-shard
on:
  workflow_call:
    inputs:
      key: { type: string, required: true }
      mathlib: { type: string, required: true }
      toolchain: { type: string, required: true }
      shard: { type: number, required: true }
      controls: { type: string, default: "20" }
      tengoku_ref: { type: string, default: "" }
      imports: { type: string, default: "full" }
      gate2_budget_min: { type: string, default: "150", description: "minutes Gate 2 may spend on this shard before the chunks it has no time for are recorded as killed (gate2_driver.py --budget-min)" }
      gate2_skip: { type: string, default: "", description: "modules (comma list) Gate 2 does not try in this shard: they killed Lean alone in an earlier run (gate2_driver.py --skip); they get no verdict" }
      gate2_rss_share: { type: string, default: "0.80", description: "the share of the runner's memory one Lean process of Gate 2 may use before it is killed (gate2_driver.py --rss-share)" }
      swap_gb: { type: string, default: "0", description: "GB of swap this shard adds (0: none), for modules too big for a runner's 16 GB of RAM (flt-anthropic's P2M.Sol proofs of 100-900 KB). Gate 2 then counts swap as memory (--count-swap)" }
      build_timeout_min: { type: string, default: "90", description: "minutes one module may take to build (tolerant_build.py --timeout); a module too big for RAM and run on swap needs more" }
      round_reserve_min: { type: string, default: "30", description: "minutes of the job's 345 kept for what comes after the build: the build and its repair rounds stop that long before the limit (a round that runs out of time is undone, build_rounds.py); the steps after the build took at most 9.3 minutes on 63 real jobs (10 Nov 2026)" }
      reuse_run: { type: string, default: "", description: "a build-once that goes on from an earlier run (bump-waves.yml reuse_from): the run the packs in reuse_packs come from" }
      reuse_packs: { type: string, default: "", description: "comma list: N (the pack comes from reuse_run) or N@RUN (from RUN: a resume of a resume, lane_reuse.py); every other pack comes from this run" }
      build_once: { type: string, default: "false", description: "a job of a build-once (bump-waves.yml): the plan says which modules this job builds (own) and which earlier shards built the rest (restore)" }
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  shard:
    runs-on: ubuntu-26.04
    timeout-minutes: 345
    permissions: { contents: read, actions: read }  # actions: read = the packs of the earlier jobs of a build-once
    env:
      BUILD_ONCE: ${{ inputs.build_once }}
      KEY: ${{ inputs.key }}
      MATHLIB: ${{ inputs.mathlib }}
      TOOLCHAIN: ${{ inputs.toolchain }}
      SHARD: ${{ inputs.shard }}
      CONTROLS: ${{ inputs.controls }}
      TENGOKU_REF: ${{ inputs.tengoku_ref }}
      IMPORTS: ${{ inputs.imports }}
      GATE2_BUDGET_MIN: ${{ inputs.gate2_budget_min }}
      GATE2_RSS_SHARE: ${{ inputs.gate2_rss_share }}
      GATE2_SKIP: ${{ inputs.gate2_skip }}
      SWAP_GB: ${{ inputs.swap_gb }}
      BUILD_TIMEOUT_MIN: ${{ inputs.build_timeout_min }}
      ROUND_RESERVE_MIN: ${{ inputs.round_reserve_min }}
      REUSE_RUN: ${{ inputs.reuse_run }}
      REUSE_PACKS: ${{ inputs.reuse_packs }}
      JOB_MIN: 345  # the job's timeout-minutes (a test keeps the two equal): the clock the build, Gate 2 and the keep step share
    steps:
      - name: The memory knobs are numbers (they reach shell and Python)
        run: |
          echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
          [[ "$REUSE_RUN" =~ ^([1-9][0-9]{0,14})?$ && "$REUSE_PACKS" =~ ^([0-9]{1,4}(@[1-9][0-9]{0,14})?(,[0-9]{1,4}(@[1-9][0-9]{0,14})?)*)?$ ]] || { echo "::error::reuse_run is a run id and reuse_packs a comma list of N or N@RUN"; exit 1; }  # the job's start, for the deadlines of the build, Gate 2 and the keep step
          [[ "$GATE2_BUDGET_MIN" =~ ^[1-9][0-9]{0,2}$ ]] || { echo "::error::gate2_budget_min is a whole number of minutes (the job's clock caps it in shell arithmetic), not $GATE2_BUDGET_MIN"; exit 1; }
          [[ "$ROUND_RESERVE_MIN" =~ ^[1-9][0-9]{0,2}$ ]] && [ "$ROUND_RESERVE_MIN" -ge 10 ] && [ "$ROUND_RESERVE_MIN" -le 200 ] || { echo "::error::round_reserve_min is 10-200 minutes, not $ROUND_RESERVE_MIN"; exit 1; }
          [[ "$SWAP_GB" =~ ^(0|[1-9][0-9]{0,2})$ ]] || { echo "::error::swap_gb is a number of GB, not $SWAP_GB"; exit 1; }
          [[ "$BUILD_TIMEOUT_MIN" =~ ^[1-9][0-9]{0,2}$ ]] && [ "$BUILD_TIMEOUT_MIN" -le 170 ] || { echo "::error::build_timeout_min is 1-170 minutes (the job has 345, and its setup and Gate 2 come out of them), not $BUILD_TIMEOUT_MIN"; exit 1; }
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h / | tail -1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: "plan-${{ inputs.key }}", path: plan }
      - name: This shard's modules, and only the exports and entries it needs
        run: |
          python3 - <<'PY'
          import json, os
          p = json.load(open("plan/plan.json"))["shards"][int(os.environ["SHARD"])]
          open("targets.txt", "w").write("\n".join(p["targets"]) + "\n")
          open("build.txt", "w").write("\n".join(p["build"]) + "\n")
          own = p.get("own", p["build"])  # a build-once: what this job builds; the rest of `build` comes from the jobs before it
          open("own.txt", "w").write("\n".join(own) + "\n")
          open("closure.txt", "w").write("\n".join(sorted(set(p["build"]) - set(own))) + "\n")
          open("restore.txt", "w").write(",".join(str(s) for s in p.get("restore", [])))
          key = os.environ["KEY"]
          pats = [f"/data/exports/{key}/setup.ci.json", f"/data/translate/{key}.jsonl"]
          for m in p["targets"]:
              for variant in {m, m.replace("«", "").replace("»", "")}:
                  pats += [f"/data/exports/{key}/{variant}.ndjson", f"/data/exports/{key}/{variant}.names.json"]
          # the names of every module the shard builds: Gate 2 tells a module's own declarations from the ones it uses by them (gate2_batch.qualify). A library whose exports are in
          # git; one that keeps them in a release (the big ones: 60k modules would be 120k sparse patterns) gets them from fetch-exports --names below
          for m in (p["build"] if len(p["build"]) <= 5000 else []):
              for variant in {m, m.replace("«", "").replace("»", "")}:
                  pats.append(f"/data/exports/{key}/{variant}.names.json")
          open("sparse.txt", "w").write("\n".join(["/scripts/", "/gate2/", "/sources.json"] + pats) + "\n")
          print(len(p["targets"]), "targets,", len(p["build"]), "modules to build")
          PY
          git clone -q --filter=blob:none --no-checkout "https://github.com/$GITHUB_REPOSITORY" emissary
          git -C emissary sparse-checkout set --no-cone --stdin < sparse.txt
          git -C emissary checkout -q "$GITHUB_SHA"
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku tengoku
          git -C tengoku sparse-checkout set --no-cone $(python3 emissary/scripts/bump/tentative_files.py sparse emissary/sources.json "$KEY")
          # TENGOKU_REF: a branch of the tree repository that holds the records of a library whose PR is not merged yet (empty: main)
          ref=${TENGOKU_REF:+origin/$TENGOKU_REF}; git -C tengoku checkout -q "${ref:-main}"
          du -sh emissary/data/exports/"$KEY" | cut -f1
      - name: The old exports of this shard's targets (a library set up across runners keeps them in a release, not in git); first, so that a failed download costs minutes and not the shard's hours of build
        working-directory: emissary
        run: node scripts/fetch-exports.mjs "$KEY" --modules ../targets.txt --names ../build.txt   # targets.txt is in the workspace root at this point (the build step copies it into emissary/ later)
      - name: The work of the earlier jobs (a build-once; before any code of the library runs, the one step with a token)
        if: inputs.build_once == 'true'
        working-directory: emissary
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          [ ! -s ../restore.txt ] || python3 scripts/bump/wave_pack.py fetch --lib ../restored --work ../wave-packs --modules ../closure.txt --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --key "$KEY" --shards "$(cat ../restore.txt)" --reuse-run "$REUSE_RUN" --reuse-packs "$REUSE_PACKS"
          rm -rf ../wave-packs
      - name: elan
        run: |
          for try in $(seq 1 20); do curl --proto '=https' --tlsv1.2 -sSfL --max-time 120 -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh && echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  elan-init.sh" | sha256sum -c - && timeout 300 sh elan-init.sh -y --default-toolchain none && break; [ "$try" -lt 20 ] || exit 1; echo "::notice::the Lean installer failed (try $try of 20): again in 30 s"; sleep 30; done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Swap (swap_gb), for modules that do not fit in a runner's RAM (sized from the free space, 40 GB kept for the library's build)
        if: inputs.swap_gb != '0'
        run: sh emissary/scripts/add-swap.sh "$SWAP_GB" 40
      - name: The library at its pinned commit, on the tree's Mathlib
        working-directory: emissary
        run: |
          read -r repo commit _ roots < <(python3 scripts/trial-library-build.py meta "$KEY")
          echo "ROOTS=$(echo "$roots" | tr ' ' ',')" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none "$repo" lib && git -C lib checkout -q "$commit"
          # a library whose Lake project is a subdirectory of its repository (sources.json `subdir`): `lib` is that project, a symlink, so that a path dependency (`../concepts`)
          # still resolves next to it in the clone (as bump-library.yml does)
          sub=$(python3 -c "import json, os; print(json.load(open('sources.json'))['sources'][os.environ['KEY']].get('subdir', ''))")
          if [ -n "$sub" ]; then mv lib lib-repo && ln -s "lib-repo/$sub" lib; fi
          python3 scripts/bump/link_srcdir.py "$KEY" lib   # modules under a source folder (sources.json `srcdir`) are linked where their names say
          # the library's own commands that are synonyms of plain Lean (Compfiles: problem, determine, snip) become plain Lean
          python3 scripts/bump/adapters.py "$KEY" lib "$(echo "$roots" | tr ' ' ',')"
          python3 scripts/trial-library-build.py retarget lib "$MATHLIB" "$TOOLCHAIN"
          # elan downloads the toolchain on the first `lake` of the library, and that download fails now and then with a TLS error ("SSL connect error": 3 of the 32 shards of lean-pool on
          # 2026-10-19, minutes apart, each after a clean start) and the shard, which has done nothing yet, is lost with it. Installed here instead, with retries.
          for attempt in 1 2 3 4 5; do
            if elan toolchain install "$TOOLCHAIN" > /dev/null 2>&1; then break; fi
            if [ "$attempt" = 5 ]; then echo "::error::the toolchain $TOOLCHAIN did not download in 5 attempts"; exit 1; fi
            sleep $((attempt * 20))
          done
          # each under a time limit, tried again when it fails or hangs (evm-asm, 7 Nov 2026: one shard failed to fetch the cache, one hung here 5 h 43 min until the job was cancelled)
          python3 scripts/bump/lake_fetch.py lib
          # full: every seeded import becomes the umbrellas (the environment a record is verified in). faithful: the library keeps the imports its authors wrote, so that names
          # resolve as upstream (bundle.py compose --imports faithful names them in the tree's modules); see bump-sharded.yml `imports`
          if [ "$IMPORTS" = full ]; then python3 scripts/bump/engine.py normalize-imports --lib lib --roots "$(echo "$roots" | tr ' ' ',')" --lean-path "$(cd lib && lake env printenv LEAN_PATH)"; fi
      - name: The earlier jobs' work, into the library (a build-once)
        if: inputs.build_once == 'true'
        working-directory: emissary
        run: |
          [ ! -d ../restored ] || python3 scripts/bump/wave_pack.py place --from ../restored --lib lib
          rm -rf ../restored
      - name: Build this shard's modules, repair, rebuild
        working-directory: emissary
        run: |
          cp ../build.txt build.txt; cp ../targets.txt targets.txt; cp ../own.txt own.txt
          # a build-once: the modules of earlier jobs are not built here and their errors are not repaired here. Every build stops at the deadline, and a repair or
          # portfolio round that runs out of time is undone (build_rounds.py): flt-anthropic's job 28 ended 2 minutes inside the limit on 10 Nov 2026
          python3 scripts/bump/build_rounds.py --lib lib --roots "$ROOTS" --modules build.txt $([ "$BUILD_ONCE" != true ] || echo --own own.txt) \
            --deadline "$(( JOB_T0 + (JOB_MIN - ROUND_RESERVE_MIN) * 60 ))" --timeout "$BUILD_TIMEOUT_MIN" --repair-rounds 4 --portfolio-rounds 3
      - name: This job's work, for the jobs after it (a build-once; before Gate 2, so that a Gate 2 that dies does not cost the waves after it their build)
        if: inputs.build_once == 'true'
        working-directory: emissary
        run: python3 scripts/bump/wave_pack.py pack --lib lib --roots "$ROOTS" --modules own.txt --report tb-final.json --out ../wave-pack
      # The pack is hours of build: an upload that fails is tried again over half an hour, not given up after the action's own retries of a few seconds.
      # flt-anthropic's job 43 (run 43075875630, 11 Nov 2026) built for 2 h 16 min and lost it all to a GitHub outage of ~25 minutes ("workflow run not found", then error pages).
      - id: wave_up1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.build_once == 'true'
        continue-on-error: true
        with: { name: "wave-${{ inputs.key }}-${{ inputs.shard }}", path: wave-pack, retention-days: 14, compression-level: 0, overwrite: true }
      - name: The upload failed; wait before the next try
        if: inputs.build_once == 'true' && steps.wave_up1.outcome == 'failure'
        run: |
          # never past the job's end: a wait that runs into the timeout cancels the job before its last try (cubic, #178); 6 minutes stay for the upload
          left=$(( JOB_T0 + JOB_MIN * 60 - $(date +%s) - 360 )); w=300; [ "$left" -lt "$w" ] && w=$left; [ "$w" -le 0 ] || sleep "$w"
      - id: wave_up2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.build_once == 'true' && steps.wave_up1.outcome == 'failure'
        continue-on-error: true
        with: { name: "wave-${{ inputs.key }}-${{ inputs.shard }}", path: wave-pack, retention-days: 14, compression-level: 0, overwrite: true }
      - name: The upload failed again; wait before the last try
        if: inputs.build_once == 'true' && steps.wave_up2.outcome == 'failure'
        run: |
          # never past the job's end: a wait that runs into the timeout cancels the job before its last try (cubic, #178); 6 minutes stay for the upload
          left=$(( JOB_T0 + JOB_MIN * 60 - $(date +%s) - 360 )); w=900; [ "$left" -lt "$w" ] && w=$left; [ "$w" -le 0 ] || sleep "$w"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.build_once == 'true' && steps.wave_up2.outcome == 'failure'
        with: { name: "wave-${{ inputs.key }}-${{ inputs.shard }}", path: wave-pack, retention-days: 14, compression-level: 0, overwrite: true }
      - name: Gate 2's own Lean modules, in a project of their own
        run: |
          mkdir vendorproj && cp -r emissary/gate2/Vendor.lean emissary/gate2/Vendor vendorproj/
          python3 emissary/scripts/bump/gate2_batch.py emit-vendor --out vendorproj
          cd vendorproj
          echo "$TOOLCHAIN" > lean-toolchain
          printf 'name = "V"\ndefaultTargets = ["Vendor"]\n[[lean_lib]]\nname = "Vendor"\n' > lakefile.toml
          lake build Vendor 2>&1 | tail -3
      - name: Batched Gate 2 over the declarations of this shard's targets
        working-directory: emissary
        run: |
          W="$PWD"  # `lib` is a symlink for a library with a `subdir`: a ../ after `cd lib` is the target's parent, not this directory
          LP="$(cd lib && lake env printenv LEAN_PATH):$GITHUB_WORKSPACE/vendorproj/.lake/build/lib/lean"
          TENT="$(python3 scripts/bump/tentative_files.py globs sources.json "$KEY" ../tengoku)"
          mine=$(paste -sd, targets.txt)
          # Gate 2's budget, but never past the job's end less 15 minutes for the keep step and the pack (they took at most 3 on 63 real jobs): chunks it has no time for are recorded as killed
          budget=$(( (JOB_T0 + JOB_MIN * 60 - $(date +%s)) / 60 - 15 )); [ "$budget" -le "$GATE2_BUDGET_MIN" ] || budget="$GATE2_BUDGET_MIN"; [ "$budget" -ge 1 ] || budget=1
          echo "Gate 2 budget: $budget minutes"
          # Gate 2 in chunks, each Lean process under a memory limit (scripts/bump/gate2_driver.py): one process over every declaration of a shard was killed by the
          # kernel, or took the runner down, on navier-stokes-euler. A module that kills Lean alone gets no verdict and is listed in gate2-killed.json.
          python3 scripts/bump/gate2_driver.py --key "$KEY" --lib lib --exports "data/exports/$KEY" --ledger "data/translate/$KEY.jsonl" \
            --roots "$ROOTS" --controls "$CONTROLS" --tentative "$TENT" --only "$mine" --lean-path "$LP" --budget-min "$budget" --rss-share "$GATE2_RSS_SHARE" --skip "$GATE2_SKIP" $([ "$SWAP_GB" != 0 ] && echo --count-swap)
          python3 scripts/bump/gate2_batch.py parse --log gate2.log --ledger "data/translate/$KEY.jsonl" --out gate2-results.json --exports "data/exports/$KEY" --lib lib --tentative "$TENT" --only "$mine" --killed gate2-killed.json
      - name: What the passed theorems are made of
        working-directory: emissary
        run: |
          # a program that imports only Lean and loads the library at run time (BundleKeep.lean says why: a script that imported the library parsed with its tokens)
          W="$PWD"  # `lib` is a symlink for a library with a `subdir`: a ../ after `cd lib` is the target's parent, not this directory
          # Two modules of a library that declare one name cannot be loaded together (`import X failed, environment already contains …`), and the tree loads every
          # module into one environment: the later one is left out with what imports it, the keep step runs again on the rest, and compose leaves out the same
          # (keep-drops.txt, through the shard pack). archon-firstproof-p6 (2026-11-07): FirstProof6_constant and FirstProof6_constant3 hold one file twice, and the
          # keep step printed only the clash, so compose found no BUNDLE_KEEP line and the bump died. bump-library.yml has had this loop; the shards had not.
          # One budget for all the tries: the 120 minutes the single run had, so the job's 345 are not overrun. The module is read up to the fixed words after it, so a quoted
          # part with a space stays whole; the drop lists are comma lists, so a name with a comma stops the step instead of dropping the wrong module.
          drop=""
          : > keep-drops.txt
          deadline=$(( $(date +%s) + 120 * 60 )); end=$(( JOB_T0 + (JOB_MIN - 8) * 60 )); [ "$deadline" -le "$end" ] || deadline=$end  # and never past the job's end less the pack's minutes
          for attempt in $(seq 1 25); do
            left=$(( deadline - $(date +%s) ))
            if [ "$left" -le 60 ]; then echo "::warning::the keep step's 120 minutes are spent after $((attempt - 1)) tries; compose reads the last log"; break; fi
            python3 scripts/bump/bundle.py keep-input --lib lib --passed passed.json --roots "$ROOTS" --drop "$drop" --out lib/bundle-keep.json
            (cd lib && timeout "${left}s" lake env lean --run "$W/scripts/bump/BundleKeep.lean" bundle-keep.json > "$W/bundle-deps.log" 2>&1 || true)
            bad=$(sed -nE 's/.*import (.+) failed, environment already contains .*/\1/p' bundle-deps.log | head -1 || true)
            [ -z "$bad" ] && break
            case "$bad" in *,*) echo "::error::import clash in the keep step on a module whose name has a comma ($bad): the drop lists are comma lists"; exit 1;; esac
            echo "import clash in the keep step: $bad (and what imports it) is left out of the bundle"; drop="$drop,$bad"; echo "$bad" >> keep-drops.txt
          done
          grep -c BUNDLE_KEEP bundle-deps.log || true
      - name: Pack this shard
        working-directory: emissary
        run: |
          python3 scripts/bump/shard_pack.py pack --lib lib --roots "$ROOTS" --modules "$([ "$BUILD_ONCE" = true ] && echo own.txt || echo build.txt)" --out ../shard-pack --gate2 gate2.log --errors build-final.log \
            --passed passed.json --keep bundle-deps.log --results gate2-results.json --keep-drops keep-drops.txt
          du -sh ../shard-pack | cut -f1
      # the shard's verdicts: tried again like the pack above (the same outage would cost them the whole job)
      - id: shard_up1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          name: shard-${{ inputs.key }}-${{ inputs.shard }}
          path: |
            shard-pack
            emissary/tb-final.json
            emissary/gate2-results.json
            emissary/gate2-killed.json
          retention-days: 90
          overwrite: true
      - name: The upload of the verdicts failed; wait before the next try
        if: always() && steps.shard_up1.outcome == 'failure'
        run: |
          # never past the job's end: a wait that runs into the timeout cancels the job before its last try (cubic, #178); 6 minutes stay for the upload
          left=$(( JOB_T0 + JOB_MIN * 60 - $(date +%s) - 360 )); w=300; [ "$left" -lt "$w" ] && w=$left; [ "$w" -le 0 ] || sleep "$w"
      - id: shard_up2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.shard_up1.outcome == 'failure'
        continue-on-error: true
        with:
          name: shard-${{ inputs.key }}-${{ inputs.shard }}
          path: |
            shard-pack
            emissary/tb-final.json
            emissary/gate2-results.json
            emissary/gate2-killed.json
          retention-days: 90
          overwrite: true
      - name: The upload of the verdicts failed again; wait before the last try
        if: always() && steps.shard_up2.outcome == 'failure'
        run: |
          # never past the job's end: a wait that runs into the timeout cancels the job before its last try (cubic, #178); 6 minutes stay for the upload
          left=$(( JOB_T0 + JOB_MIN * 60 - $(date +%s) - 360 )); w=900; [ "$left" -lt "$w" ] && w=$left; [ "$w" -le 0 ] || sleep "$w"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.shard_up2.outcome == 'failure'
        with:
          name: shard-${{ inputs.key }}-${{ inputs.shard }}
          path: |
            shard-pack
            emissary/tb-final.json
            emissary/gate2-results.json
            emissary/gate2-killed.json
          retention-days: 90
          overwrite: true
