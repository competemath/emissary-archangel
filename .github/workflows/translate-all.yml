name: translate-all
# The unattended loop. Every 15 minutes, and again whenever a library run finishes (translate.yml dispatches it):
#   1. dispatch: keep every library's translation moving, a few libraries at a time — a mechanical pass (no Claude) for
#      every set-up library until nothing is left for it, then an agent pass (only with the CLAUDE_CODE_OAUTH_TOKEN
#      secret; one library at a time: the Claude account's usage limit, not the runners, is the bottleneck there).
#      "Left" is data/translate/<key>.status.json, written by translate.yml's finish job.
#   2. flush: turn banked records (data/bank/) into tengoku PRs with the TENGOKU_BOT_TOKEN secret (bank-flush.mjs), when TRANSLATE_FLUSH=on.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      max_libraries: { description: "Library runs at once (translate.yml runs in flight count)", required: true, default: "6" }
      dry_run: { description: "Print the plan, dispatch nothing", required: true, default: "false" }
      flush_key: { description: "Flush only this library's bank (empty: all)", required: false, default: "" }

permissions: {}

concurrency:
  group: translate-all
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, actions: write }   # actions: write — to dispatch translate.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { filter: "blob:none", sparse-checkout: "data/translate", persist-credentials: false }
      - name: The big setups, one at a time (the libraries not yet self-contained)
        env:
          GH_TOKEN: ${{ github.token }}
          DRY: ${{ inputs.dry_run || 'false' }}
          SETUP_QUEUE: "tauceti:16:1:4:12 flt-anthropic:64:8:8:6"   # key:shards:expand_chunk:max_rounds:parallel, in order
        run: |
          inflight=$(gh run list -R "$GITHUB_REPOSITORY" --workflow setup-sharded.yml --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$inflight" != 0 ]; then echo "a sharded setup is running"; exit 0; fi
          for spec in $SETUP_QUEUE; do
            IFS=: read -r key shards chunk rounds parallel <<< "$spec"
            git cat-file -e "HEAD:data/exports/$key/setup.ci.json" 2> /dev/null && continue   # set up already
            failed=$(gh run list -R "$GITHUB_REPOSITORY" --workflow setup-sharded.yml --limit 100 --json displayTitle,conclusion \
              --jq "[.[] | select((.displayTitle | startswith(\"setup-sharded $key \")) and .conclusion == \"failure\")] | length")
            if [ "$failed" -ge 2 ]; then echo "$key: failed twice, left for a person"; continue; fi
            echo "dispatch setup $key ($shards shards)"
            [ "$DRY" = true ] || gh workflow run setup-sharded.yml -R "$GITHUB_REPOSITORY" --ref main -f key="$key" -f shards="$shards" -f expand_chunk="$chunk" -f max_rounds="$rounds" -f parallel="${parallel:-12}"
            break
          done
      - name: Plan and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          MAX: ${{ inputs.max_libraries || '6' }}
          JOB_BUDGET: "16"   # of the organisation's 20 runners; the rest stay free for competemath/tengoku
          DRY: ${{ inputs.dry_run || 'false' }}
          # agent passes also need the repository variable TRANSLATE_AGENT=on (off until the cloud agent is proven)
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && vars.TRANSLATE_AGENT == 'on' }}
        run: |
          gh run list -R "$GITHUB_REPOSITORY" --workflow translate.yml --limit 100 --json status,displayTitle \
            --jq '.[] | select(.status != "completed") | .displayTitle' > running.txt
          # runners are shared with the tree's own gate and merge queue (the organisation's concurrent-job limit): this
          # repository's workflows keep to JOB_BUDGET jobs in flight, so a PR on competemath/tengoku never waits on us
          # jobs RUNNING now: a matrix's jobs held back by max-parallel wait without a runner, and counting them starved
          # translation for hours behind flt-anthropic's 64-shard setup (12 running, 52 waiting)
          busy=0
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --limit 60 --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId'); do
            busy=$((busy + $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | select(.status == "in_progress")] | length')))
          done
          echo "$busy" > busy.txt
          python3 - <<'PY'
          import json, math, os, re, subprocess
          reg = json.load(open("sources.json"))["sources"]
          show = lambda p: subprocess.run(["git", "show", f"HEAD:{p}"], capture_output=True, text=True).stdout
          tracked = subprocess.run(["git", "ls-tree", "-r", "--name-only", "HEAD", "data/exports"], capture_output=True, text=True, check=True).stdout.split()
          ready = sorted({p.split("/")[2] for p in tracked if p.endswith("/setup.ci.json")})
          running = {m.group(1) for t in open("running.txt") for m in [re.match(r"translate (\S+) ", t)] if m}
          plan = []
          for key in ready:
              if key not in reg or key in running:
                  continue
              setup = json.loads(show(f"data/exports/{key}/setup.ci.json") or "{}")
              entries = (setup.get("seed") or {}).get("kept") or 0
              if not entries:
                  continue
              st = json.loads(open(f"data/translate/{key}.status.json").read()) if os.path.exists(f"data/translate/{key}.status.json") else {}
              need = lambda m: m not in st or ((st[m]["left"] > 0 or st[m].get("limited")) and st[m].get("stalls", 0) < 3)
              if need("mechanical"):
                  plan.append((0, entries, key, "mechanical", max(1, min(64, math.ceil(entries / 300)))))
              elif os.environ["HAS_CLAUDE"] == "true" and need("agent"):
                  plan.append((1, entries, key, "agent", 2))
          plan.sort()
          slots = max(0, int(os.environ["MAX"]) - len(running))
          jobs = int(os.environ["JOB_BUDGET"]) - int(open("busy.txt").read())
          agent_busy = any(" (agent," in t for t in open("running.txt"))
          chosen = []
          for _, entries, key, mode, shards in plan:
              if len(chosen) >= slots or jobs < 2:
                  break
              if mode == "agent" and (agent_busy or any(m == "agent" for _, m, _ in chosen)):
                  continue
              shards = min(shards, 12)   # translate.yml runs at most 12 shards at once anyway
              chosen.append((key, mode, shards))
              jobs -= min(shards, 12) + 1
          print(f"{len(ready)} libraries set up, {len(running)} running, {len(plan)} with work, {slots} library slots, {open('busy.txt').read().strip()} jobs busy")
          for key, mode, shards in chosen:
              print(f"dispatch {key} {mode} {shards} shards")
              if os.environ["DRY"] != "true":
                  subprocess.run(["gh", "workflow", "run", "translate.yml", "-R", os.environ["GITHUB_REPOSITORY"], "--ref", "main",
                                  "-f", f"key={key}", "-f", f"mode={mode}", "-f", f"shards={shards}"], check=True)
          PY

  flush:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write }   # moving sent bank files under sent/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { filter: "blob:none", sparse-checkout: "scripts\ndata/bank", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: Banked records to tengoku PRs
        env:
          BOT: ${{ secrets.TENGOKU_BOT_TOKEN }}
          # on only with the repository variable TRANSLATE_FLUSH=on (the first bot account was flagged by GitHub after
          # opening 38 PRs in minutes; every PR it had opened disappeared)
          FLUSH: ${{ vars.TRANSLATE_FLUSH || 'off' }}
          DRY: ${{ inputs.dry_run || 'false' }}
          ONLY: ${{ inputs.flush_key || '' }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$BOT" ]; then echo "no TENGOKU_BOT_TOKEN secret: the bank stays in data/bank until one is set"; exit 0; fi
          echo "the flush acts as: $(GH_TOKEN="$BOT" gh api user --jq .login 2>&1 | head -1)"
          # a flush_key given by hand (a one-library test) runs even while the scheduled flush is off
          if [ "$FLUSH" != on ] && [ -z "$ONLY" ]; then echo "flush is off (repository variable TRANSLATE_FLUSH): the bank stays in data/bank"; exit 0; fi
          only=(); [ -n "$ONLY" ] && only=(--key "$ONLY")
          if [ "$DRY" = true ]; then GH_TOKEN="$BOT" node scripts/bank-flush.mjs --dry-run "${only[@]}"; exit 0; fi
          # a few large PRs per run, never a burst: at most 3 PRs every quarter hour
          GH_TOKEN="$BOT" node scripts/bank-flush.mjs --batch 2000 --max-prs 3 "${only[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A --sparse -- data/bank
          git diff --cached --quiet && exit 0
          git commit -q -m "bank: sent to tengoku" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          for _ in $(seq 1 30); do
            if git pull -q --rebase origin main && git push -q "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then exit 0; fi
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
